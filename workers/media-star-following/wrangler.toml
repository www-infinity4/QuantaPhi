compatibility_date = "2026-10-11"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "media-star-following-spaces"
database_id = "0612b802-ec33-4eaa-9716-2870d36d5356"

[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "starquest-ledger"
database_id = "a1a973b2-a37c-4e1c-b68e-a73803238206"

# Optional authorized X connection. Both must be set as Cloudflare Worker
# secrets/configuration after an owner consents, never hard-coded into GitHub:
# X_USER_ACCESS_TOKEN = authenticated X user-scoped token
# X_OWNER_ID = authoritative QuantaPhi owner account ID
# Without BOTH, official X following/sync endpoints fail closed (HTTP 503).
