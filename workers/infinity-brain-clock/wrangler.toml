name = "infinity-brain-clock"
main = "worker.js"
# Preserve the owner-hash variable configured on the existing production Worker.
# Secrets and owner identity must survive a source-only staged upload.
keep_vars = true
compatibility_date = "2026-10-10"
[[d1_databases]]
binding = "WORK_DB"
database_name = "rogers-consensus" # Verified account D1 name; original ID/binding unchanged
database_id = "4aa6a463-02c6-48c3-854f-a87c0ca5f41c"
[[services]]
binding = "MODELS"
service = "infinity-rogers"
environment = "production"
# Verified active production version: the models service exports BrainModels.
entrypoint = "BrainModels"

# Preserve the existing authenticated bot-wallet settlement service on redeploy.
# It is a default service entrypoint, not BrainModels.
[[services]]
binding = "BOT_WALLET"
service = "unified-wallet"
environment = "production"
[[durable_objects.bindings]]
name = "CLOCK"
class_name = "BrainClock"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrainClock"]
[triggers]
crons = ["* * * * *"]

# The current 100% production Worker has no BRAIN_MEMORY binding.
# Keep this incremental rollout binding-identical to the verified stable
# Worker. Memory indexing remains optional in source; a later migration
# may opt into Vectorize after separate binding/permissions validation.

[ai]
binding = "WRITER_AI"

# BOT_WORK_SECRET (secret_text) and WRITER_OWNER_HASH (plain_text) exist on the
# deployed Worker; do not commit their values. Verify these bindings survive
# deployment before enabling bot payouts or owner-authorized job access.

# Refuse to stage an update if the existing payout secret is not configured.
[secrets]
required = ["BOT_WORK_SECRET"]
