name = "infinity-brain-clock"
main = "worker.js"
compatibility_date = "2026-10-10"
[[d1_databases]]
binding = "WORK_DB"
database_name = "infinity-work-tickets"
database_id = "4aa6a463-02c6-48c3-854f-a87c0ca5f41c"
[[services]]
binding = "MODELS"
service = "infinity-rogers"
entrypoint = "BrainModels"
[[durable_objects.bindings]]
name = "CLOCK"
class_name = "BrainClock"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrainClock"]
[triggers]
crons = ["* * * * *"]

[ai]
binding = "WRITER_AI"
