name = "bubbles-memory"
main = "worker.mjs"
compatibility_date = "2026-10-14"
[[d1_databases]]
binding = "MEMORY_DB"
database_name = "bubbles-memory"
database_id = "5b8667f2-4c48-41ee-b47c-ee86c57218ac"
[[services]]
binding = "BOT_WALLET"
service = "unified-wallet"
environment = "production"
entrypoint = "BrainModels"

# Explicit uploads and retrievals only; no public R2 bucket URL.
[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "bubbles-private-archive"
