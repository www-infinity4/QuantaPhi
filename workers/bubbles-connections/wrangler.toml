name = "bubbles-connections"
main = "worker.mjs"
compatibility_date = "2026-10-10"
keep_vars = true

# CONNECTIONS_READY is managed on the existing deployed Worker.
# Do not set or reset it here: keep_vars=true preserves the live value.
# New deployments without the variable remain disabled by default.

[[services]]
binding = "BOT_WALLET"
service = "unified-wallet"

[[services]]
binding = "STARQUEST_LEDGER"
service = "starquest-ledger"

[[durable_objects.bindings]]
name = "CONNECTIONS"
class_name = "UserConnections"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserConnections"]

# Server-only secrets: CONNECTION_KEYRING (JSON keyId -> 32-byte base64url key),
# CONNECTION_ACTIVE_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET; and the separate Bubbles public OAuth
# application CLOUDFLARE_CLIENT_ID, CLOUDFLARE_CLIENT_SECRET. Never reuse
# ChatGPT's Cloudflare OAuth client, any user's OAuth token, or the owner's GHP.
# The legacy CLOUDFLARE_OAUTH_ALLOWED_SCOPES stays intact until the three
# CLOUDFLARE_OAUTH_ALLOWED_SCOPES_PART_1..3 secrets are installed from the
# actual registered 386 scopes (each part below Cloudflare’s 5 KB limit).
# Source code accepts three parts only when complete and unique; never guess scopes.
