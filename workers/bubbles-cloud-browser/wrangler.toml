name = "bubbles-cloud-browser"
main = "worker.mjs"
compatibility_date = "2026-10-19"
[[services]]
binding = "BRAIN"
service = "infinity-brain-clock"
[[services]]
binding = "TOOLS"
service = "bubbles-tools"
[browser]
binding = "BROWSER"


# D1 queue lets connected ChatGPT Cloudflare tools exchange verifiable
# messages with the owner-approved Chrome session. No bearer secrets in rows.
[[d1_databases]]
binding = "BRIDGE_DB"
database_name = "rogers-consensus"
database_id = "4aa6a463-02c6-48c3-854f-a87c0ca5f41c"

[[durable_objects.bindings]]
name = "CONSENT"
class_name = "BrowserConsentStore"

[[migrations]]
tag = "browser-consent-v1"
new_sqlite_classes = ["BrowserConsentStore"]
