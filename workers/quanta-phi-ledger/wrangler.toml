name = "quanta-phi-ledger"
main = "worker.js"
compatibility_date = "2026-09-24"

[[d1_databases]]
binding = "DB"
database_name = "infinity-ledger"
database_id = "711b3e05-f318-4d30-9a67-4de2af92aa6d"

[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "starquest-ledger"
database_id = "a1a973b2-a37c-4e1c-b68e-a73803238206"

[triggers]
crons = ["* * * * *"]

# Required to store each unique original design once. R2 must be enabled and
# the bucket created before deploying this branch. No customer charges before
# the matching art is durably stored.
[[r2_buckets]]
binding = "COLLECTOR_ART"
bucket_name = "quantaphi-collector-art"
