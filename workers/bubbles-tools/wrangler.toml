name = "bubbles-tools"
main = "worker.mjs"
compatibility_date = "2026-10-12"
[[services]]
binding = "ORACLE"
service = "infinity-rogers"
environment = "production"
[[services]]
binding = "NEWS"
service = "news-phi-feed"
environment = "production"

[ai]
binding = "AI"

[[services]]
binding = "BRAIN"
service = "infinity-brain-clock"

[[services]]
binding = "SEARCH"
service = "orange-brook-a2ac"

# Remote Chromium with authenticated, owner-scoped Live View sessions.
[browser]
binding = "BROWSER"
