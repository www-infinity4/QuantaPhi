<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"><rect width="760" height="350" rx="22" fill="#f7f4fb"/><g font-family="system-ui,sans-serif" fill="#21172b"><text x="195" y="65" text-anchor="middle" font-size="27" font-weight="bold">Hydrogen-1</text><text x="565" y="65" text-anchor="middle" font-size="27" font-weight="bold">Hydrogen-2</text><circle cx="195" cy="150" r="44" fill="#5f259f"/><circle cx="520" cy="150" r="44" fill="#5f259f"/><circle cx="610" cy="150" r="44" fill="#a9c7f5"/><g fill="white" font-size="28" text-anchor="middle"><text x="195" y="160">p+</text><text x="520" y="160">p+</text></g><text x="610" y="160" font-size="28" text-anchor="middle">n</text><g font-size="23" text-anchor="middle"><text x="195" y="242">1 proton · 0 neutrons</text><text x="565" y="242">1 proton · 1 neutron</text><text x="195" y="280">Z = 1 · A = 1</text><text x="565" y="280">Z = 1 · A = 2</text><text x="380" y="326" fill="#5f259f">Same proton count → same element</text></g></g></svg>