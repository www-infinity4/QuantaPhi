<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubbles · Connected application card</title>
<style>
:root{font:15px/1.45 system-ui,sans-serif;color:#29232a;background:#f8f4ee}
body{margin:0;padding:12px}main{max-width:650px;margin:0 auto;padding:16px;border:1px solid #e1d4cb;background:#fff;border-radius:17px}
h1{font:700 23px/1.2 Georgia,serif;margin:0 0 6px}p{color:#605560;margin:8px 0 13px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}

a.primary,.tools button:first-child,form button{color:#fff;background:#a62c35}
input{box-sizing:border-box;width:100%;min-height:46px;margin:6px 0 8px;padding:9px;border:1px solid #ad9d92;border-radius:9px;font:16px system-ui,sans-serif}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #cd812e;outline-offset:3px}
small{display:block;margin-top:12px;color:#65565b}
</style></head><body><main id="providerCard" role="main">
