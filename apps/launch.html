<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#28143e"><meta name="robots" content="noindex"><link rel="stylesheet" href="/apps/suite.css"><script src="/apps/config.js"></script>
<script>(function(){const slug=new URLSearchParams(location.search).get("app");const app=(window.INFINITY_APPS||[]).find(a=>a.slug===slug);if(!app){location.replace("/apps/");return;}window.INFINITY_SELECTED_APP=app;const l=document.createElement("link");l.rel="manifest";l.href="/apps/manifests/"+app.slug+".json";document.head.appendChild(l);document.title=app.name+" · Infinity 2026";document.querySelector('meta[name="theme-color"]').content=app.color;})();</script><script src="/apps/launch.js" defer></script></head>
<body class="launcher"><header class="launch-bar"><a class="back" href="/apps/" aria-label="All Chrome apps">‹ Apps</a><span class="launch-brand" id="appBrand">Infinity app</span><button id="installApp" type="button">Install in Chrome</button></header>
<p class="install-status" id="installStatus" role="status" aria-live="polite">Loading the original website…</p>
<main class="app-screen"><iframe id="appView" title="Infinity website app" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; clipboard-write; microphone"></iframe></main>
<footer class="launch-footer"><a id="sourceUrl" href="/" target="_blank" rel="noopener noreferrer">Open full website ↗</a><span>The live app uses the existing QuantaPhi origin and account session.</span></footer></body></html>
