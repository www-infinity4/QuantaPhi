name: Creator post Quick Cards
on:
  pull_request:
    paths:
      - 'creator-post-*.mjs'
      - 'youtube-creator-*.mjs'
      - 'julie-deru-catalog.mjs'
      - 'test/julie-deru-quick-cards.test.mjs'
      - 'workers/quantaphi-site/creator-uploads.mjs'
      - 'youtube-creator-mixed-*.mjs'
      - 'test/youtube-creator-mixed.test.mjs'
      - 'family-parenting-tv*.mjs'
      - 'milk-mamas-catalog.mjs'
      - 'test/milk-mamas-quick-card.test.mjs'
      - 'workers/family-parenting-tv/**'
      - 'test/family-parenting-tv.test.mjs'
      - 'test/youtube-creator-*.test.mjs'
      - 'data/creator-posts.mjs'
      - 'scripts/import-creator-posts.mjs'
      - 'source-quick-cards.mjs'
      - 'quanta-card-experience.*'
      - 'quanta-context-placement.mjs'
      - 'quanta-feed.mjs'
      - 'index.html'
      - 'test/creator-post*'
      - '.github/workflows/creator-post-cards.yml'
  push:
    branches: [main]
    paths:
      - 'creator-post-*.mjs'
      - 'youtube-creator-*.mjs'
      - 'julie-deru-catalog.mjs'
      - 'test/julie-deru-quick-cards.test.mjs'
      - 'workers/quantaphi-site/creator-uploads.mjs'
      - 'youtube-creator-mixed-*.mjs'
      - 'test/youtube-creator-mixed.test.mjs'
      - 'family-parenting-tv*.mjs'
      - 'milk-mamas-catalog.mjs'
      - 'test/milk-mamas-quick-card.test.mjs'
      - 'workers/family-parenting-tv/**'
      - 'test/family-parenting-tv.test.mjs'
      - 'test/youtube-creator-*.test.mjs'
      - 'data/creator-posts.mjs'
      - 'scripts/import-creator-posts.mjs'
      - 'source-quick-cards.mjs'
      - 'quanta-card-experience.*'
      - 'quanta-context-placement.mjs'
      - 'quanta-feed.mjs'
      - 'test/creator-post*'
      - '.github/workflows/creator-post-cards.yml'
permissions:
  contents: read
jobs:
  source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check YouTube and family channel modules
        run: |
          node --check youtube-creator-catalog.mjs
          node --check youtube-creator-cards.mjs
          node --check julie-deru-catalog.mjs
          node --check youtube-creator-mixed-core.mjs
          node --check youtube-creator-mixed-card.mjs
          node --check workers/quantaphi-site/creator-uploads.mjs
          node --check milk-mamas-catalog.mjs
          node --check family-parenting-tv-core.mjs
          node --check family-parenting-tv-card.mjs
          node --check workers/family-parenting-tv/worker.mjs
      - name: Verify database, placement and source integration
        run: node --test test/milk-mamas-quick-card.test.mjs test/family-parenting-tv.test.mjs test/youtube-creator-quick-cards.test.mjs test/julie-deru-quick-cards.test.mjs test/youtube-creator-mixed.test.mjs test/creator-posts.test.mjs test/source-quick-cards.test.mjs test/quanta-card-feed.test.mjs test/quanta-card-experience.test.mjs test/oracle-placement-engine.test.mjs test/oracle-feed-persistence.test.mjs test/cardone-offer.test.cjs test/unfinished-ledger.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
      - name: Verify actual source card and Oracle at mobile and desktop widths
        run: python test/creator-post-cards.browser.py
