name: Phi image-quality regressions
on:
  push:
    branches: [main]
    paths:
      - 'phi-image*.js'
      - 'phi-video-builder.js'
      - 'phi-media-studio.js'
      - 'oracle-video-studio.css'
      - 'video-studio.html'
      - 'test/phi-video-builder.test.cjs'
      - 'test/phi-media-studio.browser.cjs'
      - 'phi-visual-render.js'
      - 'phi-image-builder.css'
      - 'fred-spaces-radio.css'
      - 'fred-spaces-radio.js'
      - 'phi-electric-theme.css'
      - 'phi-page-ui.js'
      - 'test/phi-electric-ui.test.cjs'
      - 'infinite-book.css'
      - 'infinite-book.js'
      - 'phi-book-image-bridge.js'
      - 'phi-book-illustrations.css'
      - 'phi-story-writer.js'
      - 'index.html'
      - 'test/story-illustration-lettering.test.cjs'
      - 'workers/infinity-rogers/worker.js'
      - 'test/phi-image-quality.test.cjs'
      - 'test/phi-image-language.test.cjs'
      - 'test/oracle-image-studio.browser.cjs'
      - 'test/phi-unlimited-generation.test.cjs'
      - '.github/workflows/phi-image-quality.yml'
  pull_request:
    paths:
      - 'phi-image*.js'
      - 'phi-video-builder.js'
      - 'phi-media-studio.js'
      - 'oracle-video-studio.css'
      - 'video-studio.html'
      - 'test/phi-video-builder.test.cjs'
      - 'test/phi-media-studio.browser.cjs'
      - 'phi-visual-render.js'
      - 'phi-image-builder.css'
      - 'fred-spaces-radio.css'
      - 'fred-spaces-radio.js'
      - 'phi-electric-theme.css'
      - 'phi-page-ui.js'
      - 'test/phi-electric-ui.test.cjs'
      - 'infinite-book.css'
      - 'infinite-book.js'
      - 'phi-book-image-bridge.js'
      - 'phi-book-illustrations.css'
      - 'phi-story-writer.js'
      - 'index.html'
      - 'test/story-illustration-lettering.test.cjs'
      - 'workers/infinity-rogers/worker.js'
      - 'test/phi-image-quality.test.cjs'
      - 'test/phi-image-language.test.cjs'
      - 'test/oracle-image-studio.browser.cjs'
      - 'test/phi-unlimited-generation.test.cjs'
      - '.github/workflows/phi-image-quality.yml'
jobs:
  image-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify visual review and local learning contracts
        run: |
          node --check fred-spaces-radio.js
          node --check phi-page-ui.js
          node --test test/phi-image-quality.test.cjs test/phi-electric-ui.test.cjs test/phi-unlimited-generation.test.cjs test/story-illustration-lettering.test.cjs test/phi-image-language.test.cjs test/phi-video-builder.test.cjs
      - name: Install test-only browser for image and video acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify existing image repair and shared video export on Android
        run: |
          node test/oracle-image-studio.browser.cjs
          node test/phi-media-studio.browser.cjs
