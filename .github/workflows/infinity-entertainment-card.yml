name: Infinity entertainment card safety
on:
  pull_request:
    paths:
      - 'index.html'
      - 'oracle-card-deck.js'
      - 'infinity-entertainment-*'
      - 'test/infinity-entertainment-card.test.mjs'
      - '.github/workflows/infinity-entertainment-card.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'oracle-card-deck.js'
      - 'infinity-entertainment-*'
      - 'test/infinity-entertainment-card.test.mjs'
      - '.github/workflows/infinity-entertainment-card.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/infinity-entertainment-card.test.mjs
