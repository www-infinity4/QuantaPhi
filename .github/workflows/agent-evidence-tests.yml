name: Agent evidence catalog tests

on:
  pull_request:
    paths:
      - 'services/agent-evidence/**'
      - '.github/workflows/agent-evidence-tests.yml'
  push:
    branches:
      - 'agent/evidence-catalog-1489'
    paths:
      - 'services/agent-evidence/**'
      - '.github/workflows/agent-evidence-tests.yml'

permissions:
  contents: read

jobs:
  node-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated API and collector contracts
        run: node --test services/agent-evidence/test/worker.test.mjs
