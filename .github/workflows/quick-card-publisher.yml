name: Quick Card publisher regression
on:
  pull_request:
    paths:
      - 'workers/quick-card-publisher/**'
      - 'test/quick-card-publisher.test.mjs'
      - 'published-quick-card*'
      - 'quick-card-builder*'
      - 'quick-card-share.js'
      - 'bubbles-x-connect.html'
      - 'test/quick-card-share.test.mjs'
      - 'test/quick-card-preview.test.mjs'
      - 'quick-card-preview.mjs'
      - 'quick-card-preview.css'
      - 'quanta-card-actions.mjs'
      - 'quanta-feed.mjs'
      - 'index.html'
      - '.github/workflows/quick-card-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'workers/quick-card-publisher/**'
      - 'test/quick-card-publisher.test.mjs'
      - 'published-quick-card*'
      - 'quick-card-builder*'
      - 'quick-card-share.js'
      - 'bubbles-x-connect.html'
      - 'test/quick-card-share.test.mjs'
      - 'test/quick-card-preview.test.mjs'
      - 'quick-card-preview.mjs'
      - 'quick-card-preview.css'
      - 'quanta-card-actions.mjs'
      - 'quanta-feed.mjs'
      - 'index.html'
      - '.github/workflows/quick-card-publisher.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check workers/quick-card-publisher/worker.mjs
          node --check published-quick-card.js
          node --check published-quick-cards-feed.js
          node --check quick-card-builder.js
          node --check quick-card-share.js
          node --check quick-card-preview.mjs
          node --check quanta-card-actions.mjs
          node --check quanta-feed.mjs
      - name: Live Cloudflare card API readback
        run: |
          curl --fail --show-error --silent --max-time 15 https://quantaphi.org/api/quick-cards/health | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const r=JSON.parse(b);if(r.ok!==true||r.storage!=='connected')process.exit(1);console.log('Live Quick Card D1 route verified')})"
      - name: Public builder and card assets readback
        run: |
          curl --fail --show-error --silent --max-time 20 https://quantaphi.org/quick-card-builder.html | grep -q 'id="quickCardCreate"'
          curl --fail --show-error --silent --max-time 20 https://quantaphi.org/published-quick-card.js | grep -q 'paintCard'
          curl --fail --show-error --silent --max-time 20 https://quantaphi.org/published-quick-card.css | grep -q 'qcp-card'
      - name: Execute publisher tests
        run: node --test test/quick-card-publisher.test.mjs test/quick-card-share.test.mjs test/quick-card-preview.test.mjs
