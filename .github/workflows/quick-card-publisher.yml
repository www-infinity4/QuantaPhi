name: Quick Card publisher regression
on:
  pull_request:
    paths:
      - 'workers/quick-card-publisher/**'
      - 'test/quick-card-publisher.test.mjs'
      - 'published-quick-card*'
      - 'quick-card-builder*'
      - 'index.html'
      - '.github/workflows/quick-card-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'workers/quick-card-publisher/**'
      - 'test/quick-card-publisher.test.mjs'
      - 'published-quick-card*'
      - 'quick-card-builder*'
      - 'index.html'
      - '.github/workflows/quick-card-publisher.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check workers/quick-card-publisher/worker.mjs
          node --check published-quick-card.js
          node --check published-quick-cards-feed.js
          node --check quick-card-builder.js
      - name: Live Cloudflare card API readback
        run: |
          curl --fail --show-error --silent --max-time 15 https://quantaphi.org/api/quick-cards/health | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const r=JSON.parse(b);if(r.ok!==true||r.storage!=='connected')process.exit(1);console.log('Live Quick Card D1 route verified')})"
      - name: Public builder and card assets readback
        run: |
          curl --fail --show-error --silent --max-time 20 https://quantaphi.org/quick-card-builder.html | grep -q 'id="quickCardCreate"'
          curl --fail --show-error --silent --max-time 20 https://quantaphi.org/published-quick-card.js | grep -q 'paintCard'
          curl --fail --show-error --silent --max-time 20 https://quantaphi.org/published-quick-card.css | grep -q 'qcp-card'
      - name: Temporary live publishing acceptance
        run: |
          node --input-type=module <<'JS'
          const base='https://quantaphi.org';
          const form={title:'Quick Card Smoke Test '+Date.now(),website:'https://www.google.com/',description:'Automated one-time verification of durable shareable card publication.',interactionRequest:'Open the real website and show the requested interaction on a durable card.',kind:'visit'};
          const post=await fetch(base+'/api/quick-cards',{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:JSON.stringify(form)});
          const created=await post.json();
          if(post.status!==201||!created.ok||!created.cardUrl?.startsWith(base+'/cards/'))throw Error('POST failed: '+post.status+' '+JSON.stringify(created));
          const detail=await fetch(base+'/api/quick-cards/'+created.slug);
          const d=await detail.json();
          if(detail.status!==200||!d.ok||d.card.status!=='unlisted')throw Error('Saved card not found by API');
          const page=await fetch(created.cardUrl);
          const html=await page.text();
          if(page.status!==200||!html.includes('publishedQuickCard')||!html.includes('noindex,follow'))throw Error('Canonical HTML/OG card not served');
          const feed=await fetch(base+'/api/quick-cards');const listed=await feed.json();
          if(!feed.ok||!listed.ok||listed.cards.some(c=>c.slug===created.slug))throw Error('Unlisted item leaked to Public feed');
          console.log('VERIFIED_UNLISTED_SLUG='+created.slug);
          JS
      - name: Execute publisher tests
        run: node --test test/quick-card-publisher.test.mjs
