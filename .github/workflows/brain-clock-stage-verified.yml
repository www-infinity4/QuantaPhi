name: Robot Brain safe staging (not production deployment)

on:
  push:
    branches: [main]
    paths:
      - 'workers/infinity-brain-clock/**'
      - '.github/workflows/brain-clock-stage-verified.yml'
      - 'scripts/verify-brain-stage.mjs'
  workflow_dispatch:
    inputs:
      operation:
        description: "dry_run tests only, or stage a new Cloudflare Worker version without serving traffic"
        type: choice
        options:
          - dry_run
          - stage_version
        required: true
        default: dry_run

permissions:
  contents: read

concurrency:
  group: brain-clock-verified-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Brain auth, queue priority, source windows and owner boundaries
        run: |
          node --check workers/infinity-brain-clock/worker.js
          node --check workers/infinity-brain-clock/ticket-selector.mjs
          node --check workers/infinity-brain-clock/deferred-recovery.mjs
          node --check workers/infinity-brain-clock/source-review.mjs
          node --test test/brain-pink-source-review.test.mjs
          node --check scripts/verify-brain-stage.mjs
          node --test test/brain-clock-stage.test.mjs \
            test/brain-clock-binding-parity.test.mjs
          node --test \
            test/brain-ticket-selector.test.mjs \
            test/brain-deferred-recovery.test.mjs \
            test/brain-cloudflare-token-broker.test.mjs \
            test/brain-queue-order.test.mjs \
            test/brain-clock.test.mjs \
            test/bubbles-runner-dispatch.test.mjs \
            workers/infinity-brain-clock/arbitration-evidence.test.mjs
      - name: Validate source-only bundle without publishing
        run: |
          npx --yes wrangler@4 deploy \
            --config workers/infinity-brain-clock/wrangler.toml \
            --dry-run --outdir /tmp/brain-clock-staged-build
      - name: Verify original live version, binding identities and owner safety
        if: ${{ github.event_name == 'push' || inputs.operation == 'stage_version' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-brain-stage.mjs before
      - name: Upload immutable version without deployment (0% traffic)
        if: ${{ github.event_name == 'push' || inputs.operation == 'stage_version' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 versions upload \
            --config workers/infinity-brain-clock/wrangler.toml \
            --message "Verified deferred recovery and owner priority, commit $GITHUB_SHA"
      - name: Prove staged version has the same bindings and live traffic is unchanged
        if: ${{ github.event_name == 'push' || inputs.operation == 'stage_version' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-brain-stage.mjs after
      - name: Upload signed source version verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-clock-staging-verification
          path: repository-receipts/brain-clock-staged-version.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish truthful staging result
        if: always()
        shell: bash
        env:
          OPERATION: ${{ github.event_name == 'push' && 'stage_version' || inputs.operation }}
        run: |
          {
            echo '## Robot Brain release gate'
            echo "Operation requested: $OPERATION"
            echo 'This workflow never deploys a Worker or changes traffic percentages.'
            echo 'It cannot claim live Brain behavior, owner authentication or job execution success.'
            echo 'Before promoting any staged version, independently compare required binding names/types, security controls and a signed owner job receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
