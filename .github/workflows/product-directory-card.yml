name: Product directory Quick Card · original Oracle viewer
on:
  pull_request:
    paths:
      - 'product-directory-*'
      - 'index.html'
      - 'oracle-card-deck.js'
      - 'workers/product-directory/**'
      - 'test/product-directory-*'
      - '.github/workflows/product-directory-card.yml'
  workflow_dispatch:
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check product-directory-core.mjs
          node --check product-directory-card.mjs
          node --check oracle-card-deck.js
          node --check workers/product-directory/worker.mjs
      - name: Verify catalog and homepage integration contracts
        run: node --test test/product-directory-core.test.mjs test/product-directory-site.test.mjs test/product-directory-worker.test.mjs
      - name: Install Chromium for targeted browser acceptance
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Android-width catalog browsing
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/product-directory-browser.log 2>&1 &
          npx playwright test test/product-directory-card.browser.spec.mjs --reporter=line --workers=1
