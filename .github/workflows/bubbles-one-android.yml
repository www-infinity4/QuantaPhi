name: Bubbles One clean APK
on:
  pull_request:
    paths:
      - 'android/bubbles-one/**'
      - 'test/bubbles-one-contract.test.mjs'
      - '.github/workflows/bubbles-one-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/bubbles-one/**'
      - 'test/bubbles-one-contract.test.mjs'
      - '.github/workflows/bubbles-one-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        run: |
          set -euo pipefail
          TOOL="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)"
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - name: Contract checks
        run: node --test test/bubbles-one-contract.test.mjs
      - name: Restore preview-only signing identity
        uses: actions/cache@v4
        with:
          path: android/bubbles-one/preview-one.keystore
          key: bubbles-one-preview-key-v1
      - name: Create test signing key once
        run: |
          set -euo pipefail
          KEY=android/bubbles-one/preview-one.keystore
          if [ ! -s "$KEY" ]; then
            keytool -genkeypair -noprompt -keystore "$KEY" -storepass android -keypass android \
              -alias bubblesone -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Bubbles One Test,O=QuantaPhi,C=US"
          fi
      - name: Build fresh standalone app
        working-directory: android/bubbles-one
        run: gradle --no-daemon assembleDebug
      - name: Verify compiled APK and signer
        run: |
          set -euo pipefail
          APK=android/bubbles-one/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          test -s "$APK"
          "$SDK/apksigner" verify --verbose "$APK"
          "$SDK/aapt" dump badging "$APK" | tee /tmp/bubbles-one-badging.txt
          grep -q "name='org.quantaphi.bubblesone'" /tmp/bubbles-one-badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: bubbles-one-clean-android12
          path: android/bubbles-one/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bubbles-one-clean-android12
          path: dist
      - name: Publish actual installable APK (not zipped artifact)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv dist/app-debug.apk dist/Bubbles-One-Android12.apk
          (cd dist && sha256sum Bubbles-One-Android12.apk > Bubbles-One-Android12.apk.sha256)
          if gh release view bubbles-one-preview --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload bubbles-one-preview dist/Bubbles-One-Android12.apk dist/Bubbles-One-Android12.apk.sha256 --clobber --repo "$GH_REPO"
          else
            gh release create bubbles-one-preview dist/Bubbles-One-Android12.apk dist/Bubbles-One-Android12.apk.sha256 \
              --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Bubbles One — clean Android preview" \
              --notes "New standalone app, not the prior Bubbles Preview. Android 8+; Android 12 Motorola target. Test signed; device testing required."
          fi
