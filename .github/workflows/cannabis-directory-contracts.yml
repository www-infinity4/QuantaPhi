name: Cannabis Directory · organic source contracts
on:
  pull_request:
    paths:
      - 'cannabis-directory-policy.mjs'
      - 'workers/cannabis-directory.mjs'
      - 'test/cannabis-directory*.test.mjs'
      - '.github/workflows/cannabis-directory-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check cannabis-directory-policy.mjs
          node --check workers/cannabis-directory.mjs
      - name: Organic directory, state policy, privacy and no-ad tests
        run: node --test test/cannabis-directory.test.mjs test/cannabis-directory-worker.test.mjs
