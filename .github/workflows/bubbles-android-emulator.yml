name: Bubbles Android emulator smoke
on:
  pull_request:
    paths:
      - 'android/bubbles-overlay/**'
      - 'test/bubbles-emulator-smoke.sh'
      - '.github/workflows/bubbles-android-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Boot an Android 15 x86_64 emulator and launch the compiled APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          script: bash test/bubbles-emulator-smoke.sh
      - name: Preserve emulator crash logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-emulator-smoke-evidence
          path: /tmp/bubbles-emulator/
          if-no-files-found: warn
