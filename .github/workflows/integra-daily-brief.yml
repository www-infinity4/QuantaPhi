name: Integra daily brief (read-only evidence)
on:
  pull_request:
    paths:
      - 'scripts/integra-daily-brief.mjs'
      - 'test/integra-daily-brief.test.mjs'
      - '.github/workflows/integra-daily-brief.yml'
      - 'work/unfinished/TICKET-1278.md'
  push:
    branches:
      - 'feat/integra-evidence-daily-brief-20261031'
    paths:
      - 'scripts/integra-daily-brief.mjs'
      - 'test/integra-daily-brief.test.mjs'
      - '.github/workflows/integra-daily-brief.yml'
jobs:
  source-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Syntax and bounded read-only daily draft tests
        run: |
          node --check scripts/integra-daily-brief.mjs
          node --test test/integra-daily-brief.test.mjs
