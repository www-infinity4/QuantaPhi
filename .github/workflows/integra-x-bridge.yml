name: Integra X Browser Bridge
on:
  pull_request:
    paths:
      - 'bubbles-integra-x.mjs'
      - 'provider-quick-cards.mjs'
      - 'gemini-owner-browser-card.mjs'
      - 'source-quick-cards.mjs'
      - 'workers/infinity-brain-clock/provider-browser.mjs'
      - 'test/provider-browser-cards.test.mjs'
      - 'test/source-quick-cards.test.mjs'
      - 'test/quick-card-tinyfish.test.mjs'
      - 'quick-card-tinyfish-actions.mjs'
      - 'workers/infinity-brain-clock/quick-card-browser.mjs'
      - 'workers/infinity-brain-clock/quick-card-browser-policy.mjs'
      - 'bubbles-ai.js'
      - 'workers/infinity-brain-clock/integra-x.mjs'
      - 'workers/infinity-brain-clock/worker.js'
      - 'test/bubbles-integra-x.test.mjs'
      - '.github/workflows/integra-x-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source parse checks
        run: |
          node --check bubbles-integra-x.mjs
          node --check provider-quick-cards.mjs
          node --check gemini-owner-browser-card.mjs
          node --check source-quick-cards.mjs
          node --check quick-card-tinyfish-actions.mjs
          node --check workers/infinity-brain-clock/quick-card-browser.mjs
          node --check workers/infinity-brain-clock/quick-card-browser-policy.mjs
          node --check workers/infinity-brain-clock/provider-browser.mjs
          node --check bubbles-ai.js
          node --check workers/infinity-brain-clock/integra-x.mjs
          node --check workers/infinity-brain-clock/worker.js
      - name: Read/draft/confirm/status safety checks
        run: node --test test/bubbles-integra-x.test.mjs test/provider-browser-cards.test.mjs test/source-quick-cards.test.mjs test/quick-card-tinyfish.test.mjs
