name: Bubbles Cloud Browser Agent
on:
  pull_request:
    paths:
      - 'workers/bubbles-tools/browser-cdp.mjs'
      - 'workers/bubbles-tools/browser.mjs'
      - 'workers/bubbles-cloud-browser/**'
      - 'test/bubbles-chatgpt-bridge.test.mjs'
      - 'test/bubbles-chatgpt-continuation.test.mjs'
      - 'test/bubbles-background-bridge.test.mjs'
      - 'test/bubbles-runner-bridge.test.mjs'
      - 'bubbles-cloud-browser.mjs'
      - 'bubbles-chatgpt-continuity.mjs'
      - 'bubbles-chatgpt-loop.mjs'
      - 'workers/bubbles-tools/chatgpt-*.mjs'
      - 'test/bubbles-chatgpt-loop.test.mjs'
      - 'test/bubbles-chatgpt-background.test.mjs'
      - 'test/bubbles-continuity-preview.test.mjs'
      - 'test/bubbles-chatgpt-login.test.mjs'
      - 'test/bubbles-background-bridge.test.mjs'
      - 'bubbles-ai.js'
      - 'test/bubbles-browser-agent.test.mjs'
      - '.github/workflows/bubbles-browser-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check workers/bubbles-tools/browser-cdp.mjs
          node --check workers/bubbles-tools/browser.mjs
          node --check workers/bubbles-cloud-browser/chatgpt-bridge.mjs
          node --check workers/bubbles-cloud-browser/worker.mjs
          node --check bubbles-cloud-browser.mjs
          node --check bubbles-chatgpt-continuity.mjs
          node --check bubbles-chatgpt-loop.mjs
          node --check workers/bubbles-tools/chatgpt-login.mjs
          node --check workers/bubbles-cloud-browser/continuation.mjs
          node --check workers/bubbles-cloud-browser/preview.mjs
          node --check bubbles-ai.js
          node --test test/bubbles-browser-agent.test.mjs test/bubbles-cloud-browser.test.mjs test/bubbles-chatgpt-bridge.test.mjs test/bubbles-browser-consent.test.mjs test/bubbles-background-bridge.test.mjs test/bubbles-runner-bridge.test.mjs test/bubbles-server-assist.test.mjs test/bubbles-chatgpt-continuation.test.mjs test/bubbles-chatgpt-loop.test.mjs test/bubbles-chatgpt-background.test.mjs test/bubbles-continuity-preview.test.mjs test/bubbles-chatgpt-login.test.mjs test/bubbles-star-continuation.test.mjs
