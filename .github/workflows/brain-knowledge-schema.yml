name: Infinity Robot Knowledge Schema Gate
on:
  push:
    branches: [main]
    paths:
      - 'workers/infinity-brain-clock/knowledge-schema.sql'
      - 'test/brain-knowledge-schema.test.cjs'
      - '.github/workflows/brain-knowledge-schema.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workers/infinity-brain-clock/knowledge-schema.sql'
      - 'test/brain-knowledge-schema.test.cjs'
      - '.github/workflows/brain-knowledge-schema.yml'
permissions:
  contents: read
jobs:
  validate-additive-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/brain-knowledge-schema.test.cjs
