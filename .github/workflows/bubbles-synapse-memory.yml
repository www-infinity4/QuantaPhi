name: Bubbles Synapse Memory
on:
  pull_request:
    paths:
      - 'workers/bubbles-memory/**'
      - 'bubbles-memory.js'
      - 'bubbles-ai.js'
      - 'test/bubbles-synapse-memory.test.mjs'
      - 'test/bubbles-memory.test.mjs'
      - '.github/workflows/bubbles-synapse-memory.yml'
  push:
    branches: [main]
    paths:
      - 'workers/bubbles-memory/**'
      - 'bubbles-memory.js'
      - 'bubbles-ai.js'
      - 'test/bubbles-synapse-memory.test.mjs'
      - 'test/bubbles-memory.test.mjs'
      - '.github/workflows/bubbles-synapse-memory.yml'
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check workers/bubbles-memory/synapse-memory.mjs && node --check workers/bubbles-memory/worker.mjs && node --check bubbles-memory.js && node --check bubbles-ai.js
      - run: node --test test/bubbles-synapse-memory.test.mjs test/bubbles-memory.test.mjs
