name: Tenant context schema checks
on:
  pull_request:
    paths:
      - 'design-lab/tenant-context-schema.sql'
      - 'test/design-lab-tenant-context.test.mjs'
      - 'docs/QUANTAPHI-CORE-ASSET-PRODUCTION-GATES.md'
      - '.github/workflows/quanta-tenant-context.yml'
  workflow_dispatch:
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-scoped SQL constraints
        run: node --test test/design-lab-tenant-context.test.mjs
