name: Bubbles hashtag order security tests
on:
  pull_request:
    paths:
      - 'workers/infinity-brain-clock/bubbles-social-orders.mjs'
      - 'workers/infinity-brain-clock/worker.js'
      - 'test/bubbles-social-orders.test.mjs'
      - '.github/workflows/bubbles-hashtag-orders.yml'
  push:
    branches: [main]
    paths:
      - 'workers/infinity-brain-clock/bubbles-social-orders.mjs'
      - 'workers/infinity-brain-clock/worker.js'
      - 'test/bubbles-social-orders.test.mjs'
      - '.github/workflows/bubbles-hashtag-orders.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/bubbles-social-orders.test.mjs
