name: Bubbles Door Knocker regression
on:
  pull_request:
    paths:
      - 'workers/infinity-brain-clock/door-knocker.mjs'
      - 'test/door-knocker.test.mjs'
      - '.github/workflows/door-knocker.yml'
  push:
    branches: [main]
    paths:
      - 'workers/infinity-brain-clock/door-knocker.mjs'
      - 'test/door-knocker.test.mjs'
jobs:
  checkpoint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/door-knocker.test.mjs
