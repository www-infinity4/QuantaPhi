name: Infinity Platinum Phone web switchboard
on:
  pull_request:
    paths:
      - "phone/**"
      - "workers/platinum-switchboard/**"
      - "workers/quantaphi-site/worker.js"
      - "platinum/**"
      - "test/platinum-phone.test.cjs"
      - "test/infinity-quickdial.test.cjs"
      - ".github/workflows/platinum-phone.yml"
  push:
    branches: [main]
    paths:
      - "phone/**"
      - "workers/platinum-switchboard/**"
      - "workers/quantaphi-site/worker.js"
      - "platinum/**"
      - "test/platinum-phone.test.cjs"
      - "test/infinity-quickdial.test.cjs"
      - ".github/workflows/platinum-phone.yml"
jobs:
  switchboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/platinum-phone.test.cjs test/infinity-quickdial.test.cjs
      - run: node --check phone/quickdial.js && node --check phone/phone.js
      - name: Verify deployed switchboard health and Durable Object binding
        shell: bash
        run: |
          node - <<'NODE'
          (async () => {
            const base = 'https://infinity-switchboard.marvaseater.workers.dev';
            const health = await fetch(base+'/health');
            const h = await health.json();
            if (!health.ok || h.service !== 'infinity-platinum-switchboard') throw Error('Switchboard health failed: '+JSON.stringify(h));
            const profile = await fetch(base+'/v1/line/infinityhealthcheckonly');
            const p = await profile.json();
            if (!profile.ok || p.registered !== false) throw Error('Durable Object profile failed: '+JSON.stringify(p));
            console.log('Live switchboard health and directory binding verified');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
