name: Radio Clubhouse live source contract
on:
  pull_request:
    paths:
      - 'radio-clubhouse.*'
      - 'index.html'
      - 'workers/radio-clubhouse-feed/worker.js'
      - 'tests/radio-clubhouse.test.mjs'
      - 'tests/radio-clubhouse-ui.test.mjs'
      - '.github/workflows/radio-clubhouse.yml'
  push:
    branches: [main]
    paths:
      - 'radio-clubhouse.*'
      - 'workers/quantaphi-site/worker.js'
      - 'tests/radio-clubhouse.test.mjs'
permissions:
  contents: read
jobs:
  radio-clubhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check browser and worker syntax
        run: |
          node --check radio-clubhouse.js
          node --check workers/radio-clubhouse-feed/worker.js
      - name: Verify source, newest-first and no backfill behavior
        run: node --test tests/radio-clubhouse.test.mjs tests/radio-clubhouse-ui.test.mjs
