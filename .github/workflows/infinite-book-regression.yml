name: Infinite Book secret-story regressions
on:
  pull_request:
    paths:
      - 'infinite-book*.js'
      - 'infinite-book-catalog.json'
      - 'workers/infinite-book-library/**'
      - 'test/infinite-book*.cjs'
      - '.github/workflows/infinite-book-regression.yml'
  push:
    branches: [main]
    paths:
      - 'infinite-book*.js'
      - 'infinite-book-catalog.json'
      - 'test/infinite-book*.cjs'
      - '.github/workflows/infinite-book-regression.yml'
jobs:
  secret-stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check writer and gateway syntax
        run: |
          node --check infinite-book.js
          node --check infinite-book-discovery.js
          node --check workers/infinite-book-library/worker.js
          node --check workers/infinity-rogers/worker.js
      - name: Verify rolled research, GPT writing and source checks
        run: node --test test/infinite-book-resilience.test.cjs test/infinite-book-four-roll.test.cjs
