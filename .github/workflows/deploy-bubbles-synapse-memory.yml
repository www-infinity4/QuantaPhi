name: Deploy Bubbles Synapse Memory
on:
  push:
    branches: [main]
    paths:
      - 'workers/bubbles-memory/**'
      - 'bubbles-memory.js'
      - '.github/workflows/deploy-bubbles-synapse-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubbles-synapse-memory-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate module syntax and owner-isolated memory tests
        run: |
          node --check workers/bubbles-memory/synapse-memory.mjs
          node --check workers/bubbles-memory/worker.mjs
          node --check bubbles-memory.js
          node --test test/bubbles-synapse-memory.test.mjs test/bubbles-memory.test.mjs
      - name: Verify existing Cloudflare deployment credentials
        id: authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Memory code checks passed. Cloudflare deployment credentials are unavailable in this workflow; live memory is NOT confirmed."
          fi
      - name: Deploy private memory Worker with current D1 and wallet service bindings
        if: steps.authorization.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/bubbles-memory/wrangler.toml
      - name: Verify production Worker exposes deployed synapse capability
        if: steps.authorization.outputs.available == 'true'
        run: |
          node --input-type=module <<'VERIFY'
          const r=await fetch('https://bubbles-memory.marvaseater.workers.dev/health',{headers:{'Cache-Control':'no-cache'}});
          const j=await r.json();
          if(!r.ok||j.service!=='bubbles-memory'||j.synapseMemory!==true)
            throw Error('Production synapse memory Worker deployment not confirmed');
          console.log('Production memory Worker synapse route declared; private owner-specific writes still require phone and website acceptance tests.');
          VERIFY
