name: HypeStat observations source tests
on:
  push:
    paths:
      - 'hypestat-observations*'
      - '.github/workflows/hypestat-observations.yml'
  pull_request:
    paths:
      - 'hypestat-observations*'
      - '.github/workflows/hypestat-observations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hypestat-observations.test.mjs
