name: eBay official Browse in existing marketplace card
on:
  pull_request:
    paths:
      - 'ebay-quick-cards-core.mjs'
      - 'quanta-marketplace-carousel.mjs'
      - 'quanta-card-experience.css'
      - 'workers/quantaphi-site/ebay-api.mjs'
      - 'workers/quantaphi-site/worker.js'
      - 'test/ebay-official-marketplace.test.mjs'
      - 'test/quanta-marketplace-carousel.test.mjs'
      - '.github/workflows/ebay-official-marketplace.yml'
  push:
    branches: [main]
    paths:
      - 'ebay-quick-cards-core.mjs'
      - 'quanta-marketplace-carousel.mjs'
      - 'workers/quantaphi-site/ebay-api.mjs'
      - 'workers/quantaphi-site/worker.js'
      - 'test/ebay-official-marketplace.test.mjs'
      - 'test/quanta-marketplace-carousel.test.mjs'
jobs:
  browse-source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed syntax
        run: |
          node --check ebay-quick-cards-core.mjs
          node --check quanta-marketplace-carousel.mjs
          node --check workers/quantaphi-site/ebay-api.mjs
          node --check workers/quantaphi-site/worker.js
      - name: Real source, commerce boundary, and existing marketplace regression tests
        run: node --test test/ebay-official-marketplace.test.mjs test/quanta-marketplace-carousel.test.mjs
