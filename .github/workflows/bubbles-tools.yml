name: Bubbles real tool results
on:
  pull_request:
    paths: ['workers/bubbles-tools/**', 'bubbles-research.mjs', 'test/bubbles-research.test.mjs', 'test/bubbles-tools.test.mjs', 'test/bubbles-natural-tool-sweep.test.mjs', 'test/bubbles-source-read-ui.test.mjs', 'test/bubbles-card-source-routing.test.mjs', 'workers/bubbles-tools/search.mjs', 'test/bubbles-cloud-browser.test.mjs', 'bubbles-cloud-browser.mjs', 'test/bubbles-mcp.test.mjs', 'test/bubbles-live-lookup.test.mjs', 'test/bubbles-resonance.test.mjs', 'test/bubbles-stream-voice.test.mjs', 'test/bubbles-brain-actions.test.cjs', 'test/bubbles-progress-updates.test.cjs', 'test/bubbles-owner-immediate-dispatch.test.cjs', 'bubbles-brain-actions.js', 'bubbles-ai.js', 'src/specialist-planner.js', 'test/specialist-planner.test.mjs', 'robot-brain-owner.js', 'bubbles.html', 'bubbles-ai.css', 'test/bubbles-owner-native-pairing.test.cjs', 'index.html', 'bubbles-stream-voice.js', '.github/workflows/bubbles-tools.yml']
  push:
    branches: [main]
    paths: ['workers/bubbles-tools/**', 'bubbles-research.mjs', 'test/bubbles-research.test.mjs', 'test/bubbles-tools.test.mjs', 'test/bubbles-natural-tool-sweep.test.mjs', 'test/bubbles-source-read-ui.test.mjs', 'test/bubbles-card-source-routing.test.mjs', 'workers/bubbles-tools/search.mjs', 'test/bubbles-mcp.test.mjs', 'test/bubbles-live-lookup.test.mjs', 'test/bubbles-resonance.test.mjs', 'test/bubbles-brain-actions.test.cjs', 'test/bubbles-progress-updates.test.cjs', 'test/bubbles-owner-immediate-dispatch.test.cjs', 'bubbles-brain-actions.js', 'bubbles-ai.js', 'src/specialist-planner.js', 'test/specialist-planner.test.mjs', 'robot-brain-owner.js', 'bubbles.html', 'bubbles-ai.css', 'test/bubbles-owner-native-pairing.test.cjs', '.github/workflows/bubbles-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tool and chat syntax
        run: |
          node --check workers/bubbles-tools/browser.mjs
          node --check bubbles-cloud-browser.mjs
          node --check workers/bubbles-tools/mcp.mjs
          node --check workers/bubbles-tools/worker.mjs
          node --check bubbles-ai.js
          node --check robot-brain-owner.js
          node --check bubbles-brain-actions.js
      - name: Browser, source and card contract tests
        run: |
          node --test test/bubbles-project-discovery.test.mjs test/bubbles-github-operator-regression.test.mjs
          node --test test/bubbles-current-memory.test.cjs test/bubbles-cloud-browser.test.mjs test/bubbles-star-continuation.test.mjs
          node --test test/bubbles-natural-tool-sweep.test.mjs
          node --test test/bubbles-source-read-ui.test.mjs test/bubbles-card-source-routing.test.mjs
      - name: MCP lookup and research contract tests
        run: |
          node --test test/bubbles-mcp.test.mjs test/bubbles-live-lookup.test.mjs test/bubbles-research.test.mjs
      - name: Check bubbles-owner-native-pairing
        run: node --test test/bubbles-owner-native-pairing.test.cjs
      - name: Check bubbles-resonance
        run: node --test test/bubbles-resonance.test.mjs
      - name: Check bubbles-tools
        run: node --test test/bubbles-tools.test.mjs
      - name: Check bubbles-stream-voice
        run: node --test test/bubbles-stream-voice.test.mjs
      - name: Check bubbles-brain-bridge
        run: node --test test/bubbles-brain-bridge.test.cjs
      - name: Check bubbles-brain-actions
        run: node --test test/bubbles-brain-actions.test.cjs test/bubbles-image-options.test.mjs test/bubbles-image-conversation.test.mjs
      - name: Check bubbles-progress-updates
        run: node --test test/bubbles-progress-updates.test.cjs
      - name: Check bubbles-owner-immediate-dispatch
        run: node --test test/bubbles-owner-immediate-dispatch.test.cjs
      - name: Check specialist-planner
        run: node --test test/specialist-planner.test.mjs
