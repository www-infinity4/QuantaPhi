name: Bubbles Android overlay APK
on:
  pull_request:
    paths:
      - 'android/bubbles-overlay/**'
      - 'bubbles-native-chat.css'
      - 'test/bubbles-native-chat.browser.cjs'
      - 'test/bubbles-image-options.test.mjs'
      - 'workers/bubbles-tools/**'
      - 'test/bubbles-web-chat.browser.cjs'
      - 'test/bubbles-chatgpt-native.test.cjs'
      - 'test/bubbles-oracle-chat-native.test.cjs'
      - 'test/bubbles-floating-window.test.cjs'
      - 'test/bubbles-webview-recovery.test.cjs'
      - 'test/bubbles-native-visibility.test.cjs'
      - 'test/bubbles-native-site-parity.test.cjs'
      - 'test/bubbles-apk-preview.test.cjs'
      - 'test/bubbles-owner-native-pairing.test.cjs'
      - 'test/bubbles-native-wallet-vault.test.cjs'
      - 'test/bubbles-neural-engine-handoff.test.cjs'
      - 'test/bubbles-neural-voice-bridge.test.cjs'
      - 'test/bubbles-owner-pairing-visibility.test.cjs'
      - 'test/bubbles-capture-save.test.cjs'
      - 'test/bubbles-xrecorder-app-control.test.cjs'
      - 'test/bubbles-native-gpt-screen-story.test.cjs'
      - 'test/bubbles-chatgpt-app-companion.test.cjs'
      - 'test/bubbles-native-session-voice.test.cjs'
      - 'test/bubbles-native-site-parity.test.cjs'
      - '.github/workflows/bubbles-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/bubbles-overlay/**'
      - 'bubbles-native-chat.css'
      - 'test/bubbles-native-chat.browser.cjs'
      - 'test/bubbles-image-options.test.mjs'
      - 'workers/bubbles-tools/**'
      - 'test/bubbles-web-chat.browser.cjs'
      - 'test/bubbles-chatgpt-native.test.cjs'
      - 'test/bubbles-oracle-chat-native.test.cjs'
      - 'test/bubbles-floating-window.test.cjs'
      - 'test/bubbles-webview-recovery.test.cjs'
      - 'test/bubbles-apk-preview.test.cjs'
      - '.github/workflows/bubbles-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK (avoid deprecated sdkmanager tools package)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$TOOL"
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify spoken multi-step Android app control
        run: |
          node --test test/bubbles-spoken-workflow.test.cjs
          mkdir -p /tmp/bubbles-workflows
          javac -d /tmp/bubbles-workflows android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/ScreenAwareness.java android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/SpokenWorkflowPlan.java android/bubbles-overlay/checks/SpokenWorkflowPlanCheck.java
          java -cp /tmp/bubbles-workflows org.quantaphi.bubbles.SpokenWorkflowPlanCheck
      - name: Verify free Android neural engine handoff and fallback
        run: node --test test/bubbles-neural-engine-handoff.test.cjs
      - name: Verify free offline voice selection and natural Bubbles tool integration requests
        run: node --test test/bubbles-neural-voice-bridge.test.cjs test/bubbles-brain-actions.test.cjs
      - name: Verify Bubbles direct GitHub routing and playback crash guards
        run: node --test test/bubbles-direct-route-playback-stability.test.cjs
      - name: Verify recommended setup and wake-only floating activation
        run: node --test test/bubbles-recommended-setup.test.cjs
      - name: Verify AndroidKeyStore wallet backup and safe recovery boundary
        run: node --test test/bubbles-native-wallet-vault.test.cjs
      - name: Verify native final speech recovery after phase acknowledgement
        run: node --test test/bubbles-native-reply-recovery.test.cjs
      - name: Verify three-lane room and internal playback isolation
        run: node --test test/bubbles-room-notes-native.test.cjs test/bubbles-three-lane-voice.test.cjs test/bubbles-phone-playback-lane.test.cjs
      - name: Verify native screen recorder duration, controls, and speech intents
        run: |
          node --test test/bubbles-du-recorder-handoff.test.cjs test/bubbles-xrecorder-app-control.test.cjs test/bubbles-native-recording-lifecycle.test.cjs
          mkdir -p /tmp/bubbles-capture-intents
          javac -d /tmp/bubbles-capture-intents android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/VoiceCaptureCommands.java android/bubbles-overlay/checks/VoiceCaptureCommandsCheck.java
          java -cp /tmp/bubbles-capture-intents org.quantaphi.bubbles.VoiceCaptureCommandsCheck
      - name: Verify adaptive voice pause and CapCut media handoff
        run: |
          node --test test/bubbles-adaptive-voice-capcut.test.cjs
          mkdir -p /tmp/bubbles-adaptive
          javac -d /tmp/bubbles-adaptive android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/VoiceCaptureCommands.java android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/TurnCompletionPolicy.java android/bubbles-overlay/checks/TurnCompletionPolicyCheck.java
          java -cp /tmp/bubbles-adaptive org.quantaphi.bubbles.TurnCompletionPolicyCheck
      - name: Verify phone playback isolation and native recorder clip contracts
        run: |
          node --test test/bubbles-source-recording.test.cjs
          mkdir -p /tmp/bubbles-source
          javac -d /tmp/bubbles-source android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/SpeechSourceGate.java android/bubbles-overlay/checks/SpeechSourceGateCheck.java
          java -cp /tmp/bubbles-source org.quantaphi.bubbles.SpeechSourceGateCheck
      - name: Verify speech narration removes raw punctuation
        run: |
          node --test test/bubbles-tts-cleanup.test.cjs
          mkdir -p /tmp/bubbles-speech
          javac -d /tmp/bubbles-speech android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/SpokenReplyText.java android/bubbles-overlay/checks/SpokenReplyTextCheck.java
          java -cp /tmp/bubbles-speech org.quantaphi.bubbles.SpokenReplyTextCheck
      - name: Verify unified Bubbles photo and voice read-aloud contracts
        run: |
          node --check bubbles-ai.js
          node --check workers/bubbles-tools/worker.mjs
          node --test test/bubbles-image-options.test.mjs
          node --test test/bubbles-live-screen.test.cjs test/bubbles-direct-github.test.mjs
      - name: Verify shared IBM and Gemini phone tool
        run: |
          node --test test/phone-tool.test.mjs
          mkdir -p /tmp/bubbles-phone
          javac -d /tmp/bubbles-phone android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/ScreenAwareness.java android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/PhoneToolPolicy.java android/bubbles-overlay/checks/PhoneToolPolicyCheck.java
          java -cp /tmp/bubbles-phone org.quantaphi.bubbles.PhoneToolPolicyCheck
      - name: Verify scrolling and pairing in a mobile browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          node --test test/bubbles-native-chat.browser.cjs test/bubbles-web-chat.browser.cjs
      - name: Verify isolated Android preview install contract
        run: node --test test/bubbles-apk-preview.test.cjs
      - name: Verify SIM inspection intent boundaries
        run: |
          node --test test/bubbles-sim-tool.test.cjs
          mkdir -p /tmp/bubbles-sim
          javac -d /tmp/bubbles-sim android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/SimNetworkCommands.java android/bubbles-overlay/checks/SimNetworkCommandsCheck.java
          java -cp /tmp/bubbles-sim org.quantaphi.bubbles.SimNetworkCommandsCheck
      - name: Verify fresh voice evidence and quiet-room reset
        run: |
          mkdir -p /tmp/bubbles-energy
          javac -d /tmp/bubbles-energy android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/SpeechEnergyWindow.java android/bubbles-overlay/checks/SpeechEnergyWindowCheck.java
          java -cp /tmp/bubbles-energy org.quantaphi.bubbles.SpeechEnergyWindowCheck
      - name: Verify Bubbles named wake and native hideaway commands
        run: |
          mkdir -p /tmp/bubbles-panel-commands
          javac -d /tmp/bubbles-panel-commands android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/BubblesPanelCommands.java android/bubbles-overlay/checks/BubblesPanelCommandsCheck.java
          java -cp /tmp/bubbles-panel-commands org.quantaphi.bubbles.BubblesPanelCommandsCheck
          node --test test/bubbles-native-panel-controls.test.cjs
      - name: Verify continuous native microphone contract
        run: node --test test/bubbles-continuous-native.test.cjs
      - name: Verify ChatGPT OAuth permission and response contract
        run: node --test test/bubbles-chatgpt-native.test.cjs
      - name: Verify ChatGPT sign-in handoff, visual reader and story opt-in
        run: node --test test/bubbles-native-gpt-screen-story.test.cjs
      - name: Verify Android ChatGPT foreground app companion and safe visible controls
        run: |
          node --test test/bubbles-chatgpt-app-companion.test.cjs
          mkdir -p /tmp/bubbles-chatgpt-app
          javac -d /tmp/bubbles-chatgpt-app android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/ScreenAwareness.java android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/ChatGPTAppPolicy.java android/bubbles-overlay/checks/ChatGPTAppPolicyCheck.java
          java -cp /tmp/bubbles-chatgpt-app org.quantaphi.bubbles.ChatGPTAppPolicyCheck
      - name: Verify no extra owner-code buttons and secure in-chat Android pairing
        run: node --test test/bubbles-owner-native-pairing.test.cjs test/bubbles-owner-pairing-visibility.test.cjs
      - name: Verify shared session, Android speech-turn timing and ownership pairing
        run: node --test test/bubbles-native-session-voice.test.cjs
      - name: Check full speech-turn accumulator and interruption reset
        run: |
          mkdir -p /tmp/bubbles-turns
          javac -d /tmp/bubbles-turns android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/SpeechTurnBuffer.java android/bubbles-overlay/checks/SpeechTurnBufferCheck.java
          java -cp /tmp/bubbles-turns org.quantaphi.bubbles.SpeechTurnBufferCheck
      - name: Verify retry-safe native message acknowledgements
        run: node --test test/bubbles-native-message-ack.test.cjs
      - name: Verify native / QuantaPhi site parity and spoken notes
        run: node --test test/bubbles-native-site-parity.test.cjs
      - name: Verify Oracle chat interruption and text conversation
        run: node --test test/bubbles-oracle-chat-native.test.cjs
      - name: Verify native overlay layout and screenshot fallback
        run: node --test test/bubbles-native-visibility.test.cjs
      - name: Verify native floating Oracle window and transcript
        run: node --test test/bubbles-floating-window.test.cjs
      - name: Verify Bubbles WebView renderer crash recovery
        run: node --test test/bubbles-webview-recovery.test.cjs
      - name: Verify native Live microphone permission boundaries
        run: |
          mkdir -p /tmp/bubbles-live-microphone
          javac -d /tmp/bubbles-live-microphone android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/LiveMicrophonePolicy.java android/bubbles-overlay/checks/LiveMicrophonePolicyCheck.java
          java -cp /tmp/bubbles-live-microphone org.quantaphi.bubbles.LiveMicrophonePolicyCheck
          node --test test/bubbles-live-native-microphone.test.cjs
      - name: Verify official GPT-Live voice gateway contract
        run: node --test test/bubbles-gpt-live.test.cjs test/bubbles-live-tools.test.cjs
      - name: Verify screen intent and safe one-step actions
        run: |
          mkdir -p /tmp/bubbles-screen
          javac -d /tmp/bubbles-screen android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/ScreenAwareness.java android/bubbles-overlay/checks/ScreenAwarenessCheck.java
          java -cp /tmp/bubbles-screen org.quantaphi.bubbles.ScreenAwarenessCheck
      - name: Verify Brain learning policy
        run: |
          mkdir -p /tmp/brain-policy
          javac -d /tmp/brain-policy android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/LearningPolicy.java android/bubbles-overlay/checks/LearningPolicyCheck.java
          java -cp /tmp/brain-policy LearningPolicyCheck
      - name: Verify natural media commands do not confuse audio, video and stop
        run: |
          mkdir -p /tmp/bubbles-capture
          javac -d /tmp/bubbles-capture android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/VoiceCaptureCommands.java android/bubbles-overlay/checks/VoiceCaptureCommandsCheck.java
          java -cp /tmp/bubbles-capture org.quantaphi.bubbles.VoiceCaptureCommandsCheck
      - name: Verify actual Android media library exports and user consent
        run: node --test test/bubbles-capture-save.test.cjs
      - name: Verify sound recording bytes and limits
        run: |
          mkdir -p /tmp/bubbles-wav
          javac -d /tmp/bubbles-wav android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/VoiceRecording.java android/bubbles-overlay/checks/VoiceRecordingCheck.java
          java -cp /tmp/bubbles-wav org.quantaphi.bubbles.VoiceRecordingCheck
      # Preview APKs must keep one signing identity across published updates.
      # This cache contains ONLY a throwaway preview signer, never a production key.
      # GitHub's normal ~/.android/debug.keystore location was not preserved.
      - name: Restore preview-5 test signing key
        uses: actions/cache@v4
        with:
          path: android/bubbles-overlay/preview-debug.keystore
          key: bubbles-preview5-signing-v1
      - name: Create preview-5 test signing key on first build
        run: |
          set -euo pipefail
          KEY=android/bubbles-overlay/preview-debug.keystore
          if [ ! -s "$KEY" ]; then
            keytool -genkeypair -noprompt -keystore "$KEY" -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=Bubbles Preview Test,O=QuantaPhi,C=US"
          fi
          keytool -list -keystore "$KEY" -storepass android -alias androiddebugkey
      - name: Compile Bubbles Android application
        working-directory: android/bubbles-overlay
        run: gradle --no-daemon assembleDebug
      - name: Verify signed APK and supported Android package
        run: |
          set -euo pipefail
          APK=android/bubbles-overlay/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -s "$APK"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/bubbles-apk-badging.txt
          grep -q "name='org.quantaphi.bubbles.preview5'" /tmp/bubbles-apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/bubbles-apk-badging.txt
          sha256sum "$APK"
      - name: Upload separately installable Bubbles Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-preview-android12-apk
          path: android/bubbles-overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # GitHub workflow artifacts are ZIP files, not directly installable APKs.
  # Publish an actual APK on the main branch so Android users can tap to install.
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bubbles-preview-android12-apk
          path: dist
      - name: Publish directly installable Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/bubbles-overlay/app/build.gradle)
          test -n "$VERSION"
          # Publish an immutable version-named APK in addition to the rolling alias.
          # The unique filename defeats browser/CDN cache confusion between v31-v34.
          VERSIONED="Bubbles-v${VERSION}-Preview5-Android12.apk"
          mv dist/app-debug.apk "dist/$VERSIONED"
          cp "dist/$VERSIONED" dist/Bubbles-Preview5-Android12.apk
          (cd dist && sha256sum "$VERSIONED" > "$VERSIONED.sha256" && sha256sum Bubbles-Preview5-Android12.apk > Bubbles-Preview5-Android12.apk.sha256)
          if gh release view bubbles-preview-current --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload bubbles-preview-current "dist/$VERSIONED#Bubbles v${VERSION}-preview" "dist/$VERSIONED.sha256" "dist/Bubbles-Preview5-Android12.apk#Current Bubbles Preview" dist/Bubbles-Preview5-Android12.apk.sha256 --clobber --repo "$GH_REPO"
          else
            gh release create bubbles-preview-current "dist/$VERSIONED#Bubbles v${VERSION}-preview" "dist/$VERSIONED.sha256" "dist/Bubbles-Preview5-Android12.apk#Current Bubbles Preview" dist/Bubbles-Preview5-Android12.apk.sha256 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Bubbles Preview for Android" --notes "Direct APK for Android 8+ ARM phones. Every version also retains a uniquely named signed APK asset and SHA256 checksum, so download version identity is clear. Test-signed preview, not a production release."
          fi
