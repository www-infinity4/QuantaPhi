name: Bubbles Android overlay APK
on:
  pull_request:
    paths:
      - 'android/bubbles-overlay/**'
      - 'test/bubbles-chatgpt-native.test.cjs'
      - 'test/bubbles-oracle-chat-native.test.cjs'
      - 'test/bubbles-floating-window.test.cjs'
      - 'test/bubbles-apk-preview.test.cjs'
      - '.github/workflows/bubbles-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/bubbles-overlay/**'
      - 'test/bubbles-chatgpt-native.test.cjs'
      - 'test/bubbles-oracle-chat-native.test.cjs'
      - 'test/bubbles-floating-window.test.cjs'
      - 'test/bubbles-apk-preview.test.cjs'
      - '.github/workflows/bubbles-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK (avoid deprecated sdkmanager tools package)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$TOOL"
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated Android preview install contract
        run: node --test test/bubbles-apk-preview.test.cjs
      - name: Verify continuous native microphone contract
        run: node --test test/bubbles-continuous-native.test.cjs
      - name: Verify ChatGPT OAuth permission and response contract
        run: node --test test/bubbles-chatgpt-native.test.cjs
      - name: Verify Oracle chat interruption and text conversation
        run: node --test test/bubbles-oracle-chat-native.test.cjs
      - name: Verify native floating Oracle window and transcript
        run: node --test test/bubbles-floating-window.test.cjs
      - name: Verify official GPT-Live voice gateway contract
        run: node --test test/bubbles-gpt-live.test.cjs
      - name: Verify Brain learning policy
        run: |
          mkdir -p /tmp/brain-policy
          javac -d /tmp/brain-policy android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/LearningPolicy.java android/bubbles-overlay/checks/LearningPolicyCheck.java
          java -cp /tmp/brain-policy LearningPolicyCheck
      - name: Verify sound recording bytes and limits
        run: |
          mkdir -p /tmp/bubbles-wav
          javac -d /tmp/bubbles-wav android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/VoiceRecording.java android/bubbles-overlay/checks/VoiceRecordingCheck.java
          java -cp /tmp/bubbles-wav org.quantaphi.bubbles.VoiceRecordingCheck
      # GitHub runners do not retain debug signing certificates by default.
      # Restore a main-branch test signing cache where available. This is ONLY
      # for the isolated Bubbles Preview package, never a release signer.
      - name: Reuse test-only preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bubbles-preview-debug-keystore-v1
      - name: Compile Bubbles Android application
        working-directory: android/bubbles-overlay
        run: gradle --no-daemon assembleDebug
      - name: Verify signed APK and supported Android package
        run: |
          set -euo pipefail
          APK=android/bubbles-overlay/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -s "$APK"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/bubbles-apk-badging.txt
          grep -q "name='org.quantaphi.bubbles.preview3'" /tmp/bubbles-apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/bubbles-apk-badging.txt
          sha256sum "$APK"
      - name: Upload separately installable Bubbles Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-preview-android12-apk
          path: android/bubbles-overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # GitHub workflow artifacts are ZIP files, not directly installable APKs.
  # Publish an actual APK on the main branch so Android users can tap to install.
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bubbles-preview-android12-apk
          path: dist
      - name: Publish directly installable Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv dist/app-debug.apk dist/Bubbles-Preview-Android12.apk
          (cd dist && sha256sum Bubbles-Preview-Android12.apk > Bubbles-Preview-Android12.apk.sha256)
          if gh release view bubbles-preview-current --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload bubbles-preview-current dist/Bubbles-Preview-Android12.apk dist/Bubbles-Preview-Android12.apk.sha256 --clobber --repo "$GH_REPO"
          else
            gh release create bubbles-preview-current dist/Bubbles-Preview-Android12.apk dist/Bubbles-Preview-Android12.apk.sha256 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Bubbles Preview for Android" --notes "Direct APK for Android 8+ ARM phones. Bubbles Preview 3 installs alongside previous Bubbles versions; this is a test-signed preview, not a production release."
          fi
