name: Bubbles Android overlay APK
on:
  pull_request:
    paths:
      - 'android/bubbles-overlay/**'
      - '.github/workflows/bubbles-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/bubbles-overlay/**'
      - '.github/workflows/bubbles-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Bubbles Android application
        working-directory: android/bubbles-overlay
        run: gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bubbles-android-debug-apk
          path: android/bubbles-overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
