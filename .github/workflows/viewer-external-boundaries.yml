name: Infinity viewer external boundaries

on:
  pull_request:
    paths:
      - 'quanta-official-viewer.mjs'
      - 'website-viewer.html'
      - 'workers/quantaphi-site/worker.js'
      - 'test/viewer-external-boundaries.test.mjs'
      - 'test/chatgpt-official-viewer.test.mjs'
      - 'test/bubbles-embed-headers.test.cjs'
      - '.github/workflows/viewer-external-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Viewer and edge security tests
        run: |
          node --test test/viewer-external-boundaries.test.mjs
          node --test test/chatgpt-official-viewer.test.mjs
          node --test test/bubbles-embed-headers.test.cjs
