name: Card launcher inventory safety
on:
  pull_request:
    paths:
      - 'android/card-launchers/**'
      - 'test/card-launcher-catalog.test.mjs'
      - 'infinity-accepted-catalog.mjs'
      - 'infinity-accepted-sources.mjs'
      - '.github/workflows/card-launcher-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'android/card-launchers/**'
      - 'test/card-launcher-catalog.test.mjs'
      - 'infinity-accepted-catalog.mjs'
      - 'infinity-accepted-sources.mjs'
      - '.github/workflows/card-launcher-inventory.yml'
permissions:
  contents: read
jobs:
  validate-source-only-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and 116 card identities
        run: |
          node --check android/card-launchers/card-launcher-catalog.mjs
          node --test test/card-launcher-catalog.test.mjs
