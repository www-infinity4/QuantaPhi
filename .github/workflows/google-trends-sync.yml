name: Refresh Google Trending Cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_google_trends.py'
      - 'scripts/sync_world_series.py'
      - 'test/test_world_series_sync.py'
      - '.github/workflows/google-trends-sync.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: quantaphi-google-trends-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate RSS parsing
        run: python3 -m unittest discover -s test -p 'test_google_trends_sync.py' -v
      - name: Validate MLB, ESPN, CBS RSS and attribution rules
        run: python3 -m unittest discover -s test -p 'test_world_series_sync.py' -v
      - name: Fetch and verify real World Series publisher RSS
        shell: bash
        run: |
          if python3 scripts/sync_world_series.py; then
            echo 'Verified World Series RSS snapshot for this run.'
          else
            echo 'RSS sources unavailable; do not overwrite last published checked snapshot.'
          fi
      - name: Fetch and verify real Google Trends RSS
        run: python3 scripts/sync_google_trends.py
      - name: Publish to dedicated trend-data branch (main stays protected)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trends-observations"
          cp data/google-trends-latest.json "$RUNNER_TEMP/google-trends-latest.json"
          if test -f data/world-series-latest.json; then cp data/world-series-latest.json "$RUNNER_TEMP/world-series-latest.json"; fi
          cp research/google-trends/observations/*.json "$RUNNER_TEMP/trends-observations/"
          git config user.name "quanta-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          # Generated JSON is untracked on main; clear it before checking out the
          # data branch (where that same path is already tracked on later runs).
          git clean -fdx
          if git ls-remote --exit-code --heads origin trends-rss-data >/dev/null 2>&1; then
            git fetch origin refs/heads/trends-rss-data:refs/remotes/origin/trends-rss-data
            git checkout -B trends-rss-data origin/trends-rss-data
          else
            git checkout --orphan trends-rss-data
            git rm -rf . >/dev/null || true
            git clean -fdx
          fi
          mkdir -p data research/google-trends/observations
          cp "$RUNNER_TEMP/google-trends-latest.json" data/google-trends-latest.json
          if test -f "$RUNNER_TEMP/world-series-latest.json"; then cp "$RUNNER_TEMP/world-series-latest.json" data/world-series-latest.json; fi
          cp "$RUNNER_TEMP/trends-observations/"*.json research/google-trends/observations/
          git add data/google-trends-latest.json research/google-trends/observations/
          if test -f data/world-series-latest.json; then git add data/world-series-latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified Google Trends US RSS"
            git push origin HEAD:refs/heads/trends-rss-data
          fi
