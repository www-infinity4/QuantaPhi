name: Bubbles account connection regressions

on:
  pull_request:
    paths:
      - 'workers/bubbles-connections/**'
      - 'bubbles-connections.mjs'
      - 'bubbles-signin-gate.mjs'
      - 'bubbles-connections-gate.mjs'
      - 'bubbles-oauth-return.mjs'
      - 'bubbles.html'
      - 'bubbles-ai.js'
      - 'playwright.signin.config.mjs'
      - 'test/bubbles-signin-browser.spec.mjs'
      - 'test/bubbles-integra.test.mjs'
      - 'test/bubbles-oauth-return.test.mjs'
      - 'test/bubbles-signin-gate.test.mjs'
      - 'index.html'
      - 'workers/quantaphi-site/worker.js'
      - 'test/bubbles-home-account-link.test.mjs'
      - 'test/bubbles-connections*.test.mjs'
      - 'test/starcoin-github-backup.test.mjs'
      - '.github/workflows/bubbles-connector-tests.yml'
  push:
    branches: [main]
    paths:
      - 'workers/bubbles-connections/**'
      - 'bubbles-connections.mjs'
      - 'bubbles-signin-gate.mjs'
      - 'bubbles-connections-gate.mjs'
      - 'bubbles-oauth-return.mjs'
      - 'bubbles.html'
      - 'bubbles-ai.js'
      - 'playwright.signin.config.mjs'
      - 'test/bubbles-signin-browser.spec.mjs'
      - 'test/bubbles-integra.test.mjs'
      - 'test/bubbles-oauth-return.test.mjs'
      - 'test/bubbles-signin-gate.test.mjs'
      - 'index.html'
      - 'workers/quantaphi-site/worker.js'
      - 'test/bubbles-home-account-link.test.mjs'
      - 'test/bubbles-connections*.test.mjs'
      - 'test/starcoin-github-backup.test.mjs'
      - '.github/workflows/bubbles-connector-tests.yml'

permissions:
  contents: read

jobs:
  account-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify wallet, OAuth, pairing, same-origin browser reads and isolation
        run: |
          node --test \
            test/bubbles-connections.test.mjs \
            test/bubbles-consent.test.mjs \
            test/bubbles-connections-router.test.mjs \
            test/bubbles-connections-ui.test.mjs \
            test/bubbles-signin-gate.test.mjs \
            test/bubbles-integra.test.mjs \
            test/bubbles-oauth-return.test.mjs \
            test/bubbles-connector-pairing.test.mjs \
            test/bubbles-home-account-link.test.mjs \
            test/starcoin-github-backup.test.mjs
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify sequential sign-in, popup return, current application and locked errors
        run: npx playwright test --config=playwright.signin.config.mjs
