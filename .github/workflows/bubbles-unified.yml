name: Bubbles unified interface checks
on:
  pull_request:
    paths:
      - 'bubbles-ai.js'
      - 'bubbles-dispatch-catalog.mjs'
      - 'bubbles-work-evidence.mjs'
      - 'test/bubbles-work-evidence.test.mjs'
      - 'test/bubbles-dispatch-catalog.test.mjs'
      - 'bubbles-project-discovery.mjs'
      - 'test/bubbles-project-discovery.test.mjs'
      - 'bubbles-action-driver.mjs'
      - 'test/bubbles-action-driver.test.mjs'
      - 'test/bubbles-orb-semantic.test.mjs'
      - 'workers/bubbles-tools/semantic-intent.mjs'
      - 'bubbles-cloud-clock.mjs'
      - 'test/bubbles-owner-clock.test.mjs'
      - 'workers/infinity-brain-clock/owner-task-clock.mjs'
      - 'bubbles-cloud-wallet.js'
      - 'test/bubbles-cloud-wallet-history.test.cjs'
      - 'wallet-recovery.html'
      - 'test/bubbles-owner-wallet-recovery.test.cjs'
      - 'workers/unified-wallet/wallet-recovery-schema.sql'
      - 'workers/unified-wallet/worker.js'
      - 'bubbles-card-*'
      - 'bubbles-brain-actions.js'
      - 'test/bubbles-card-workspace.test.mjs'
      - 'test/bubbles-repository-targets.test.mjs'
      - 'test/bubbles-runner-dispatch.test.mjs'
      - 'workers/infinity-brain-clock/runner-request.mjs'
      - 'test/bubbles-smart-repository-routing.test.mjs'
      - 'test/bubbles-github-operator-regression.test.mjs'
      - 'test/bubbles-recordb-owner-command.test.cjs'
      - 'workers/infinity-brain-clock/repository-router.mjs'
      - 'workers/infinity-brain-clock/direct-github.mjs'
      - 'workers/infinity-brain-clock/worker.js'
      - 'bubbles-unified.css'
      - 'bubbles.html'
      - 'index.html'
      - 'android/bubbles-overlay/**'
      - 'test/bubbles-unified.test.mjs'
      - '.github/workflows/bubbles-unified.yml'
  push:
    branches: [main]
    paths:
      - 'bubbles-ai.js'
      - 'bubbles-dispatch-catalog.mjs'
      - 'bubbles-work-evidence.mjs'
      - 'test/bubbles-work-evidence.test.mjs'
      - 'test/bubbles-dispatch-catalog.test.mjs'
      - 'bubbles-project-discovery.mjs'
      - 'test/bubbles-project-discovery.test.mjs'
      - 'bubbles-action-driver.mjs'
      - 'test/bubbles-action-driver.test.mjs'
      - 'test/bubbles-orb-semantic.test.mjs'
      - 'workers/bubbles-tools/semantic-intent.mjs'
      - 'bubbles-cloud-clock.mjs'
      - 'test/bubbles-owner-clock.test.mjs'
      - 'workers/infinity-brain-clock/owner-task-clock.mjs'
      - 'bubbles-card-*'
      - 'bubbles-brain-actions.js'
      - 'test/bubbles-card-workspace.test.mjs'
      - 'test/bubbles-repository-targets.test.mjs'
      - 'test/bubbles-runner-dispatch.test.mjs'
      - 'workers/infinity-brain-clock/runner-request.mjs'
      - 'test/bubbles-smart-repository-routing.test.mjs'
      - 'test/bubbles-github-operator-regression.test.mjs'
      - 'test/bubbles-recordb-owner-command.test.cjs'
      - 'workers/infinity-brain-clock/repository-router.mjs'
      - 'workers/infinity-brain-clock/direct-github.mjs'
      - 'workers/infinity-brain-clock/worker.js'
      - 'bubbles-unified.css'
      - 'bubbles.html'
      - 'index.html'
      - 'android/bubbles-overlay/**'
      - 'test/bubbles-unified.test.mjs'
      - '.github/workflows/bubbles-unified.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check bubbles-ai.js
      - run: node --check bubbles-dispatch-catalog.mjs
      - run: node --test test/bubbles-dispatch-catalog.test.mjs test/bubbles-work-evidence.test.mjs test/bubbles-image-conversation.test.mjs
      - run: node --check bubbles-cloud-wallet.js
      - run: node --test test/bubbles-cloud-wallet-history.test.cjs test/bubbles-owner-wallet-recovery.test.cjs
      - run: node --test test/bubbles-unified.test.mjs
      - name: Verify in-chat cards and repository ticket targets
        run: |
          node --check bubbles-card-workspace.mjs
          node --check bubbles-card-host.mjs
          node --check bubbles-cloud-clock.mjs
          node --check workers/infinity-brain-clock/owner-task-clock.mjs
          node --test test/bubbles-owner-clock.test.mjs
          node --check bubbles-action-driver.mjs
          node --check workers/bubbles-tools/semantic-intent.mjs
          node --test test/bubbles-orb-semantic.test.mjs
          node --test test/bubbles-action-driver.test.mjs
          node --test test/bubbles-project-discovery.test.mjs test/bubbles-card-workspace.test.mjs test/bubbles-repository-targets.test.mjs test/bubbles-smart-repository-routing.test.mjs test/bubbles-github-operator-regression.test.mjs test/bubbles-recordb-owner-command.test.cjs test/bubbles-direct-github.test.mjs test/bubbles-technical-handoff.test.mjs test/bubbles-owner-tools-webview.test.cjs test/bubbles-runner-dispatch.test.mjs
