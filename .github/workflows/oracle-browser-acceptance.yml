name: Oracle Android research card acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'
  push:
    branches: [main]
    paths: ['phi-scholastic-data.*','scripts/oracle-browser-acceptance.mjs','.github/workflows/oracle-browser-acceptance.yml']
  pull_request:
    paths: ['phi-scholastic-data.*','scripts/oracle-browser-acceptance.mjs','.github/workflows/oracle-browser-acceptance.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check no-wallet mocked source-backed Compare and Extract controls
        env:
          ORACLE_BROWSER_LIVE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/oracle-browser-acceptance.mjs
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-android-research-card
          path: oracle-browser-evidence/
          retention-days: 14
