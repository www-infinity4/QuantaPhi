name: Bubbles Conversation Folders
on:
  pull_request:
    paths:
      - 'bubbles-ai.js'
      - 'bubbles-memory.js'
      - 'bubbles-brain-history-bridge.mjs'
      - 'test/bubbles-brain-history-bridge.test.mjs'
      - 'bubbles-human-replies.mjs'
      - 'bubbles-unified.css'
      - 'workers/infinity-brain-clock/conversation-memory.mjs'
      - 'workers/infinity-brain-clock/conversation-work-audit.mjs'
      - 'workers/infinity-brain-clock/conversation-work-sweep.mjs'
      - 'workers/infinity-brain-clock/work-receipt-readback.mjs'
      - 'workers/infinity-brain-clock/conversation-ticket-reconcile.mjs'
      - 'workers/infinity-brain-clock/owner-audit-draft.mjs'
      - 'workers/infinity-brain-clock/worker.js'
      - 'test/bubbles-conversation-work-audit.test.mjs'
      - 'test/bubbles-conversation-work-sweep.test.mjs'
      - 'test/bubbles-work-receipt-readback.test.mjs'
      - 'test/bubbles-conversation-ticket-reconcile.test.mjs'
      - 'test/bubbles-owner-history-draft.test.mjs'
      - 'workers/bubbles-chat-folders/**'
      - 'test/bubbles-conversation-folders.test.mjs'
      - 'test/bubbles-chat-folder-api.test.mjs'
      - 'test/bubbles-conversation-memory.test.mjs'
      - 'test/bubbles-fresh-chat-opening.test.mjs'
      - 'android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/FloatingOracleWindow.java'
      - '.github/workflows/bubbles-conversation-folders.yml'
permissions:
  contents: read
jobs:
  sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: |
          node --check bubbles-ai.js
          node --check bubbles-memory.js
          node --check bubbles-brain-history-bridge.mjs
          node --check bubbles-human-replies.mjs
          node --check workers/infinity-brain-clock/conversation-memory.mjs
          node --check workers/infinity-brain-clock/conversation-work-audit.mjs
          node --check workers/infinity-brain-clock/conversation-work-sweep.mjs
          node --check workers/infinity-brain-clock/work-receipt-readback.mjs
          node --check workers/infinity-brain-clock/conversation-ticket-reconcile.mjs
          node --check workers/infinity-brain-clock/owner-audit-draft.mjs
          node --check workers/bubbles-chat-folders/worker.mjs
          node --test test/bubbles-conversation-folders.test.mjs test/bubbles-conversation-memory.test.mjs test/bubbles-chat-folder-api.test.mjs test/bubbles-conversation-work-audit.test.mjs test/bubbles-conversation-work-sweep.test.mjs test/bubbles-brain-history-bridge.test.mjs test/bubbles-work-receipt-readback.test.mjs test/bubbles-conversation-ticket-reconcile.test.mjs test/bubbles-owner-history-draft.test.mjs test/bubbles-fresh-chat-opening.test.mjs
