name: Deploy Bubbles semantic tools
on:
  pull_request:
    paths:
      - 'workers/bubbles-tools/**'
      - 'scripts/verify-bubbles-live-tools.mjs'
      - 'test/bubbles-live-tool-acceptance.test.mjs'
      - '.github/workflows/deploy-bubbles-semantic-tools.yml'
  push:
    branches: [main]
    paths:
      - 'workers/bubbles-tools/**'
      - 'scripts/verify-bubbles-live-tools.mjs'
      - '.github/workflows/deploy-bubbles-semantic-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubbles-semantic-tools-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test registered semantic tools and explicit receipts
        run: |
          node --check workers/bubbles-tools/worker.mjs
          node --check workers/bubbles-tools/mcp.mjs
          node --check workers/bubbles-tools/organic-benchmark.mjs
          node --check workers/bubbles-tools/search.mjs
          node --test test/bubbles-read-agent.test.mjs test/bubbles-mcp.test.mjs test/bubbles-live-lookup.test.mjs test/bubbles-tools.test.mjs test/bubbles-live-tool-acceptance.test.mjs test/bubbles-source-read-ui.test.mjs test/bubbles-search-completion.test.mjs test/bubbles-server-assist.test.mjs test/bubbles-organic-memory-tool.test.mjs
      - name: Check existing deployment authorization
        if: github.event_name != 'pull_request'
        id: deploy_auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source checks passed, but this runner did not verify Cloudflare deployment credentials. No production deployment is claimed."
          fi
      - name: Explain source-only result if deployment authorization is unavailable
        if: steps.deploy_auth.outputs.available != 'true'
        run: |
          echo 'Bubbles tool source passed, but production deployment and live behavioral checks are NOT verified because deploy authorization was unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy authenticated Bubbles tools Worker
        if: steps.deploy_auth.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/bubbles-tools/wrangler.toml
      - name: Verify live tool gateway health
        if: steps.deploy_auth.outputs.available == 'true'
        run: |
          node --input-type=module <<'VERIFY'
          const url='https://bubbles-tools.marvaseater.workers.dev/health';
          const response=await fetch(url,{headers:{'Cache-Control':'no-cache'}});
          const body=await response.json();
          if(!response.ok||body.service!=='bubbles-tools'||!body.tools?.weather)
            throw Error('Live Bubbles tool gateway health was not confirmed');
          console.log('Bubbles gateway health checked; individual tool execution still requires receipts.');
          VERIFY
      - name: Verify Organic Computation live software tool receipt
        if: steps.deploy_auth.outputs.available == 'true'
        run: |
          node --input-type=module <<'ORGANIC'
          const url='https://bubbles-tools.marvaseater.workers.dev/v1/assist';
          const res=await fetch(url,{method:'POST',headers:{Origin:'https://quantaphi.org','Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({request:'Compare organic computation memory recall with one flipped bit, 40 trials, seed 17'})});
          const data=await res.json();
          if(!res.ok||data?.receipt?.status!=='complete'||data?.receipt?.tool!=='organic.memory_benchmark'||data?.result?.trials!==40||data?.result?.flippedBits!==1||data?.receipt?.repositoryActionsVerified!==false)throw Error('Organic live benchmark receipt mismatch');
          console.log('Verified live Organic Computation read-only calculation, seed/trial context, and completion receipt');
          ORGANIC
      - name: Verify live webpage reading and three-town weather routing
        if: steps.deploy_auth.outputs.available == 'true'
        run: node scripts/verify-bubbles-live-tools.mjs

