name: Media Star followed Spaces
on:
  pull_request:
    paths:
      - workers/media-star-following-spaces/**
      - media-star-following-spaces.js
      - media-star-following-spaces.css
      - test/media-star-following-spaces.test.cjs
      - .github/workflows/media-star-following-spaces.yml
      - index.html
  push:
    branches: [main]
    paths:
      - workers/media-star-following-spaces/**
      - media-star-following-spaces.js
      - media-star-following-spaces.css
      - test/media-star-following-spaces.test.cjs
      - .github/workflows/media-star-following-spaces.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Syntax
        run: |
          node --check workers/media-star-following-spaces/worker.js
          node --check media-star-following-spaces.js
      - name: Database, privacy, shuffle and old Fred catalog tests
        run: node --test test/media-star-following-spaces.test.cjs test/fred-catalog.test.cjs test/magoo-spaces.test.cjs
