name: QuantaPhi real interactive card quality
on:
  pull_request:
    paths:
      - 'quanta-card-experience.*'
      - 'quanta-card-actions.mjs'
      - 'oracle-card-deck.js'
      - 'premium-source-cards.*'
      - 'test/premium*'
      - 'quanta-feed.*'
      - 'quanta-feed-card.html'
      - 'source-quick-cards.mjs'
      - 'brand-product-cards.mjs'
      - 'brand-product-cards.css'
      - 'test/brand-product-cards.test.mjs'
      - 'source-quick-card.html'
      - 'index.html'
      - 'world-series-news.mjs'
      - 'church-iam-card.js'
      - 'church-iam-card.css'
      - 'test/church-iam-card.test.mjs'
      - 'bubbles-card-catalog.mjs'
      - 'world-series-news.css'
      - 'cardone-capital.html'
      - 'test/world-series-news.test.mjs'
      - 'test/test_world_series_sync.py'
      - 'phi-assimilation.js'
      - 'test/assimilation-mobile-accessibility.test.mjs'
      - 'test/quanta-card-browser.spec.mjs'
      - 'test/quanta-card-experience.test.mjs'
      - 'test/source-quick-cards.test.mjs'
      - 'test/quanta-card-feed.test.mjs'
      - 'test/quanta-card-actions-fox-one.test.mjs'
      - '.github/workflows/quanta-interactive-cards.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card module syntax
        run: |
          node --check quanta-card-experience.mjs
          node --check quanta-card-actions.mjs
          node --check quanta-feed.mjs
          node --check source-quick-cards.mjs
          node --check premium-source-cards.mjs
          node --check brand-product-cards.mjs
          node --check world-series-news.mjs
          node --check church-iam-card.js
          node --check phi-assimilation.js
      - name: Run interactive card regression tests
        run: node --test test/source-quick-cards.test.mjs test/quanta-card-feed.test.mjs test/quanta-card-experience.test.mjs test/quanta-card-actions-fox-one.test.mjs test/oracle-deck-cycle.test.mjs test/premium-source-cards.test.mjs
      - name: Check assimilation contrast and action contracts
        run: node --test test/assimilation-mobile-accessibility.test.mjs
      - name: Validate real-brand retail products and APK disclosure
        run: node --test test/brand-product-cards.test.mjs
      - name: Check World Series publisher stories and Cardone detail actions
        run: |
          python3 -m unittest discover -s test -p 'test_world_series_sync.py' -v
          node --test test/world-series-news.test.mjs test/church-iam-card.test.mjs
      - name: Check original-card preservation
        run: node test/oracle-card-deck.test.cjs
      - name: Install Chromium for live browser QA
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Android-width interactive browser QA
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/quanta-browser.log 2>&1 &
          npx playwright test test/quanta-card-browser.spec.mjs test/premium-card-browser.spec.mjs test/world-series-browser.spec.mjs --reporter=line --workers=1
