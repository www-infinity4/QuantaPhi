name: QuantaPhi real interactive card quality
on:
  pull_request:
    paths:
      - 'quanta-card-experience.*'
      - 'quanta-card-actions.mjs'
      - 'art-museum-quick-cards.mjs'
      - 'verified-brand-sports-catalog.mjs'
      - 'verified-brand-sports-cards.mjs'
      - 'verified-brand-sports-cards.css'
      - 'test/verified-brand-sports.test.mjs'
      - 'test/infinity-cards-freshness.test.mjs'
      - 'test/verified-brand-sports-browser.spec.mjs'
      - 'art-museum-quick-cards.css'
      - 'test/art-museum-quick-cards.test.mjs'
      - 'test/art-museum-card-browser.spec.mjs'
      - 'oracle-card-deck.js'
      - 'oracle-card-deck.css'
      - 'shop-phi-switchboard.*'
      - 'test/shopphi-flanks.browser.spec.mjs'
      - 'test/shopphi-seller-live.browser.spec.mjs'
      - 'shop-phi-publish.js'
      - 'shopphi-wallet-status.js'
      - 'test/cardone-carousel.browser.cjs'
      - 'premium-source-cards.*'
      - 'test/premium*'
      - 'quanta-feed.*'
      - 'quanta-feed-rank.mjs'
      - 'infinity-accepted*'
      - 'infinity-affiliates*'
      - 'test/infinity-affiliates.test.mjs'
      - 'test/infinity-affiliates.browser.spec.mjs'
      - 'quick-card-tinyfish-actions.mjs'
      - 'workers/infinity-brain-clock/quick-card-browser*'
      - 'test/infinity-accepted*'
      - 'test/quick-card-tinyfish.test.mjs'
      - 'test/tinyfish-broker-bridge.test.mjs'
      - 'quanta-feed-card.html'
      - 'source-quick-cards.mjs'
      - 'brand-product-cards.mjs'
      - 'brand-product-cards.css'
      - 'test/brand-product-cards.test.mjs'
      - 'source-quick-card.html'
      - 'x-money.html'
      - 'test/x-money-card.test.mjs'
      - 'index.html'
      - 'shopphi-sell.html'
      - 'oracle-card-spotlight.css'
      - 'test/share-shopphi-browser.test.mjs'
      - 'test/share-shopphi-browser.spec.mjs'
      - 'home-mobile-cards-first.css'
      - 'cloud-wallet-client.js'
      - 'test/home-mobile-first.test.mjs'
      - 'test/home-mobile-first.browser.spec.mjs'
      - 'world-series-news.mjs'
      - 'church-iam-card.js'
      - 'church-iam-card.css'
      - 'test/church-iam-card.test.mjs'
      - 'bubbles-card-catalog.mjs'
      - 'world-series-news.css'
      - 'cardone-capital.html'
      - 'test/world-series-news.test.mjs'
      - 'test/test_world_series_sync.py'
      - 'phi-assimilation.js'
      - 'test/assimilation-mobile-accessibility.test.mjs'
      - 'test/quanta-card-browser.spec.mjs'
      - 'quick-card-preview.mjs'
      - 'quick-card-preview.css'
      - 'test/quick-card-preview.browser.spec.mjs'
      - 'test/quanta-card-experience.test.mjs'
      - 'test/source-quick-cards.test.mjs'
      - 'test/quanta-card-feed.test.mjs'
      - 'test/quanta-card-actions-fox-one.test.mjs'
      - 'test/quanta-card-provider.test.mjs'
      - 'quanta-card-live-source.mjs'
      - 'test/quanta-card-live-source.test.mjs'
      - 'test/quanta-card-live-source.browser.spec.mjs'
      - 'design-lab/**'
      - 'test/design-lab-power-chain.test.mjs'
      - 'test/design-lab-power-chain.browser.spec.mjs'
      - '.github/workflows/quanta-interactive-cards.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card module syntax
        run: |
          node --check quanta-card-experience.mjs
          node --check quanta-card-live-source.mjs
          node --check design-lab/power-chain-core.mjs
          node --check design-lab/app.mjs
          node --check design-lab/quick-card.mjs
          node --check quanta-card-actions.mjs
          node --check quick-card-preview.mjs
          node --check art-museum-quick-cards.mjs
          node --check verified-brand-sports-catalog.mjs
          node --check verified-brand-sports-cards.mjs
          node --check quanta-feed.mjs
          node --check infinity-accepted-catalog.mjs
          node --check infinity-accepted-sources.mjs
          node --check infinity-accepted-cards.mjs
          node --check infinity-affiliates-core.mjs
          node --check infinity-affiliates-card.mjs
          node --check quick-card-tinyfish-actions.mjs
          node --check workers/infinity-brain-clock/quick-card-browser-policy.mjs
          node --check workers/infinity-brain-clock/quick-card-browser.mjs
          node --check source-quick-cards.mjs
          node --check premium-source-cards.mjs
          node --check shop-phi-switchboard.mjs
          node --check brand-product-cards.mjs
          node --check quanta-card-provider.mjs
          node --check quanta-card-actions.mjs
          node --check world-series-news.mjs
          node --check church-iam-card.js
          node --check phi-assimilation.js
      - name: Run interactive card regression tests
        run: node --test test/verified-brand-sports.test.mjs test/art-museum-quick-cards.test.mjs test/source-quick-cards.test.mjs test/quanta-card-feed.test.mjs test/quanta-card-experience.test.mjs test/quanta-card-actions-fox-one.test.mjs test/quanta-card-provider.test.mjs test/quanta-card-live-source.test.mjs test/design-lab-power-chain.test.mjs test/oracle-deck-cycle.test.mjs test/premium-source-cards.test.mjs test/x-money-card.test.mjs test/home-mobile-first.test.mjs test/share-shopphi-browser.test.mjs test/infinity-affiliates.test.mjs
      - name: Check today's Infinity card freshness and real product media
        run: node --test test/infinity-cards-freshness.test.mjs
      - name: Check Infinity accepted catalog and browser action contracts
        run: node --test test/infinity-accepted.test.mjs test/quick-card-tinyfish.test.mjs test/brain-clock.test.mjs test/tinyfish-broker-bridge.test.mjs
      - name: Check assimilation accessibility
        run: node --test test/assimilation-mobile-accessibility.test.mjs
      - name: Validate real-brand retail products and APK disclosure
        run: node --test test/brand-product-cards.test.mjs
      - name: Check World Series publisher stories and Cardone detail actions
        run: |
          python3 -m unittest discover -s test -p 'test_world_series_sync.py' -v
          node --test test/world-series-news.test.mjs test/church-iam-card.test.mjs
      - name: Check original-card preservation
        run: node test/oracle-card-deck.test.cjs
      - name: Install Chromium for live browser QA
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Android-width interactive browser QA
        run: |
          node --test test/cardone-carousel.browser.cjs
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/quanta-browser.log 2>&1 &
          npx playwright test test/infinity-accepted-browser.spec.mjs test/verified-brand-sports-browser.spec.mjs test/art-museum-card-browser.spec.mjs test/quanta-card-browser.spec.mjs test/quanta-card-live-source.browser.spec.mjs test/design-lab-power-chain.browser.spec.mjs test/premium-card-browser.spec.mjs test/shopphi-flanks.browser.spec.mjs test/shopphi-seller-live.browser.spec.mjs test/home-mobile-first.browser.spec.mjs test/share-shopphi-browser.spec.mjs test/infinity-affiliates.browser.spec.mjs test/world-series-browser.spec.mjs test/quick-card-preview.browser.spec.mjs --reporter=line --workers=1
