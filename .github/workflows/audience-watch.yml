name: QuantaPhi audience discovery health bots
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'explore/**'
      - 'bubbles.html'
      - 'video-studio.html'
      - 'learn/**'
      - 'sitemap.xml'
      - 'scripts/audience-audit.mjs'
      - 'test/audience-audit.test.mjs'
      - '.github/workflows/audience-watch.yml'
permissions:
  contents: read
concurrency:
  group: quantaphi-audience-audit
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit source and regression tests
        run: |
          node --check scripts/audience-audit.mjs
          node --test test/audience-audit.test.mjs
      - name: Inspect public search landing pages and social previews
        id: site_audit
        continue-on-error: true
        run: node scripts/audience-audit.mjs
      - name: Summarize verified inspection (no protected branch writes)
        if: always()
        run: |
          if test -f audience-evidence/latest.json; then
            node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("audience-evidence/latest.json","utf8")); console.log("Audience audit:",r.status,r.summary); const note=["### QuantaPhi audience audit", "", "Status: **"+r.status+"**", "Pages: "+r.summary.healthyPages+" healthy / "+r.summary.pagesChecked+" checked", "Sitemap: "+(r.sitemap.healthy?"OK":"Needs work"), "", ...r.pages.filter(x=>!x.healthy).map(x=>"- "+x.url+": "+x.findings.map(f=>f.code).join(", "))].join("\\n"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,note+"\\n");'
          else
            echo "Audit file missing; no fabricated receipt" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaphi-audience-evidence
          path: audience-evidence/latest.json
          if-no-files-found: warn
      - name: Fail visibly on broken pages or missing share metadata
        if: steps.site_audit.outcome == 'failure'
        run: exit 1
