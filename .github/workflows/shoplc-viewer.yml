name: ShopLC same-origin viewer regression
on:
  pull_request:
    paths: ['workers/quantaphi-site/worker.js', 'test/shoplc-embed.test.cjs', 'test/starquest-org-route.test.cjs', '.github/workflows/shoplc-viewer.yml']
  push:
    branches: [main]
    paths: ['workers/quantaphi-site/worker.js', 'test/shoplc-embed.test.cjs', 'test/starquest-org-route.test.cjs', '.github/workflows/shoplc-viewer.yml']
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check workers/quantaphi-site/worker.js
      - run: node --test test/shoplc-embed.test.cjs test/starquest-org-route.test.cjs
