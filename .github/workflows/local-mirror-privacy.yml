name: Local Mirror privacy regression
on:
  push:
    paths:
      - 'local-mirror*'
      - 'test/local-mirror*.test.mjs'
      - 'bubbles-card-catalog.mjs'
      - 'workers/quantaphi-site/worker.js'
      - 'work/unfinished/TICKET-2008.md'
      - '.github/workflows/local-mirror-privacy.yml'
  pull_request:
    paths:
      - 'local-mirror*'
      - 'test/local-mirror*.test.mjs'
      - 'bubbles-card-catalog.mjs'
      - 'workers/quantaphi-site/worker.js'
      - 'work/unfinished/TICKET-2008.md'
      - '.github/workflows/local-mirror-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-only-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local storage, source-only Radar, CSP, and Bubbles catalog
        run: node --test test/local-mirror.test.mjs test/local-mirror-edge.test.mjs test/local-mirror-catalog.test.mjs
