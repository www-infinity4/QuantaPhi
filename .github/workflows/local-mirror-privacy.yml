name: Local Mirror privacy regression
on:
  push:
    paths:
      - 'local-mirror*'
      - 'test/local-mirror*'
      - 'bubbles-card-catalog.mjs'
      - 'workers/quantaphi-site/worker.js'
      - 'work/unfinished/TICKET-2008.md'
      - '.github/workflows/local-mirror-privacy.yml'
  pull_request:
    paths:
      - 'local-mirror*'
      - 'test/local-mirror*.test.mjs'
      - 'bubbles-card-catalog.mjs'
      - 'workers/quantaphi-site/worker.js'
      - 'work/unfinished/TICKET-2008.md'
      - '.github/workflows/local-mirror-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-only-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local storage, source-only Radar, CSP, and Bubbles catalog
        run: node --test test/local-mirror.test.mjs test/local-mirror-edge.test.mjs test/local-mirror-catalog.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium (test runner only)
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
      - name: Run isolated Chromium privacy smoke
        run: python test/local-mirror.browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-mirror-privacy-browser
          path: local-mirror-*.png
          if-no-files-found: ignore
