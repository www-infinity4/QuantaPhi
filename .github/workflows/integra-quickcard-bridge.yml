name: Integra X and Bubbles Card APK bridge
on:
  push:
    branches: ['feat/quickcard-bubbles-install-bridge-20261025']
  pull_request:
    paths:
      - 'quick-card-apk-bridge.mjs'
      - 'quick-card-apk-bridge.css'
      - 'integra-x-reply-policy.mjs'
      - 'bubbles-ai.js'
      - 'bubbles-quick-card-registry.mjs'
      - 'test/bubbles-quick-card-registry.test.mjs'
      - 'source-quick-cards.mjs'
      - 'science-quick-cards.mjs'
      - 'quanta-feed-catalog.mjs'
      - 'quanta-feed.mjs'
      - 'android/bubbles-overlay/**'
      - 'test/bubbles-apk-card-deeplink.test.mjs'
      - 'bubbles-provider-card.mjs'
      - 'bubbles-provider-card.html'
      - 'bubbles-card-catalog.mjs'
      - 'test/bubbles-provider-card.test.mjs'
      - 'test/quick-card-apk-bridge.test.mjs'
      - 'test/integra-x-reply-policy.test.mjs'
      - '.github/workflows/integra-quickcard-bridge.yml'
      - 'index.html'
      - 'source-quick-card.html'
      - 'quanta-feed-card.html'
      - 'quick-card-builder.html'
      - 'bubbles-card-host.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of new public entry points
        run: |
          node --check quick-card-apk-bridge.mjs
          node --check integra-x-reply-policy.mjs
          node --check bubbles-provider-card.mjs
          node --check bubbles-ai.js
          node --check bubbles-card-catalog.mjs
          node --check bubbles-quick-card-registry.mjs
      - name: Verify URL safety, X reply consent, and replay protection
        run: node --test test/quick-card-apk-bridge.test.mjs test/integra-x-reply-policy.test.mjs test/bubbles-provider-card.test.mjs test/bubbles-apk-card-deeplink.test.mjs test/bubbles-quick-card-registry.test.mjs
      - name: Check all public card pages load the shared bridge
        shell: bash
        run: |
          for page in index.html source-quick-card.html quanta-feed-card.html quick-card-builder.html bubbles-card-host.html; do
            grep -q 'quick-card-apk-bridge.mjs' "$page"
            grep -q 'quick-card-apk-bridge.css' "$page"
          done
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android API 35 platform is installed
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$TOOL"
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android card deep-link receiver and overlay
        working-directory: android/bubbles-overlay
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
