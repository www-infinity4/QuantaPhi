name: X Spaces Quick Card + Worldwide Radio Sources
on:
  pull_request:
    paths:
      - 'x-spaces-quick-card.mjs'
      - 'quanta-feed-spaces.mjs'
      - 'iowa-live-radio-cards.js'
      - 'index.html'
      - 'asteroid-spaces-model.mjs'
      - 'asteroid-spaces-radio.mjs'
      - 'asteroid-spaces-radio.css'
      - 'asteroid-spaces-index.json'
      - 'bubbles-card-catalog.mjs'
      - 'oracle-card-deck.js'
      - 'workers/media-star-following/worker.js'
      - 'workers/media-star-following/migrations/20261118-asteroid-radio.sql'
      - 'test/asteroid-spaces-card.test.mjs'
      - 'test/asteroid-spaces-worker.test.mjs'
      - 'test/live-radio-x-spaces-quick-card.test.mjs'
      - 'test/iowa-live-radio-cards.test.mjs'
      - '.github/workflows/live-radio-x-spaces-quick-card.yml'
  push:
    branches: [main]
    paths:
      - 'x-spaces-quick-card.mjs'
      - 'quanta-feed-spaces.mjs'
      - 'iowa-live-radio-cards.js'
      - 'asteroid-spaces-model.mjs'
      - 'asteroid-spaces-radio.mjs'
      - 'asteroid-spaces-radio.css'
      - 'asteroid-spaces-index.json'
      - 'bubbles-card-catalog.mjs'
      - 'oracle-card-deck.js'
      - 'workers/media-star-following/worker.js'
      - 'workers/media-star-following/migrations/20261118-asteroid-radio.sql'
      - 'test/asteroid-spaces-card.test.mjs'
      - 'test/asteroid-spaces-worker.test.mjs'
      - 'test/live-radio-x-spaces-quick-card.test.mjs'
      - '.github/workflows/live-radio-x-spaces-quick-card.yml'
permissions:
  contents: read
jobs:
  quick-card-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check iowa-live-radio-cards.js
          node --check x-spaces-quick-card.mjs
          node --check asteroid-spaces-model.mjs
          node --check asteroid-spaces-radio.mjs
          node --check workers/media-star-following/worker.js
      - name: Source and mobile-control regressions
        run: node --test test/live-radio-x-spaces-quick-card.test.mjs test/iowa-live-radio-cards.test.mjs test/asteroid-spaces-card.test.mjs test/asteroid-spaces-worker.test.mjs
