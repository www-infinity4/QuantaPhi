name: Bubbles local inference contract

on:
  pull_request:
    paths:
      - 'android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/LocalBrain*.java'
      - 'test/java/LocalBrainSessionTest.java'
      - 'test/bubbles-local-brain-session.test.cjs'
      - '.github/workflows/bubbles-local-brain.yml'
  push:
    branches: [main]
    paths:
      - 'android/bubbles-overlay/app/src/main/java/org/quantaphi/bubbles/LocalBrain*.java'
      - 'test/java/LocalBrainSessionTest.java'
      - 'test/bubbles-local-brain-session.test.cjs'
      - '.github/workflows/bubbles-local-brain.yml'

permissions:
  contents: read

jobs:
  java-offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify the offline boundary
        run: node --test test/bubbles-local-brain-session.test.cjs
