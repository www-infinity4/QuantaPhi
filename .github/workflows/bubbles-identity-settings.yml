name: Bubbles identity settings quick card
on:
  pull_request:
    paths:
      - 'bubbles-identity-settings*'
      - 'workers/identity-vault/migrations/002_document_vault.sql'
      - 'test/bubbles-identity-settings.test.mjs'
      - 'index.html'
      - 'oracle-card-deck.js'
      - 'bubbles-accounts.html'
      - 'bubbles.html'
      - 'robot-brain-account-security.html'
      - 'disability-housing.html'
      - '.github/workflows/bubbles-identity-settings.yml'
  push:
    branches: [main]
    paths:
      - 'bubbles-identity-settings*'
      - 'test/bubbles-identity-settings.test.mjs'
jobs:
  identity-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client module syntax
        run: |
          node --check bubbles-identity-settings-core.mjs
          node --check bubbles-identity-settings.mjs
          node --check bubbles-identity-settings-card.mjs
      - name: Identity/benefit settings source and routing tests
        run: node --test test/bubbles-identity-settings.test.mjs
