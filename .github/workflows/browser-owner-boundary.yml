name: Public browser owner boundary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'quanta-agent-iterations.js', 'robot-directions.js', 'browser-check-spec.json', 'tests/browser-owner-boundary.spec.mjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.owner.config.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-owner-boundary
          path: proofs/screenshots/
