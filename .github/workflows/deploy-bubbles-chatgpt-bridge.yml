name: Deploy Bubbles ChatGPT Cloud Browser bridge
on:
  push:
    branches: [main]
    paths:
      - 'workers/bubbles-cloud-browser/**'
      - 'workers/bubbles-tools/browser.mjs'
      - 'workers/bubbles-tools/browser-cdp.mjs'
      - 'bubbles-cloud-browser.mjs'
      - 'bubbles-ai.js'
      - '.github/workflows/deploy-bubbles-chatgpt-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubbles-chatgpt-browser-deploy
  cancel-in-progress: false
jobs:
  deploy-browser-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and secure owner bridge behavior
        run: |
          node --check workers/bubbles-cloud-browser/worker.mjs
          node --check workers/bubbles-cloud-browser/chatgpt-bridge.mjs
          node --check bubbles-cloud-browser.mjs
          node --check bubbles-ai.js
          node --test test/bubbles-server-assist.test.mjs test/bubbles-runner-bridge.test.mjs test/bubbles-chatgpt-bridge.test.mjs test/bubbles-cloud-browser.test.mjs test/bubbles-browser-consent.test.mjs test/bubbles-browser-agent.test.mjs
      - name: Check whether the GitHub runner has Cloudflare deploy credentials
        id: deploy_auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub runner has no Cloudflare deploy secret. Code checks passed; production deploy must use an explicitly authorized Cloudflare API connection."
          fi
      - name: Deploy actual browser Worker with D1 bridge binding
        if: steps.deploy_auth.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/bubbles-cloud-browser/wrangler.toml
      - name: Verify deployed Browser Run, owner gate, consent and D1
        if: steps.deploy_auth.outputs.available == 'true'
        run: |
          node --input-type=module <<'VERIFY'
          const url='https://bubbles-cloud-browser.marvaseater.workers.dev';
          const health=await fetch(url+'/health',{headers:{'Cache-Control':'no-cache'}}).then(r=>r.json());
          for(const name of ['browserBound','ownerGate','consentBound','chatgptBridgeBound']){
           if(health[name]!==true)throw Error('Live browser binding missing: '+name);
          }
          const denied=await fetch(url+'/v1/browser/chatgpt/permission',{
           method:'POST',headers:{Origin:'https://quantaphi.org','Content-Type':'application/json'},
           body:JSON.stringify({action:'enable'})
          });
          if(denied.status!==403)throw Error('Unauthenticated access was not rejected');
          console.log('Live Browser Run + ChatGPT bridge bindings healthy; unsigned grant denied.');
          VERIFY
