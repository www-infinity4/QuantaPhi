name: Infinity Platinum Android browser APK
on:
  pull_request:
    paths:
      - 'android/infinity-platinum/**'
      - 'platinum/**'
      - 'test/infinity-platinum-android.test.cjs'
      - 'test/infinity-platinum.test.cjs'
      - '.github/workflows/platinum-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/infinity-platinum/**'
      - 'platinum/**'
      - 'test/infinity-platinum-android.test.cjs'
      - 'test/infinity-platinum.test.cjs'
      - '.github/workflows/platinum-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Android SDK platform and build tools
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$TOOL"
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Verify standalone URL parser without Android SDK
        run: |
          mkdir -p /tmp/platinum-navigation
          javac -d /tmp/platinum-navigation android/infinity-platinum/app/src/main/java/org/quantaphi/platinum/PlatinumNavigation.java android/infinity-platinum/checks/PlatinumNavigationCheck.java
          java -cp /tmp/platinum-navigation org.quantaphi.platinum.PlatinumNavigationCheck
      - name: Verify browser policies and working project links
        run: |
          node --check platinum/core.js
          node --check platinum/platinum.js
          node --test test/infinity-platinum.test.cjs test/infinity-platinum-android.test.cjs
      - name: Reuse test-only Platinum signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: infinity-platinum-preview-debug-keystore-v1
      - name: Compile Infinity Platinum browser
        working-directory: android/infinity-platinum
        run: gradle --no-daemon assembleDebug
      - name: Verify signed APK is Android 12 compatible
        run: |
          set -e
          APK=android/infinity-platinum/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -s "$APK"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/platinum-badging.txt
          grep -q "name='org.quantaphi.platinum.preview1'" /tmp/platinum-badging.txt
          grep -q "sdkVersion:'26'" /tmp/platinum-badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-platinum-android12-apk
          path: android/infinity-platinum/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: infinity-platinum-android12-apk
          path: dist
      - name: Publish directly installable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv dist/app-debug.apk dist/Infinity-Platinum-Android12-Preview.apk
          (cd dist && sha256sum Infinity-Platinum-Android12-Preview.apk > Infinity-Platinum-Android12-Preview.apk.sha256)
          if gh release view infinity-platinum-preview-current --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload infinity-platinum-preview-current dist/Infinity-Platinum-Android12-Preview.apk dist/Infinity-Platinum-Android12-Preview.apk.sha256 --clobber --repo "$GH_REPO"
          else
            gh release create infinity-platinum-preview-current dist/Infinity-Platinum-Android12-Preview.apk dist/Infinity-Platinum-Android12-Preview.apk.sha256 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Infinity Platinum Android Preview" --notes "Android System WebView based Platinum browser preview; install separately from Chrome and Bubbles. Not a production browser replacement. Debug-signed for preview testing."
          fi
