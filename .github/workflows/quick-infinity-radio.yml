name: Infinity Radio quick player
on:
  pull_request:
    paths: ['quick-infinity-radio.js', 'test/quick-infinity-radio.test.mjs', 'oracle-card-deck.js', 'index.html', '.github/workflows/quick-infinity-radio.yml']
  push:
    branches: [main]
    paths: ['quick-infinity-radio.js', 'test/quick-infinity-radio.test.mjs', 'oracle-card-deck.js', 'index.html', '.github/workflows/quick-infinity-radio.yml']
permissions:
  contents: read
jobs:
  radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check quick-infinity-radio.js && node --test test/quick-infinity-radio.test.mjs
