name: Bubbles hourly public X reader
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bubbles-public-x-reader.mjs'
      - '.github/workflows/bubbles-hourly-public-x.yml'
  pull_request:
    paths:
      - 'scripts/bubbles-public-x-reader.mjs'
      - 'test/bubbles-public-x-reader.test.mjs'
      - '.github/workflows/bubbles-hourly-public-x.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: bubbles-public-x-reader-hourly
  cancel-in-progress: false
jobs:
  read-public-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify author identity, untagged classification and dedupe
        run: node --test test/bubbles-public-x-reader.test.mjs
      - name: Install cloud browser
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read public X timeline and save deduplicated candidate inbox
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bubbles-public-x-reader.mjs
