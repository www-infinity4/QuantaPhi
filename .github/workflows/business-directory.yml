name: Business directory regression
on:
  pull_request:
    paths:
      - 'workers/business-directory.js'
      - 'business-directory-card.*'
      - 'test/business-directory.test.mjs'
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check workers/business-directory.js
      - run: node --check business-directory-card.mjs
      - run: node --test test/business-directory.test.mjs
