name: Bubbles Cloudflare OAuth registration audit (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-bubbles-cloudflare-client.yml'
      - 'scripts/audit-bubbles-cloudflare-client.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-oauth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect existing Cloudflare OAuth client using read-only API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/audit-bubbles-cloudflare-client.py
