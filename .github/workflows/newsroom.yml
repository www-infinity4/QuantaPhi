name: News Phi newsroom and publisher readiness
on:
  pull_request:
    paths:
      - 'newsroom/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'test/newsroom.test.mjs'
      - 'test/newsroom-freshness.test.mjs'
      - 'test/newsroom-daily.test.mjs'
      - 'scripts/newsroom-draft.mjs'
      - '.github/workflows/newsroom-drafts.yml'
      - '.github/workflows/newsroom.yml'
  push:
    branches: [main, 'feat/newsroom-adsense-readiness-20261101']
    paths:
      - 'newsroom/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'test/newsroom.test.mjs'
      - 'test/newsroom-freshness.test.mjs'
      - 'test/newsroom-daily.test.mjs'
      - 'scripts/newsroom-draft.mjs'
      - '.github/workflows/newsroom-drafts.yml'
      - '.github/workflows/newsroom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check newsroom/live.mjs
          node --check newsroom/fresh-reports.mjs
          node --check scripts/newsroom-draft.mjs
      - name: Original article, discovery, news freshness and existing privacy tests
        run: node --test test/newsroom-daily.test.mjs test/newsroom-freshness.test.mjs test/newsroom.test.mjs test/privacy-policy.test.mjs test/audience-audit.test.mjs
