name: Restaurant Directory · Denver Overture import
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/restaurant-directory-import.py
      - .github/workflows/restaurant-directory-import.yml
  schedule:
    - cron: '15 9 * * 1'
permissions:
  contents: write
concurrency:
  group: restaurant-directory-denver
  cancel-in-progress: false
jobs:
  import-denver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify importer regression tests before fetching data
        run: python -m unittest discover -s test -p test_restaurant_directory_import.py -v
      - name: Install official Overture Maps download client
        run: python -m pip install --disable-pip-version-check overturemaps
      - name: Download only Denver-metro place features
        run: |
          overturemaps download --bbox=-105.12,39.60,-104.69,39.92 -f geojson --type=place -o /tmp/denver-overture.geojson
      - name: Deduplicate and retain high confidence restaurants
        run: |
          python scripts/restaurant-directory-import.py \
            --input /tmp/denver-overture.geojson \
            --output data/restaurants/denver-co.json \
            --release 2026-10-21.0
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/restaurants/denver-co.json').read_text())
          print(f"Verified source record count: {len(d['items'])}")
          assert all(not x['sponsored'] and x['source_name']=='Overture Maps' for x in d['items'])
          PY
      - name: Publish vetted source snapshot if changed
        run: |
          git add data/restaurants/denver-co.json
          if git diff --cached --quiet; then echo 'No snapshot changes'; exit 0; fi
          git -c user.name='QuantaPhi Restaurant Directory' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh Denver restaurant directory from Overture'
          git push origin HEAD:main
