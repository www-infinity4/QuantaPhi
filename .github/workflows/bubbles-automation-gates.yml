name: Bubbles automation consent gates
on:
  pull_request:
    paths:
      - 'automation/bubbles/**'
      - '.github/workflows/bubbles-automation-gates.yml'
  push:
    branches: [main]
    paths:
      - 'automation/bubbles/**'
      - '.github/workflows/bubbles-automation-gates.yml'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test automation/bubbles/automation.test.mjs
