name: Robot Brain wallet owner boundary
on:
  pull_request:
    paths:
      - 'robot-brain-owner.js'
      - 'workers/infinity-brain-clock/**'
      - 'test/robot-brain-owner.test.cjs'
      - 'test/brain-clock.test.mjs'
      - 'test/bubbles-owner-approval.test.cjs'
      - 'test/bubbles-bulk-approval.test.cjs'
      - 'bubbles-brain-actions.js'
      - 'test/red-sectors.test.mjs'
      - 'test/alarm-retry.test.mjs'
      - '.github/workflows/robot-brain-wallet-owner.yml'
  push:
    branches: [main]
    paths:
      - 'robot-brain-owner.js'
      - 'workers/infinity-brain-clock/**'
      - 'test/robot-brain-owner.test.cjs'
      - 'test/brain-clock.test.mjs'
      - '.github/workflows/robot-brain-wallet-owner.yml'
permissions:
  contents: read
jobs:
  owner-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check owner and clock source
        run: |
          node --check robot-brain-owner.js
          node --check workers/infinity-brain-clock/worker.js
      - name: Verify private wallet-owner authorization
        run: |
          node --test test/bubbles-bulk-approval.test.cjs test/bubbles-owner-approval.test.cjs
          node --test test/red-sectors.test.mjs test/alarm-retry.test.mjs test/robot-brain-owner.test.cjs test/brain-clock.test.mjs test/bubbles-conversation-memory.test.mjs workers/infinity-brain-clock/brain-rag-memory.test.mjs test/bubbles-github-credential.test.mjs test/brain-merge-receipt.test.mjs test/brain-notifications.test.mjs test/bubbles-direct-github.test.mjs test/agent-iteration-card.test.cjs
