name: Verify decoded text proxy
on:
  pull_request:
    paths: ['workers/quantaphi-site/**', 'test/quantaphi-text-proxy.test.mjs', '.github/workflows/quantaphi-text-proxy.yml']
  push:
    branches: [main]
    paths: ['workers/quantaphi-site/**', 'test/quantaphi-text-proxy.test.mjs', '.github/workflows/quantaphi-text-proxy.yml']
permissions:
  contents: read
jobs:
  text-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Ensure we are on the exact base SHA that the patch expects
      - name: Reset repository to base SHA
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha || github.sha }}
          git checkout ${{ github.event.pull_request.base.sha || github.sha }}
      - run: node --test test/quantaphi-text-proxy.test.mjs
      - run: node --test test/brain-patch-routing.test.mjs
