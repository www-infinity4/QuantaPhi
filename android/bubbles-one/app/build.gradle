plugins { id 'com.android.application' }
android {
    namespace 'org.quantaphi.bubblesone'
    compileSdk 35
    defaultConfig {
        applicationId 'org.quantaphi.bubblesone'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        preview {
            storeFile rootProject.file('preview-one.keystore')
            storePassword 'android'
            keyAlias 'bubblesone'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            if (rootProject.file('preview-one.keystore').isFile()) signingConfig signingConfigs.preview
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
