<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phi Search Card</title><meta name="robots" content="noindex">
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#1b2b42;background:#eff7ff}
*{box-sizing:border-box}body{margin:0;padding:14px}
header{background:linear-gradient(130deg,#1f2251,#3d2766);border-radius:19px;padding:16px;color:white;box-shadow:0 8px 20px #11264522}
header h1{margin:0 0 8px;font-size:1.55rem}header p{margin:0 0 11px;color:#dceef7}
form{display:flex;gap:7px}input{flex:1;min-width:0;border:2px solid #a9dded;border-radius:12px;padding:10px;font:inherit}button{background:#abf4cc;color:#153d32;font:800 14px system-ui;border:0;border-radius:11px;min-height:43px;padding:9px 13px;cursor:pointer}
#state{color:#465c75;font-size:.85rem;margin:11px 3px}main{display:grid;gap:12px}section{background:#fff;border-radius:14px;border:1px solid #cfdbe9;padding:12px}
h2{font-size:1.07rem;margin:0 0 9px}.result{padding:11px 0;border-bottom:1px solid #edf0f5}.result:last-child{border-bottom:0}
.result h3{font-size:.94rem;margin:0 0 4px}.result a{color:#18559b;font-weight:800;overflow-wrap:anywhere}.result p{margin:4px 0;font-size:.87rem;color:#394e64}.result small{color:#64748b;overflow-wrap:anywhere}.result button{font-size:.77rem;min-height:31px;padding:5px 10px;background:#e5ddff;color:#372058;border:1px solid #aca1cd;margin:5px 0}
#results{display:grid;grid-template-columns:1fr;gap:4px}.visual{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.visual .result{border:1px solid #e2e9f0;border-radius:12px;padding:6px;min-width:0}.visual img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#e9edf7}.visual a{font-size:.82rem}
#reader[hidden],#overview[hidden]{display:none}#reader{border:2px solid #907be0}#reader iframe{width:100%;height:350px;border:1px solid #cfddeb;background:white;border-radius:10px}
.viewerBar{display:flex;justify-content:space-between;gap:10px;align-items:center}.viewerBar button{background:#d8e6f5}
#sourceLink{display:inline-block;margin:7px 0;font-size:.88rem}#reader .warning{color:#56637c;font-size:.79rem}
@media(max-width:450px){body{padding:7px}header{padding:12px;border-radius:13px}.visual{grid-template-columns:repeat(2,1fr)}form{flex-wrap:wrap}form button{flex-shrink:0}}
</style><script src="./search.js?v=1" defer></script>
</head><body>
<header><h1 id="title">Search Engine</h1><p id="subtitle">Search research sources without leaving this site.</p>
<form id="searchForm"><input id="query" name="q" type="search" placeholder="Search anything…" autocomplete="off" maxlength="200" required aria-label="Research query">
<button type="submit">Search</button></form></header>
<p id="state" role="status" aria-live="polite">Enter a topic to search.</p>
<main><section id="overview" hidden><h2>AI Overview</h2><div id="overviewBody"></div></section>
<section id="sourceResults"><h2 id="resultHeading">Sources</h2><div id="results"></div></section>
<section id="reader" hidden><div class="viewerBar"><h2 id="viewerTitle">Source viewer</h2><button type="button" id="close">Close</button></div>
<a id="sourceLink" rel="noopener noreferrer" target="_blank">Open original source ↗</a>
<p class="warning">Some publishers block framing; if the source is blank, open the original. No article contents are copied to your website.</p>
<iframe id="frame" title="Source preview" sandbox="allow-scripts allow-forms allow-popups" referrerpolicy="no-referrer" loading="lazy"></iframe>
</section></main></body></html>
