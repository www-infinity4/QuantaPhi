<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>QuantaPhi wallet connection</title></head>
<body>
<p id="status">Connecting your existing Infinity wallet…</p>
<script>
'use strict';
const PAID_ORIGINS=new Set(['https://quantaphi.org','https://www.quantaphi.org','https://quantaphi.net','https://www.quantaphi.net']);
const DEVICE_PREFIX='starquest_ledger_device_v1:';
const keys=['starquest_session','c13b0_infinity_token_ledger_v3','infinity_unified_token_count_v3','phi:assetBalances:v1','quantaPhiBuildHistoryV1','quantaPhiCollected','quantaPhiTokens','quantaPhi:pendingSearchCommits:v2','quantaPhi:pendingInfinityCredits:v1'];
const deviceToken=value=>{if(/^sq_[A-Za-z0-9_-]{32,}$/.test(value||''))return value;try{const parsed=JSON.parse(value||'null');return /^sq_[A-Za-z0-9_-]{32,}$/.test(parsed?.deviceToken||'')?parsed.deviceToken:''}catch{return ''}};
function credentialValues(includeLegacy=false){
 const values={};
 try{
  if(includeLegacy)for(const key of keys){const value=localStorage.getItem(key);if(value!==null)values[key]=value}
  else{const value=localStorage.getItem('starquest_session');if(value!==null)values.starquest_session=value}
  let session=null;try{session=JSON.parse(localStorage.getItem('starquest_session')||'null')}catch{}
  const username=String(session?.username||session?.key||'').toLowerCase();
  const deviceKeys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(key.startsWith(DEVICE_PREFIX)&&deviceToken(localStorage.getItem(key)))deviceKeys.push(key)}
  const selected=username?deviceKeys.filter(key=>key===DEVICE_PREFIX+username):deviceKeys;
  for(const key of selected)values[key]=localStorage.getItem(key);
  const accountKey=String(session?.key||username||selected[0]?.slice(DEVICE_PREFIX.length)||'').toLowerCase();
  let users={},backup={};try{users=JSON.parse(localStorage.getItem('starquest_users')||'{}')}catch{}try{backup=JSON.parse(localStorage.getItem('starquest_users_backup_v1')||'{}')}catch{}
  const user=users[accountKey]||backup[accountKey];
  if(selected.length===1&&user&&String(user.key||accountKey).toLowerCase()===accountKey){
   // Transfer only the selected account's bootstrap cache. Password text and other accounts stay behind.
   const profile={key:accountKey,username:String(user.username||accountKey),passwordHash:String(user.passwordHash||''),joinedAt:user.joinedAt,lastLoginAt:user.lastLoginAt,tokens:user.tokens,pendingShareCredits:user.pendingShareCredits,shareCount:user.shareCount};
   values.starquest_users=JSON.stringify({[accountKey]:profile});
   if(!values.starquest_session)values.starquest_session=JSON.stringify({key:accountKey,username:profile.username,signedInAt:Date.now()});
  }
 }catch{}
 return values;
}
function encode(payload){
 const bytes=new TextEncoder().encode(JSON.stringify(payload));
 let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);
 return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const params=new URLSearchParams(location.search);
if(params.get('mode')==='top'){
 let target=null;try{target=new URL(params.get('return')||'')}catch{}
 if(!target||!PAID_ORIGINS.has(target.origin)){document.getElementById('status').textContent='Wallet return address was rejected.'}
 else{
  const payload={version:1,issuedAt:Date.now(),source:location.origin,values:credentialValues(false)};
  target.hash='quantaWalletLink='+encode(payload);
  document.getElementById('status').textContent=Object.keys(payload.values).some(key=>key.startsWith(DEVICE_PREFIX))?'Wallet found. Returning to QuantaPhi…':'No established wallet was found in this browser.';
  setTimeout(()=>location.replace(target.href),40);
 }
}
window.addEventListener('message',event=>{
 if(!PAID_ORIGINS.has(event.origin)||event.source!==parent||event.data?.type!=='quanta:link-request')return;
 parent.postMessage({type:'quanta:link-response',nonce:event.data.nonce,values:credentialValues(true)},event.origin);
});
</script>
</body></html>
