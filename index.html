ze:54px}.soundBody{padding:14px}.soundBody small{color:#d8cce2}.soundBody h3{margin:5px 0 7px;font-size:18px;line-height:1.25}.soundBody p{color:#ddd}.soundBody audio{width:100%;margin:10px 0}.soundActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.soundActions a{background:#5f259f;color:#fff!important;padding:8px 10px;border-radius:11px}.soundActions .cardShare{margin:9px 0 0}.mcard h3{margin:8px 0 4px}.mcard p{margin:0;color:#62596a;line-height:1.4}.mcard a{display:inline-block;margin-top:9px;color:#5f259f;font-weight:800;text-decoration:none}.cardShare{display:inline-block;margin:10px 0 0 8px;border:0;border-radius:11px;padding:8px 10px;background:#111;color:#fff;font-weight:900;touch-action:manipulation}

<body><main class="app">
<div class="qtop"><button class="qmenuBtn" id="qmenuBtn" type="button" aria-label="Menu">☰</button><h1>Quantaφ</h1><div class="qbalances" aria-live="polite"><button class="qtoken" id="qtoken" type="button">∞ Tokens: 0</button><button class="qstar" id="qstar" type="button">★ 0.0</button></div><nav class="qmenu" id="qmenu" hidden><button id="qshare" type="button">Share +0.1 ★</button><a href="#result">Overview</a><button class="mediaNav" id="qImagesBtn" type="button">Images</button><button class="mediaNav" id="qVideoBtn" type="button">Video</button><button class="mediaNav" id="qSoundBtn" type="button">Sound</button><a href="#media">Media</a></nav></div><p class="sub">Semantic field + 500-word overview + weighted media extensions</p>

<div class="qrefine" id="qrefineWrap" hidden><input id="qrefine" autocomplete="off" placeholder="Refine this entity…"><button id="qrefineBtn" type="button">Refine</button></div><div id="status"></div><section class="card" id="result" hidden><div id="field"></div><article id="overview"></article><div class="meter" id="meter"></div></section><section class="media" id="media" hidden><h2>Media extensions</h2><div class="mediaGrid" id="mediaGrid"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const STOP=new Set("is was are were be been being the a an of and in by with to for from on at as or but if than then that this these those it its he she they them his her their who which when where how".split(" "));
function classify(query){
 const words=(query.match(/[A-Za-z0-9'.-]+/g)||[]);
 return words.map((w,i)=>{
   const x=w.toLowerCase();
   let color='yellow',region='78–90',role='semantic particle';
   if(i===0){color='red';region='90–100';role='seed field'}
   else if(STOP.has(x)){color='green';region='10–20';role='grammar/bond candidate'}
   else if(/ly$/.test(x)){color='purple';region='30–40';role='modifier candidate'}
   else if(/(ing|ed)$/.test(x)){color='green';region='20–30';role='event/action candidate'}
   else if(/(ous|ive|al|ic|ful|less|ary|ory)$/.test(x)){color='purple';region='40–50';role='attribute candidate'}
   else if(i===1){color='blue';region='80–95';role='inner semantic field'}
   return {w,color,region,role};
 });
}
function showField(q){
 const p=classify(q);
 $('#field').innerHTML=p.map(x=>'<span class="pill '+x.color+'" title="'+x.role+' · '+x.region+'">'+x.w+'</span>').join('');
 $('#meter').style.display='block';
 $('#meter').textContent='Experimental regions: '+p.map(x=>x.w+' '+x.region).join(' · ');
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mediaCard(x,type){const img=x.img_src||x.thumbnail_src||x.thumbnail||'',title=x.title||'Explore',url=x.url||location.href,desc=String(x.content||x.description||'').split(/\\s+/).slice(0,100).join(' ');if(String(type).toLowerCase()==='video'){const video=x.video||x.video_url||x.media_url||x.enclosure||x.content_url||x.url||'';return '<article class="mcard videoCard" data-source-title="'+esc(title)+'"><div class="videoVisual">'+(video?'<video controls playsinline preload="metadata" poster="'+esc(img)+'" src="'+esc(video)+'"></video>':(img?'<img loading="lazy" src="'+esc(img)+'" alt="'+esc(title)+'">':''))+'</div><div class="videoBody"><small>VIDEO</small><h3>'+esc(title)+'</h3><p>Researching the story behind this video…</p><div class="videoActions"><button class="cardShare" type="button" data-title="'+esc(title)+'" data-url="'+esc(url)+'">Share +0.1 ★</button></div></div></article>'}if(String(type).toLowerCase()==='image'){return '<article class="mcard imageCard" data-source-title="'+esc(title)+'"><div class="imageVisual">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="">':'')+'<span class="imageBadge">IMAGE</span></div><div class="imageBody"><h3 class="imageStoryTitle">Researching this image…</h3><p>Researching the story behind this image…</p><div class="imageActions">'+(x.url?'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">View source</a>':'')+'<button class="cardShare" type="button" data-title="'+esc(title)+'" data-url="'+esc(url)+'" data-image="'+esc(img)+'">Share image +0.1 ★</button></div></div></article>'}if(String(type).toLowerCase()==='sound'){const audio=x.audio||x.audio_url||x.media_url||x.enclosure||x.content_url||x.url||'';return '<article class="mcard soundCard"><div class="soundVisual">♫</div><div class="soundBody"><small>SOUND</small><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'+(audio?'<audio controls preload="metadata" src="'+esc(audio)+'"></audio>':'')+'<div class="soundActions"><button class="cardShare" type="button" data-title="'+esc(title)+'" data-url="'+esc(url)+'">Share +0.1 ★</button></div></div></article>'}return '<article class="mcard">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="">':'')+'<small>'+esc(type)+'</small><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'+(x.url?'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">Open source</a>':'')+'<button class="cardShare" type="button" data-title="'+esc(title)+'" data-url="'+esc(url)+'">Share +0.1 ★</button></article>'}
async function loadMedia(q){try{const terms=(q.match(/[A-Za-z0-9]+/g)||[]).filter(x=>!STOP.has(x.toLowerCase())).join(' ');const searches=[terms,terms+' close up detail',terms+' identification variety'];let all=[];for(const term of searches){const u=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');u.search=new URLSearchParams({q:term,format:'json',categories:'images',safesearch:'1'});const j=await fetch(u).then(r=>r.ok?r.json():({results:[]}));all.push(...(j.results||[]))}const seen=new Set(),imgs=all.filter(x=>{const src=x.img_src||x.thumbnail_src||x.thumbnail;if(!src)return false;const k=src.split('?')[0];if(seen.has(k))return false;seen.add(k);return true}).slice(0,8);const vu=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');vu.search=new URLSearchParams({q:terms,format:'json',categories:'videos',safesearch:'1'});const vj=await fetch(vu).then(r=>r.ok?r.json():({results:[]}));const vids=(vj.results||[]).slice(0,4);$('#mediaGrid').innerHTML=imgs.map(x=>mediaCard(x,'Image')).join('')+vids.map(x=>mediaCard(x,'Video')).join('');$('#media').hidden=!(imgs.length||vids.length)}catch(_){$('#media').hidden=true}}
async function search(){
 const q=$('#q').value.trim(); if(!q)return; $('#media').hidden=true; $('#mediaGrid').innerHTML='';
 $('#result').hidden=false; $('#overview').innerHTML=''; showField(q);
 $('#status').innerHTML='<small>Building semantic field and overview…</small>';
 try{
   const searchUrl=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');
   searchUrl.search=new URLSearchParams({q,format:'json',categories:'general',safesearch:'1'});
   const sr=await fetch(searchUrl,{cache:'no-store'});
   const sj=sr.ok?await sr.json():{results:[]};
   const particles=classify(q); const required=particles.filter(x=>!STOP.has(x.w.toLowerCase())).map(x=>x.w.toLowerCase());
   const weighted=(sj.results||[]).map((x,i)=>{const text=((x.title||'')+' '+(x.content||x.description||'')).toLowerCase();const hits=required.filter(w=>text.includes(w)).length;const coverage=required.length?hits/required.length:0;return {...x,_weight:(coverage*100)+(hits*35)+Math.max(0,20-i)};}).sort((a,b)=>b._weight-a._weight);
   const evidence=weighted.slice(0,12).map((x,i)=>({index:i,weight:Math.round(x._weight),title:x.title||'',url:x.url||'',evidence:String(x.content||x.description||'').slice(0,900)})).filter(x=>x.title||x.evidence);
   const instruction=['You are QuantaPhi.','User search: '+q,'Write an accurate, readable AI overview of about 500 words.','The semantic particles from the user query are mandatory constraints, not decoration. Cover every meaningful query concept, prioritizing evidence with the highest supplied weight. Do not replace a specific requested concept with a broad category.','Use the supplied search evidence as grounding. Do not invent unsupported specifics.','Return plain prose only, no JSON and no heading.','Evidence: '+JSON.stringify(evidence)].join('\n');
   const r=await fetch('https://infinity-rogers.marvaseater.workers.dev/v1/chat',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({input:instruction,context:{application:'QuantaPhi',assistant:'grammar-phi-overview-fallback',task:'500-word-overview',verified_context:{query:q,source_count:evidence.length}}})});
   const d=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));
   let text=d.output_text??d.output??d.answer??d.response??d.content??d.message??'';
   if(text&&typeof text==='object')text=text.text||text.content||JSON.stringify(text);
   text=String(text||'').trim();
   if(!text)throw new Error('Empty AI response');
   $('#overview').textContent=text;$('#status').innerHTML='';loadMedia(q);return;
 }catch(e){
   try{
     const searchUrl=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');
     searchUrl.search=new URLSearchParams({q,format:'json',categories:'general',safesearch:'1'});
     const sj=await fetch(searchUrl,{cache:'no-store'}).then(r=>r.ok?r.json():({results:[]}));
     const required=classify(q).filter(x=>!STOP.has(x.w.toLowerCase())).map(x=>x.w.toLowerCase());
     const ranked=(sj.results||[]).map((x,i)=>{const body=((x.title||'')+' '+(x.content||x.description||'')).replace(/\\s+/g,' ').trim();const low=body.toLowerCase();const hits=required.filter(w=>low.includes(w)).length;return {body,hits,score:(required.length?hits/required.length:0)*100+hits*35+Math.max(0,20-i)}}).filter(x=>x.body&&x.hits).sort((a,b)=>b.score-a.score);
     let out='',seen=new Set(); for(const r of ranked){for(const s of (r.body.match(/[^.!?]+[.!?]+/g)||[r.body])){const low=s.toLowerCase();if(!required.some(w=>low.includes(w)))continue;const k=low.replace(/[^a-z0-9 ]/g,'').slice(0,100);if(k&&!seen.has(k)){seen.add(k);if((out+' '+s).split(/\\s+/).length>520)break;out+=' '+s.trim()}}if(out.split(/\\s+/).length>470)break}
     if(out.trim()){ $('#overview').textContent=out.trim(); $('#status').innerHTML='<small>Weighted local synthesis · AI provider unavailable</small>'; if(typeof loadMedia==='function')loadMedia(q); return; }
   }catch(_){}
   $('#status').innerHTML='<p class="err">Not enough weighted evidence matched every important search concept.</p>';
 }
}
$('#go').onclick=search; $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script><script>(function(){const b=document.getElementById('qmenuBtn'),m=document.getElementById('qmenu');if(!b||!m)return;b.addEventListener('click',function(){m.hidden=!m.hidden});m.addEventListener('click',function(){m.hidden=true})})();</script><script>
(function(){
 const T='quantaPhiTokens',S='quantaPhiStarCoins';
 // WALLET CONTRACT: these keys are persistent QuantaPhi state. Never reset, rename, clear, or overwrite them from feature code.
 function num(k){try{return Number(localStorage.getItem(k)||0)||0}catch(_){return 0}}
 function put(k,v){try{localStorage.setItem(k,String(v));return true}catch(_){return false}}
 let tokenBalance=num(T),starBalance=num(S); function pulse(el){if(!el)return;el.classList.remove('qwalletPulse');void el.offsetWidth;el.classList.add('qwalletPulse')} function render(which){const t=document.getElementById('qtoken'),s=document.getElementById('qstar');if(t)t.textContent='∞ Tokens: '+tokenBalance;if(s)s.textContent='★ '+starBalance.toFixed(1);if(which==='token')pulse(t);if(which==='star')pulse(s)}
 window.QuantaPhiWallet={
  addToken:function(){
   tokenBalance+=1;
   put(T,tokenBalance);
   window.__qTokenSession=(window.__qTokenSession||0)+1;
   render('token');
   return tokenBalance;
  },
  addShare:function(){starBalance=Math.round((starBalance+0.1)*10)/10;put(S,starBalance);render('star');return starBalance},
  render:render
 };
 render();

</script><script>(function(){const wrap=document.getElementById('qrefineWrap'),r=document.getElementById('qrefine'),b=document.getElementById('qrefineBtn'),q=document.getElementById('q');if(!wrap||!r||!b||!q)return;function reveal(){if(q.value.trim())wrap.hidden=false}document.getElementById('go').addEventListener('click',reveal);q.addEventListener('keydown',function(e){if(e.key==='Enter')reveal()});function refine(){const extra=r.value.trim(),base=q.value.trim();if(!extra||!base)return;q.value=(base+' '+extra).trim();r.value='';window.__qRefining=true;Promise.resolve(search()).finally(()=>{window.__qRefining=false})}b.addEventListener('click',refine);r.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();refine()}})})();</script><script>(function(){const b=document.getElementById('qshare'),s=document.getElementById('qstar'),q=document.getElementById('q');if(!b||!s)return;const key='starCoins';function read(){try{return Number(localStorage.getItem(key)||0)}catch(_){return 0}}function show(){s.textContent='★ '+read().toFixed(1)}async function share(){const data={title:'Quantaφ',text:q&&q.value.trim()?('Quantaφ: '+q.value.trim()):'Quantaφ',url:location.href};let completed=false;try{if(navigator.share){await navigator.share(data);completed=true}else{await navigator.clipboard.writeText(location.href);completed=true}}catch(_){return}if(completed){if(window.QuantaPhiWallet)window.QuantaPhiWallet.addShare();else show();b.textContent='Shared +0.1 ★';setTimeout(()=>b.textContent='Share +0.1 ★',1400)}}show();b.addEventListener('click',share)})();</script><script>(function(){
 document.addEventListener('click',async function(e){
  const b=e.target.closest('.cardShare'); if(!b)return;
  const title=b.dataset.title||'Quantaφ', pageUrl=b.dataset.url||location.href, imageUrl=b.dataset.image||'';
  let shared=false;
  try{
   if(imageUrl && navigator.share){
    try{
     const r=await fetch(imageUrl,{mode:'cors'});
     if(r.ok){
      const blob=await r.blob();
      const ext=(blob.type&&blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
      const file=new File([blob],('quantaphi-'+Date.now()+'.'+ext),{type:blob.type||'image/jpeg'});
      if(!navigator.canShare || navigator.canShare({files:[file]})){
       await navigator.share({title,text:title,files:[file]}); shared=true;
      }
     }
    }catch(_){}
   }
   if(!shared){
    const data={title,text:title,url:imageUrl||pageUrl};
    if(navigator.share){await navigator.share(data);shared=true}
    else if(navigator.clipboard){await navigator.clipboard.writeText(imageUrl||pageUrl);shared=true}
   }
  }catch(_){return}
  if(shared){
   if(window.QuantaPhiWallet)window.QuantaPhiWallet.addShare();
   const t=b.textContent;b.textContent='Shared +0.1 ★';setTimeout(()=>b.textContent=t,1400);
  }
 });
})();</script><script>(function(){const media=document.getElementById('media'),grid=document.getElementById('mediaGrid');function openMedia(kind){if(media)media.hidden=false;if(grid){const cards=[...grid.querySelectorAll('.mcard')];cards.forEach(card=>{const t=(card.querySelector('small')?.textContent||'').toLowerCase();card.hidden=(kind!=='all'&&!t.includes(kind))})}if(media)media.scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('qImagesBtn')?.addEventListener('click',()=>openMedia('image'));document.getElementById('qVideoBtn')?.addEventListener('click',()=>openMedia('video'));document.getElementById('qSoundBtn')?.addEventListener('click',()=>openMedia('sound'))})();</script><script>
(function(){
 const btn=document.getElementById('qVideoBtn'),q=document.getElementById('q'),media=document.getElementById('media'),grid=document.getElementById('mediaGrid'),menu=document.getElementById('qmenu');

 btn.addEventListener('click',async function(){
  const query=q.value.trim(); if(!query)return;

   const videos=(j.results||[]).slice(0,20);

  }catch(_){grid.innerHTML='<p class="err">Video search could not load.</p>'}
 });
})();
</script><script>
(function(){
 const q=document.getElementById('q'),media=document.getElementById('media'),grid=document.getElementById('mediaGrid'),menu=document.getElementById('qmenu');
 async function feed(kind,category){
  const query=q&&q.value.trim(); if(!query)return;
  if(menu)menu.hidden=true; media.hidden=false; grid.innerHTML='<small>Loading '+kind.toLowerCase()+' cards…</small>'; media.scrollIntoView({behavior:'smooth',block:'start'});
  try{
   const u=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');
   u.search=new URLSearchParams({q:query,format:'json',categories:category,safesearch:'1'});
   const j=await fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():({results:[]}));
   const rows=(j.results||[]).slice(0,20);
   grid.innerHTML=rows.length?rows.map(x=>mediaCard(x,kind)).join(''):'<p class="err">No '+kind.toLowerCase()+' results found.</p>';
  }catch(_){grid.innerHTML='<p class="err">'+kind+' search could not load.</p>'}
 }
 document.getElementById('qImagesBtn')?.addEventListener('click',e=>{e.stopImmediatePropagation();feed('Image','images')},true);
 document.getElementById('qSoundBtn')?.addEventListener('click',e=>{e.stopImmediatePropagation();feed('Sound','music')},true);
})();
</script><script>
(function(){
 const AI='https://infinity-rogers.marvaseater.workers.dev/v1/chat';
 const SEARCH='https://orange-brook-a2ac.marvaseater.workers.dev/search';
 async function researchStory(card,type){
  if(card.dataset.enriched==='1'||card.dataset.enriching==='1')return;
  card.dataset.enriching='1';
  const q=document.getElementById('q')?.value.trim()||'';
  const title=card.dataset.sourceTitle||'';
  const heading=card.querySelector('h3');
  const p=card.querySelector('p'); if(!p){card.dataset.enriching='';return}
  p.textContent='Researching the story behind this '+type.toLowerCase()+'…';
  try{
   const su=new URL(SEARCH);
   su.search=new URLSearchParams({q:(q+' '+title).trim(),format:'json',categories:'general',safesearch:'1'});
   const sj=await fetch(su,{cache:'no-store'}).then(r=>r.ok?r.json():({results:[]}));
   const evidence=(sj.results||[]).slice(0,8).map(x=>({title:x.title||'',url:x.url||'',evidence:String(x.content||x.description||'').slice(0,700)}));
   if(!evidence.length)throw new Error('no evidence');
   const prompt='Write AT LEAST 100 words and about 110-140 words of factual researched prose for this '+type+' card. Explain what the specific subject is, its background, the relevant event/story/history, and why it matters. Use the user query and evidence to identify context. Never discuss JPEG, file type, filename, dimensions, metadata, thumbnails, search mechanics, or generic visual properties. For an image, do not claim it is the exact historic artifact unless evidence proves that. For a video, explain the actual subject/event/content context rather than calling it a video file. Plain prose only, no heading. Query: '+q+' Card title: '+title+' Evidence: '+JSON.stringify(evidence);
   const r=await fetch(AI,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({input:prompt,context:{application:'QuantaPhi',task:type.toLowerCase()+'-card-story',verified_context:{query:q,title:title}}})});
   if(!r.ok)throw new Error('AI '+r.status);
   const j=await r.json();
   let text=String(j.output_text||j.text||j.response||j.message||'').trim().replace(/\b[^\s]*\.(jpe?g|png|gif|webp|bmp|tiff?)\b/ig,'').replace(/\b(JPEG|JPG|PNG|GIF|WEBP|BMP|TIFF?)\s+(image|file)\b/ig,'image');
   if(!text)throw new Error('empty');
   const words=text.split(/\s+/).filter(Boolean).length;
   if(words<100){
    const retry='Expand this researched card description to AT LEAST 100 words (target 110-140). Keep it factual, specific, and focused on the subject/history; no file or metadata discussion. Original: '+text+' Evidence: '+JSON.stringify(evidence);
    const rr=await fetch(AI,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({input:retry,context:{application:'QuantaPhi',task:'expand-card-story'}})});
    if(rr.ok){const jj=await rr.json();const t=String(jj.output_text||jj.text||jj.response||jj.message||'').trim();if(t)text=t}
   }
   p.textContent=text; if(heading){const clean=(title||q||'Image').replace(/\.(jpe?g|png|gif|webp|bmp|tiff?)\b/ig,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();heading.textContent=clean||q||'Image story'} card.dataset.enriched='1';
  }catch(_){p.textContent='Research for this card is still loading. Tap this media section again to retry.'}
  card.dataset.enriching='';
 }
 function enrichAll(){
  document.querySelectorAll('.imageCard').forEach(c=>researchStory(c,'Image'));
  document.querySelectorAll('.videoCard').forEach(c=>researchStory(c,'Video'));
 }
 const grid=document.getElementById('mediaGrid');
 if(grid)new MutationObserver(enrichAll).observe(grid,{childList:true});
 ['qImagesBtn','qVideoBtn'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>setTimeout(enrichAll,250)));
 enrichAll();
})();
</script><script>
