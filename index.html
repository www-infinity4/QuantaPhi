<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuantaPhi</title><meta name="description" content="QuantaPhi semantic matchmaking search and media-card engine">
<style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;background:#090711;color:#f8f5ff}*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 15px 60px}
h1{margin:15px 0 2px;font-size:29px}.phi{color:#c77dff}.sub{margin:0 0 18px;color:#aaa0ba}.search{display:flex;gap:8px;position:sticky;top:0;padding:10px 0;background:#090711eF;z-index:4}
input{flex:1;min-width:0;border:1px solid #8b5cf6;border-radius:16px;background:#171122;color:white;padding:14px;font-size:16px}button{border:0;border-radius:16px;padding:0 17px;background:#7c3aed;color:white;font-weight:900}
.field{padding:8px 0}.pill{display:inline-block;margin:3px;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.red{background:#c62828}.blue{background:#2467c7}.yellow{background:#d6a600;color:#211900}.green{background:#27864b}.purple{background:#7b35a8}
.overview,.card{background:#15101e;border:1px solid #302440;border-radius:22px;padding:17px;margin-top:13px;box-shadow:0 10px 30px #0005}.overview{line-height:1.58}.grid{display:grid;gap:12px}.card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:15px;background:#21192c}.type{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#cba9ff;font-weight:900}.card h2{margin:8px 0;font-size:20px}.card p{margin:0;color:#d9d2e2;line-height:1.48}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{font-size:12px;padding:9px 11px;border-radius:11px;text-decoration:none;background:#251936;color:#eadcff;border:1px solid #523875}.status{color:#bcb2c8;font-size:13px;margin:8px 2px}
</style></head><body><main class="app"><h1>Quanta<span class="phi">φ</span></h1><p class="sub">Semantic matchmaking engine · Search → knowledge → media → opportunity</p>
<div class="search"><input id="q" placeholder="Search anything…" autocomplete="off"><button id="go">Search</button></div><div id="status" class="status"></div><div id="field" class="field"></div><section id="overview" class="overview" hidden></section><section id="cards" class="grid"></section></main>
<script>
const $=s=>document.querySelector(s), STOP=new Set("is was are were be been being the a an of and in by with to for from on at as or but if than then that this these those it its he she they them his her their who which when where how what".split(" "));
const words=s=>(s.toLowerCase().match(/[a-z0-9'-]+/g)||[]).filter(x=>!STOP.has(x));
function classify(q){return (q.match(/[A-Za-z0-9'.-]+/g)||[]).map((w,i)=>{let c=i===0?'red':i===1?'blue':'yellow',n=i===0?98:i===1?90:82;if(STOP.has(w.toLowerCase())){c='green';n=15}else if(/(ing|ed)$/.test(w)){c='green';n=26}else if(/(ly|ous|ive|al|ic|ful|less|ary|ory)$/.test(w)){c='purple';n=43}return{w,c,n}})}
function field(q){$('#field').innerHTML=classify(q).map(x=>'<span class="pill '+x.c+'">'+x.w+' · '+x.n+'</span>').join('')}
function score(text,anchors,i){let t=words(text),hits=anchors.reduce((n,a)=>n+t.filter(x=>x===a||x.includes(a)||a.includes(x)).length,0);return hits*18+Math.max(0,20-i*2)+Math.min(12,new Set(t).size/5)}
function trim100(s){let a=String(s||'').replace(/\s+/g,' ').trim().split(' ');return a.slice(0,100).join(' ')+(a.length>100?'…':'')}
async function searx(q,cat='general'){let u=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');u.search=new URLSearchParams({q,format:'json',categories:cat,safesearch:'1'});let r=await fetch(u);if(!r.ok)throw Error('search '+r.status);return r.json()}
function card(x,type,img=''){let el=document.createElement('article');el.className='card';el.innerHTML=(img?'<img loading="lazy" src="'+img.replace(/"/g,'')+'" alt="">':'')+'<div class="type">'+type+'</div><h2>'+String(x.title||'Explore').replace(/[<>]/g,'')+'</h2><p>'+trim100(x.content||x.description||'Strong semantic match for this search.')+'</p><div class="actions">'+(x.url?'<a target="_blank" rel="noopener" href="'+x.url+'">Source</a>':'')+'<button class="gen">Generate media</button></div>';el.querySelector('.gen').onclick=()=>alert('Generator extension indexed for: '+(x.title||'this card'));return el}
async function run(){
 let q=$('#q').value.trim();if(!q)return;field(q);$('#cards').innerHTML='';$('#overview').hidden=true;$('#status').textContent='Weighing buyer/search intent against knowledge, media and opportunity…';
 try{
  let [g,im,vid]=await Promise.all([searx(q),searx(q,'images'),searx(q+' video','videos').catch(()=>({results:[]}))]);
  let anchors=words(q),rank=(g.results||[]).map((x,i)=>({...x,_s:score((x.title||'')+' '+(x.content||''),anchors,i)})).sort((a,b)=>b._s-a._s);
  let top=rank.slice(0,6),overview=top.map(x=>x.content||x.description).filter(Boolean).join(' ');
  $('#overview').textContent=trim100(overview);$('#overview').hidden=false;
  let images=(im.results||[]).filter(x=>x.img_src||x.thumbnail_src||x.thumbnail).slice(0,4);
  top.slice(0,3).forEach((x,i)=>$('#cards').append(card(x,'Knowledge · weight '+Math.round(x._s),images[i]?.img_src||images[i]?.thumbnail_src||images[i]?.thumbnail||'')));
  images.slice(0,3).forEach(x=>$('#cards').append(card({title:x.title||q,content:'Visual extension selected from the semantic field.',url:x.url},'Image',x.img_src||x.thumbnail_src||x.thumbnail)));
  (vid.results||[]).slice(0,2).forEach(x=>$('#cards').append(card(x,'Video')));
  let opportunity=rank.find(x=>/shop|store|buy|sale|auction|price|dealer|market|product/i.test((x.title||'')+' '+(x.content||'')));
  if(opportunity)$('#cards').append(card(opportunity,'Verified-source opportunity'));
  $('#status').textContent='QuantaPhi field deployed · cards capped at 100 words';
 }catch(e){$('#status').textContent='Search field unavailable: '+e.message}
}
$('#go').onclick=run;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script></body></html>
