<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuantaPhi</title>
<meta name="description" content="QuantaPhi experimental semantic-weight search engine">
<style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color:#17131f;background:#f7f4fb}
*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 16px 50px}
h1{font-size:27px;margin:18px 0 4px}.qtop{display:flex;align-items:center;gap:10px;position:relative}.qtoken{margin-left:auto;background:#17131f;color:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;white-space:nowrap}.qstar{background:#fff4b8;color:#332600;border:1px solid #ead16b;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:900;white-space:nowrap}.qshare{border:0;border-radius:12px;padding:8px 11px;font-weight:900;background:#111;color:#fff;touch-action:manipulation}.qmenuBtn{border:0;border-radius:12px;padding:8px 11px;font-size:20px;font-weight:800;background:#5f259f;color:#fff;touch-action:manipulation}.qmenu{position:absolute;left:0;top:54px;background:#fff;border:1px solid #e6dfeb;border-radius:14px;padding:7px;z-index:20;box-shadow:0 8px 28px #29163b22}.qmenu a,.qmenu button{display:block;width:100%;padding:10px 13px;margin:2px 0;border:0;border-radius:10px;background:#fff;color:#5f259f;font-weight:800;text-align:left;text-decoration:none}.qmenu .menuWallet{color:#17131f;background:#f7f4fb;pointer-events:none}.qmenu .mediaNav{background:#f3ecf8}.qrefine{display:flex;gap:8px;margin:10px 0 2px}.qrefine input{min-width:0;flex:1;border:1px solid #cfc4d8;border-radius:12px;padding:10px;font-size:14px;background:#fff}.qrefine button{border:0;border-radius:12px;padding:0 12px;font-weight:800;background:#5f259f;color:#fff;touch-action:manipulation}.sub{margin:0 0 22px;color:#6b6274;font-size:14px}
.search{display:flex;gap:8px;position:sticky;top:0;padding:10px 0;background:#f7f4fb;z-index:3}
input{min-width:0;flex:1;border:2px solid #5f259f;border-radius:15px;padding:14px;font-size:16px;background:#fff}
button{border:0;border-radius:15px;padding:0 18px;font-weight:800;background:#5f259f;color:#fff}
.card{background:#fff;border-radius:20px;padding:18px;margin-top:15px;box-shadow:0 5px 22px #29163b14}
#overview{font-size:16px;line-height:1.65}.meter{display:none;margin-top:12px;font-size:12px;color:#675c70}
.pill{display:inline-block;margin:3px;padding:5px 8px;border-radius:999px;color:#fff;font-weight:700}
.red{background:#c62828}.blue{background:#2467c7}.yellow{background:#d6a600;color:#241d00}.green{background:#27864b}.purple{background:#7b35a8}
small{color:#766c7d}.err{color:#a21d27}.media{margin-top:16px}.media h2{font-size:18px}.mediaGrid{display:grid;gap:12px}.mcard{background:#fff;border:1px solid #e6dfeb;border-radius:18px;padding:12px}.mcard img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:13px}.mcard.videoCard{padding:0;overflow:hidden;background:#111;color:#fff;border:0}.videoVisual{position:relative;aspect-ratio:16/9;background:#000}.videoVisual img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;border-radius:0;display:block}.videoPlay{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none!important;margin:0!important;color:#fff!important;background:#0002;font-size:46px;text-shadow:0 2px 12px #000}.videoBody{padding:14px}.videoBody small{color:#cfc7d6}.videoBody h3{margin:5px 0 7px;font-size:18px;line-height:1.25}.videoBody p{color:#ddd}.videoActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.videoActions a{background:#5f259f;color:#fff!important;padding:8px 10px;border-radius:11px}.videoActions .cardShare{margin:9px 0 0}.mcard h3{margin:8px 0 4px}.mcard p{margin:0;color:#62596a;line-height:1.4}.mcard a{display:inline-block;margin-top:9px;color:#5f259f;font-weight:800;text-decoration:none}.cardShare{display:inline-block;margin:10px 0 0 8px;border:0;border-radius:11px;padding:8px 10px;background:#111;color:#fff;font-weight:900;touch-action:manipulation}
</style></head>
<body><main class="app">
<div class="qtop"><button class="qmenuBtn" id="qmenuBtn" type="button" aria-label="Menu">☰</button><h1>Quantaφ</h1><nav class="qmenu" id="qmenu" hidden><button class="menuWallet" id="qtoken" type="button">∞ Tokens: 0</button><button class="menuWallet" id="qstar" type="button">★ 0.0</button><button id="qshare" type="button">Share +0.1 ★</button><a href="#result">Overview</a><button class="mediaNav" id="qImagesBtn" type="button">Images</button><button class="mediaNav" id="qVideoBtn" type="button">Video</button><button class="mediaNav" id="qSoundBtn" type="button">Sound</button><a href="#media">Media</a></nav></div><p class="sub">Semantic field + 500-word overview + weighted media extensions</p>
<div class="search"><input id="q" autocomplete="off" placeholder="Search anything…"><button id="go">Search</button></div>
<div class="qrefine" id="qrefineWrap" hidden><input id="qrefine" autocomplete="off" placeholder="Refine this entity…"><button id="qrefineBtn" type="button">Refine</button></div><div id="status"></div><section class="card" id="result" hidden><div id="field"></div><article id="overview"></article><div class="meter" id="meter"></div></section><section class="media" id="media" hidden><h2>Media extensions</h2><div class="mediaGrid" id="mediaGrid"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const STOP=new Set("is was are were be been being the a an of and in by with to for from on at as or but if than then that this these those it its he she they them his her their who which when where how".split(" "));
function classify(query){
 const words=(query.match(/[A-Za-z0-9'.-]+/g)||[]);
 return words.map((w,i)=>{
   const x=w.toLowerCase();
   let color='yellow',region='78–90',role='semantic particle';
   if(i===0){color='red';region='90–100';role='seed field'}
   else if(STOP.has(x)){color='green';region='10–20';role='grammar/bond candidate'}
   else if(/ly$/.test(x)){color='purple';region='30–40';role='modifier candidate'}
   else if(/(ing|ed)$/.test(x)){color='green';region='20–30';role='event/action candidate'}
   else if(/(ous|ive|al|ic|ful|less|ary|ory)$/.test(x)){color='purple';region='40–50';role='attribute candidate'}
   else if(i===1){color='blue';region='80–95';role='inner semantic field'}
   return {w,color,region,role};
 });
}
function showField(q){
 const p=classify(q);
 $('#field').innerHTML=p.map(x=>'<span class="pill '+x.color+'" title="'+x.role+' · '+x.region+'">'+x.w+'</span>').join('');
 $('#meter').style.display='block';
 $('#meter').textContent='Experimental regions: '+p.map(x=>x.w+' '+x.region).join(' · ');
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mediaCard(x,type){const img=x.img_src||x.thumbnail_src||x.thumbnail||'',title=x.title||'Explore',url=x.url||location.href,desc=String(x.content||x.description||'').split(/\\s+/).slice(0,100).join(' ');if(String(type).toLowerCase()==='video'){return '<article class="mcard videoCard"><div class="videoVisual">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="'+esc(title)+'">':'')+(x.url?'<a class="videoPlay" target="_blank" rel="noopener" href="'+esc(x.url)+'" aria-label="Play '+esc(title)+'">▶</a>':'')+'</div><div class="videoBody"><small>VIDEO</small><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p><div class="videoActions">'+(x.url?'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">Watch video</a>':'')+'<button class="cardShare" type="button" data-title="'+esc(title)+'" data-url="'+esc(url)+'">Share +0.1 ★</button></div></div></article>'}return '<article class="mcard">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="">':'')+'<small>'+esc(type)+'</small><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'+(x.url?'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">Open source</a>':'')+'<button class="cardShare" type="button" data-title="'+esc(title)+'" data-url="'+esc(url)+'">Share +0.1 ★</button></article>'}
async function loadMedia(q){try{const terms=(q.match(/[A-Za-z0-9]+/g)||[]).filter(x=>!STOP.has(x.toLowerCase())).join(' ');const searches=[terms,terms+' close up detail',terms+' identification variety'];let all=[];for(const term of searches){const u=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');u.search=new URLSearchParams({q:term,format:'json',categories:'images',safesearch:'1'});const j=await fetch(u).then(r=>r.ok?r.json():({results:[]}));all.push(...(j.results||[]))}const seen=new Set(),imgs=all.filter(x=>{const src=x.img_src||x.thumbnail_src||x.thumbnail;if(!src)return false;const k=src.split('?')[0];if(seen.has(k))return false;seen.add(k);return true}).slice(0,8);const vu=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');vu.search=new URLSearchParams({q:terms,format:'json',categories:'videos',safesearch:'1'});const vj=await fetch(vu).then(r=>r.ok?r.json():({results:[]}));const vids=(vj.results||[]).slice(0,4);$('#mediaGrid').innerHTML=imgs.map(x=>mediaCard(x,'Image')).join('')+vids.map(x=>mediaCard(x,'Video')).join('');$('#media').hidden=!(imgs.length||vids.length)}catch(_){$('#media').hidden=true}}
async function search(){
 const q=$('#q').value.trim(); if(!q)return; $('#media').hidden=true; $('#mediaGrid').innerHTML='';
 $('#result').hidden=false; $('#overview').innerHTML=''; showField(q);
 $('#status').innerHTML='<small>Building semantic field and overview…</small>';
 try{
   const searchUrl=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');
   searchUrl.search=new URLSearchParams({q,format:'json',categories:'general',safesearch:'1'});
   const sr=await fetch(searchUrl,{cache:'no-store'});
   const sj=sr.ok?await sr.json():{results:[]};
   const particles=classify(q); const required=particles.filter(x=>!STOP.has(x.w.toLowerCase())).map(x=>x.w.toLowerCase());
   const weighted=(sj.results||[]).map((x,i)=>{const text=((x.title||'')+' '+(x.content||x.description||'')).toLowerCase();const hits=required.filter(w=>text.includes(w)).length;const coverage=required.length?hits/required.length:0;return {...x,_weight:(coverage*100)+(hits*35)+Math.max(0,20-i)};}).sort((a,b)=>b._weight-a._weight);
   const evidence=weighted.slice(0,12).map((x,i)=>({index:i,weight:Math.round(x._weight),title:x.title||'',url:x.url||'',evidence:String(x.content||x.description||'').slice(0,900)})).filter(x=>x.title||x.evidence);
   const instruction=['You are QuantaPhi.','User search: '+q,'Write an accurate, readable AI overview of about 500 words.','The semantic particles from the user query are mandatory constraints, not decoration. Cover every meaningful query concept, prioritizing evidence with the highest supplied weight. Do not replace a specific requested concept with a broad category.','Use the supplied search evidence as grounding. Do not invent unsupported specifics.','Return plain prose only, no JSON and no heading.','Evidence: '+JSON.stringify(evidence)].join('\n');
   const r=await fetch('https://infinity-rogers.marvaseater.workers.dev/v1/chat',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({input:instruction,context:{application:'QuantaPhi',assistant:'grammar-phi-overview-fallback',task:'500-word-overview',verified_context:{query:q,source_count:evidence.length}}})});
   const d=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));
   let text=d.output_text??d.output??d.answer??d.response??d.content??d.message??'';
   if(text&&typeof text==='object')text=text.text||text.content||JSON.stringify(text);
   text=String(text||'').trim();
   if(!text)throw new Error('Empty AI response');
   $('#overview').textContent=text;$('#status').innerHTML='';loadMedia(q);return;
 }catch(e){
   try{
     const searchUrl=new URL('https://orange-brook-a2ac.marvaseater.workers.dev/search');
     searchUrl.search=new URLSearchParams({q,format:'json',categories:'general',safesearch:'1'});
     const sj=await fetch(searchUrl,{cache:'no-store'}).then(r=>r.ok?r.json():({results:[]}));
     const required=classify(q).filter(x=>!STOP.has(x.w.toLowerCase())).map(x=>x.w.toLowerCase());
     const ranked=(sj.results||[]).map((x,i)=>{const body=((x.title||'')+' '+(x.content||x.description||'')).replace(/\\s+/g,' ').trim();const low=body.toLowerCase();const hits=required.filter(w=>low.includes(w)).length;return {body,hits,score:(required.length?hits/required.length:0)*100+hits*35+Math.max(0,20-i)}}).filter(x=>x.body&&x.hits).sort((a,b)=>b.score-a.score);
     let out='',seen=new Set(); for(const r of ranked){for(const s of (r.body.match(/[^.!?]+[.!?]+/g)||[r.body])){const low=s.toLowerCase();if(!required.some(w=>low.includes(w)))continue;const k=low.replace(/[^a-z0-9 ]/g,'').slice(0,100);if(k&&!seen.has(k)){seen.add(k);if((out+' '+s).split(/\\s+/).length>520)break;out+=' '+s.trim()}}if(out.split(/\\s+/).length>470)break}
     if(out.trim()){ $('#overview').textContent=out.trim(); $('#status').innerHTML='<small>Weighted local synthesis · AI provider unavailable</small>'; if(typeof loadMedia==='function')loadMedia(q); return; }
   }catch(_){}
   $('#status').innerHTML='<p class="err">Not enough weighted evidence matched every important search concept.</p>';
 }
}
$('#go').onclick=search; $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script><script>(function(){const b=document.getElementById('qmenuBtn'),m=document.getElementById('qmenu');if(!b||!m)return;b.addEventListener('click',function(){m.hidden=!m.hidden});m.addEventListener('click',function(){m.hidden=true})})();</script><script>(function(){const el=document.getElementById('qtoken'),go=document.getElementById('go'),q=document.getElementById('q');if(!el||!go||!q)return;const key='infinityTokens';function read(){try{return Number(localStorage.getItem(key)||0)}catch(_){return 0}}function show(){el.textContent='∞ Tokens: '+read()}function add(){if(!q.value.trim())return;try{localStorage.setItem(key,read()+1)}catch(_){}show()}show();go.addEventListener('click',add);q.addEventListener('keydown',function(e){if(e.key==='Enter')add()})})();</script><script>(function(){const wrap=document.getElementById('qrefineWrap'),r=document.getElementById('qrefine'),b=document.getElementById('qrefineBtn'),q=document.getElementById('q');if(!wrap||!r||!b||!q)return;function reveal(){if(q.value.trim())wrap.hidden=false}document.getElementById('go').addEventListener('click',reveal);q.addEventListener('keydown',function(e){if(e.key==='Enter')reveal()});function refine(){const extra=r.value.trim(),base=q.value.trim();if(!extra||!base)return;q.value=(base+' '+extra).trim();r.value='';search()}b.addEventListener('click',refine);r.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();refine()}})})();</script><script>(function(){const b=document.getElementById('qshare'),s=document.getElementById('qstar'),q=document.getElementById('q');if(!b||!s)return;const key='starCoins';function read(){try{return Number(localStorage.getItem(key)||0)}catch(_){return 0}}function show(){s.textContent='★ '+read().toFixed(1)}async function share(){const data={title:'Quantaφ',text:q&&q.value.trim()?('Quantaφ: '+q.value.trim()):'Quantaφ',url:location.href};let completed=false;try{if(navigator.share){await navigator.share(data);completed=true}else{await navigator.clipboard.writeText(location.href);completed=true}}catch(_){return}if(completed){if(window.QuantaPhiStarCoins)window.QuantaPhiStarCoins.addShare();else show();b.textContent='Shared +0.1 ★';setTimeout(()=>b.textContent='Share +0.1 ★',1400)}}show();b.addEventListener('click',share)})();</script><script>(function(){document.addEventListener('click',async function(e){const b=e.target.closest('.cardShare');if(!b)return;const key='starCoins',star=document.getElementById('qstar');function read(){try{return Number(localStorage.getItem(key)||0)}catch(_){return 0}}let ok=false;try{const data={title:b.dataset.title||'Quantaφ',text:b.dataset.title||'Quantaφ',url:b.dataset.url||location.href};if(navigator.share){await navigator.share(data);ok=true}else{await navigator.clipboard.writeText(data.url);ok=true}}catch(_){return}if(ok){if(window.QuantaPhiStarCoins)window.QuantaPhiStarCoins.addShare();else if(star)star.textContent='★ '+read().toFixed(1);const t=b.textContent;b.textContent='Shared +0.1 ★';setTimeout(()=>b.textContent=t,1400)}})})();<script>
(function(){
 const KEY='starCoins';
 window.QuantaPhiStarCoins={
  read:function(){try{return Number(localStorage.getItem(KEY)||0)}catch(_){return 0}},
  addShare:function(){let n=this.read()+0.1;try{localStorage.setItem(KEY,n.toFixed(1))}catch(_){}this.render();return n},
  render:function(){const s=document.getElementById('qstar');if(s)s.textContent='★ '+this.read().toFixed(1)}
 };
 window.QuantaPhiStarCoins.render();
})();
</script></script><script>(function(){const media=document.getElementById('media'),grid=document.getElementById('mediaGrid');function openMedia(kind){if(media)media.hidden=false;if(grid){const cards=[...grid.querySelectorAll('.mcard')];cards.forEach(card=>{const t=(card.querySelector('small')?.textContent||'').toLowerCase();card.hidden=(kind!=='all'&&!t.includes(kind))})}if(media)media.scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('qImagesBtn')?.addEventListener('click',()=>openMedia('image'));document.getElementById('qVideoBtn')?.addEventListener('click',()=>openMedia('video'));document.getElementById('qSoundBtn')?.addEventListener('click',()=>openMedia('sound'))})();</script></body></html>
