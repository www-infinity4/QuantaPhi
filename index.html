const $=s=>document.querySelector(s);
const STOP=new Set("is was are were be been being the a an of and in by with to for from on at as or but if than then that this these those it its he she they them his her their who which when where how".split(" "));
function classify(query){
 const words=(query.match(/[A-Za-z0-9'.-]+/g)||[]);
 return words.map((w,i)=>{
   const x=w.toLowerCase();
   let color='yellow',region='78–90',role='semantic particle';
   if(i===0){color='red';region='90–100';role='seed field'}
   else if(STOP.has(x)){color='green';region='10–20';role='grammar/bond candidate'}
   else if(/ly$/.test(x)){color='purple';region='30–40';role='modifier candidate'}
   else if(/(ing|ed)$/.test(x)){color='green';region='20–30';role='event/action candidate'}
   else if(/(ous|ive|al|ic|ful|less|ary|ory)$/.test(x)){color='purple';region='40–50';role='attribute candidate'}
   else if(i===1){color='blue';region='80–95';role='inner semantic field'}
   return {w,color,region,role};
 });
}
const ENTITY_ALIASES={'jackkavorkian':'Jack Kevorkian','jack kavorkian':'Jack Kevorkian','jackkevorkian':'Jack Kevorkian','jack kevorkian':'Jack Kevorkian'};
function normalizedEntity(query){const raw=String(query||'').trim(),key=raw.toLowerCase().replace(/\s+/g,' ');return ENTITY_ALIASES[key]||raw}
const ELEMENT_NAMES={1:'hydrogen',2:'helium',3:'lithium',4:'beryllium',5:'boron',6:'carbon',7:'nitrogen',8:'oxygen',9:'fluorine',10:'neon',11:'sodium',12:'magnesium',13:'aluminium',14:'silicon',15:'phosphorus',16:'sulfur',17:'chlorine',18:'argon',19:'potassium',20:'calcium',21:'scandium',22:'titanium',23:'vanadium',24:'chromium',25:'manganese',26:'iron',27:'cobalt',28:'nickel',29:'copper',30:'zinc',31:'gallium',32:'germanium',33:'arsenic',34:'selenium',35:'bromine',36:'krypton',37:'rubidium',38:'strontium',39:'yttrium',40:'zirconium',41:'niobium',42:'molybdenum',43:'technetium',44:'ruthenium',45:'rhodium',46:'palladium',47:'silver',48:'cadmium',49:'indium',50:'tin',51:'antimony',52:'tellurium',53:'iodine',54:'xenon',55:'caesium',56:'barium',57:'lanthanum',58:'cerium',59:'praseodymium',60:'neodymium',61:'promethium',62:'samarium',63:'europium',64:'gadolinium',65:'terbium',66:'dysprosium',67:'holmium',68:'erbium',69:'thulium',70:'ytterbium',71:'lutetium',72:'hafnium',73:'tantalum',74:'tungsten',75:'rhenium',76:'osmium',77:'iridium',78:'platinum',79:'gold',80:'mercury',81:'thallium',82:'lead',83:'bismuth',84:'polonium',85:'astatine',86:'radon',87:'francium',88:'radium',89:'actinium',90:'thorium',91:'protactinium',92:'uranium',93:'neptunium',94:'plutonium',95:'americium',96:'curium',97:'berkelium',98:'californium',99:'einsteinium',100:'fermium',101:'mendelevium',102:'nobelium',103:'lawrencium',104:'rutherfordium',105:'dubnium',106:'seaborgium',107:'bohrium',108:'hassium',109:'meitnerium',110:'darmstadtium',111:'roentgenium',112:'copernicium',113:'nihonium',114:'flerovium',115:'moscovium',116:'livermorium',117:'tennessine',118:'oganesson'};

const ELEMENT_BY_NAME=Object.fromEntries(Object.entries(ELEMENT_NAMES).map(([n,name])=>[name,{number:Number(n),name,symbol:ELEMENT_SYMBOLS[n]}]));
const ELEMENT_BY_SYMBOL=Object.fromEntries(Object.entries(ELEMENT_SYMBOLS).map(([n,symbol])=>[symbol.toLowerCase(),{number:Number(n),name:ELEMENT_NAMES[n],symbol}]));
function elementIdentity(query){
 const raw=String(query||'').trim(),numberMatch=raw.match(/\belement\s*(?:#|number|no\.?\s*)?(\d{1,3})\b/i);
 if(numberMatch){const n=Number(numberMatch[1]),name=ELEMENT_NAMES[n];return name?{number:n,name,symbol:ELEMENT_SYMBOLS[n]}:null}
 const words=(raw.toLowerCase().match(/[a-z]+/g)||[]);
 for(const word of words){if(ELEMENT_BY_NAME[word])return ELEMENT_BY_NAME[word]}
 const symbolMatch=raw.match(/(?:^|\s)([A-Z][a-z]?)(?:\s|$)/);
 if(symbolMatch&&ELEMENT_BY_SYMBOL[symbolMatch[1].toLowerCase()])return ELEMENT_BY_SYMBOL[symbolMatch[1].toLowerCase()];

}
function elementConflict(text,eid){
 if(!eid)return false;
 const s=' '+String(text||'').toLowerCase().replace(/[^a-z0-9#]+/g,' ')+' ';
 for(const [n,name] of Object.entries(ELEMENT_NAMES)){
  if(Number(n)===eid.number)continue;
  const symbol=ELEMENT_SYMBOLS[n].toLowerCase();
  if(s.includes(' '+name+' ')||s.includes(' element '+n+' ')||s.includes(' atomic number '+n+' ')||s.includes(' element #'+n+' ')||s.includes(' '+symbol+' element '))return true;
 }

}
function entityClause(query){const raw=normalizedEntity(query),words=raw.match(/[A-Za-z0-9][A-Za-z0-9'.-]*/g)||[];if(!words.length)return raw;const lower=words.map(w=>w.toLowerCase());const technical=/\b(schematic|circuit|diagram|radio|receiver|transmitter|am|fm|solid state|transistor|oscillator|amplifier|antenna|power supply|wiring)\b/i.test(raw);if(technical)return raw;const meaningful=words.filter(w=>!STOP.has(w.toLowerCase()));if(!meaningful.length)return raw;const looksName=meaningful.length<=4&&meaningful.slice(0,2).every(w=>/^[A-Z]/.test(w)||ENTITY_ALIASES[raw.toLowerCase()]);return looksName?'"'+meaningful.join(' ')+'"':raw}

 const p=classify(q);

}

function parseAiJson(text){
 const raw=String(text||'').trim().replace(/^\`\`\`(?:json)?\s*/i,'').replace(/\s*\`\`\`$/i,'');
 const start=raw.indexOf('{'),end=raw.lastIndexOf('}');
 if(start<0||end<=start)throw new Error('ai_invalid_json');
 const json=raw.slice(start,end+1);
 try{return JSON.parse(json)}catch(firstError){
  let fixed='',quoted=false,escaped=false;
  for(const char of json){
   if(escaped){fixed+=char;escaped=false;continue}
   if(char==='\\'){fixed+=char;escaped=true;continue}
   if(char==='"'){fixed+=char;quoted=!quoted;continue}
   if(quoted&&char==='\n'){fixed+='\\n';continue}
   if(quoted&&char==='\r'){fixed+='\\r';continue}
   if(quoted&&char==='\t'){fixed+='\\t';continue}
   if(quoted&&char.charCodeAt(0)<32){fixed+=' ';continue}
   fixed+=char
  }
  try{return JSON.parse(fixed)}catch(_){throw firstError}
 }
}
function aiPayloadText(payload){
 const value=payload?.output_text??payload?.output??payload?.answer??payload?.response??payload?.content??payload?.message??'';
 if(typeof value==='string')return value;
 if(value&&typeof value==='object'){
  if(typeof value.text==='string')return value.text;
  if(typeof value.content==='string')return value.content;
  try{return JSON.stringify(value)}catch(_){}
 }
 return String(value||'')
}
