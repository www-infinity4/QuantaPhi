<script>

(function(){const panel=document.getElementById('qhistoryPanel'),list=document.getElementById('qhistoryList'),btn=document.getElementById('qHistoryBtn'),close=document.getElementById('qhistoryClose');function render(){let items=[];try{items=JSON.parse(localStorage.getItem('quantaPhiBuildHistoryV1')||'[]')}catch(_){}list.innerHTML=items.length?items.map(x=>'<button class="qwalletBox" style="display:block;width:100%;text-align:left;color:#21172b" data-q="'+encodeURIComponent(x.query||'')+'"><strong>'+String(x.query||'').replace(/[<>&"]/g,'')+'</strong><br><small>'+new Date(x.created_at).toLocaleString()+'</small></button>').join(''):'<div class="qwalletBox">No searches recorded yet.</div>'}btn?.addEventListener('click',()=>{render();panel.hidden=false;document.getElementById('qmenu').hidden=true});close?.addEventListener('click',()=>panel.hidden=true);list?.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=decodeURIComponent(b.dataset.q);document.getElementById('q').value=q;panel.hidden=true;document.getElementById('go').click()});window.addEventListener('quantaPhiHistoryAdded',()=>{if(!panel.hidden)render()})})();
const $=s=>document.querySelector(s);
const STOP=new Set("is was are were be been being the a an of and in by with to for from on at as or but if than then that this these those it its he she they them his her their who which when where how".split(" "));
function classify(query){
 const words=(query.match(/[A-Za-z0-9'.-]+/g)||[]);
 return words.map((w,i)=>{
   const x=w.toLowerCase();
   let color='yellow',region='78–90',role='semantic particle';
   if(i===0){color='red';region='90–100';role='seed field'}
   else if(STOP.has(x)){color='green';region='10–20';role='grammar/bond candidate'}
   else if(/ly$/.test(x)){color='purple';region='30–40';role='modifier candidate'}
   else if(/(ing|ed)$/.test(x)){color='green';region='20–30';role='event/action candidate'}
   else if(/(ous|ive|al|ic|ful|less|ary|ory)$/.test(x)){color='purple';region='40–50';role='attribute candidate'}
   else if(i===1){color='blue';region='80–95';role='inner semantic field'}
   return {w,color,region,role};
 });
}
const ENTITY_ALIASES={'jackkavorkian':'Jack Kevorkian','jack kavorkian':'Jack Kevorkian','jackkevorkian':'Jack Kevorkian','jack kevorkian':'Jack Kevorkian'};
function normalizedEntity(query){const raw=String(query||'').trim(),key=raw.toLowerCase().replace(/\s+/g,' ');return ENTITY_ALIASES[key]||raw}
const ELEMENT_NAMES={1:'hydrogen',2:'helium',3:'lithium',4:'beryllium',5:'boron',6:'carbon',7:'nitrogen',8:'oxygen',9:'fluorine',10:'neon',11:'sodium',12:'magnesium',13:'aluminium',14:'silicon',15:'phosphorus',16:'sulfur',17:'chlorine',18:'argon',19:'potassium',20:'calcium',21:'scandium',22:'titanium',23:'vanadium',24:'chromium',25:'manganese',26:'iron',27:'cobalt',28:'nickel',29:'copper',30:'zinc',31:'gallium',32:'germanium',33:'arsenic',34:'selenium',35:'bromine',36:'krypton',37:'rubidium',38:'strontium',39:'yttrium',40:'zirconium',41:'niobium',42:'molybdenum',43:'technetium',44:'ruthenium',45:'rhodium',46:'palladium',47:'silver',48:'cadmium',49:'indium',50:'tin',51:'antimony',52:'tellurium',53:'iodine',54:'xenon',55:'caesium',56:'barium',57:'lanthanum',58:'cerium',59:'praseodymium',60:'neodymium',61:'promethium',62:'samarium',63:'europium',64:'gadolinium',65:'terbium',66:'dysprosium',67:'holmium',68:'erbium',69:'thulium',70:'ytterbium',71:'lutetium',72:'hafnium',73:'tantalum',74:'tungsten',75:'rhenium',76:'osmium',77:'iridium',78:'platinum',79:'gold',80:'mercury',81:'thallium',82:'lead',83:'bismuth',84:'polonium',85:'astatine',86:'radon',87:'francium',88:'radium',89:'actinium',90:'thorium',91:'protactinium',92:'uranium',93:'neptunium',94:'plutonium',95:'americium',96:'curium',97:'berkelium',98:'californium',99:'einsteinium',100:'fermium',101:'mendelevium',102:'nobelium',103:'lawrencium',104:'rutherfordium',105:'dubnium',106:'seaborgium',107:'bohrium',108:'hassium',109:'meitnerium',110:'darmstadtium',111:'roentgenium',112:'copernicium',113:'nihonium',114:'flerovium',115:'moscovium',116:'livermorium',117:'tennessine',118:'oganesson'};
const ELEMENT_SYMBOLS={1:'H',2:'He',3:'Li',4:'Be',5:'B',6:'C',7:'N',8:'O',9:'F',10:'Ne',11:'Na',12:'Mg',13:'Al',14:'Si',15:'P',16:'S',17:'Cl',18:'Ar',19:'K',20:'Ca',21:'Sc',22:'Ti',23:'V',24:'Cr',25:'Mn',26:'Fe',27:'Co',28:'Ni',29:'Cu',30:'Zn',31:'Ga',32:'Ge',33:'As',34:'Se',35:'Br',36:'Kr',37:'Rb',38:'Sr',39:'Y',40:'Zr',41:'Nb',42:'Mo',43:'Tc',44:'Ru',45:'Rh',46:'Pd',47:'Ag',48:'Cd',49:'In',50:'Sn',51:'Sb',52:'Te',53:'I',54:'Xe',55:'Cs',56:'Ba',57:'La',58:'Ce',59:'Pr',60:'Nd',61:'Pm',62:'Sm',63:'Eu',64:'Gd',65:'Tb',66:'Dy',67:'Ho',68:'Er',69:'Tm',70:'Yb',71:'Lu',72:'Hf',73:'Ta',74:'W',75:'Re',76:'Os',77:'Ir',78:'Pt',79:'Au',80:'Hg',81:'Tl',82:'Pb',83:'Bi',84:'Po',85:'At',86:'Rn',87:'Fr',88:'Ra',89:'Ac',90:'Th',91:'Pa',92:'U',93:'Np',94:'Pu',95:'Am',96:'Cm',97:'Bk',98:'Cf',99:'Es',100:'Fm',101:'Md',102:'No',103:'Lr',104:'Rf',105:'Db',106:'Sg',107:'Bh',108:'Hs',109:'Mt',110:'Ds',111:'Rg',112:'Cn',113:'Nh',114:'Fl',115:'Mc',116:'Lv',117:'Ts',118:'Og'};
const ELEMENT_BY_NAME=Object.fromEntries(Object.entries(ELEMENT_NAMES).map(([n,name])=>[name,{number:Number(n),name,symbol:ELEMENT_SYMBOLS[n]}]));
const ELEMENT_BY_SYMBOL=Object.fromEntries(Object.entries(ELEMENT_SYMBOLS).map(([n,symbol])=>[symbol.toLowerCase(),{number:Number(n),name:ELEMENT_NAMES[n],symbol}]));
function elementIdentity(query){
 const raw=String(query||'').trim(),numberMatch=raw.match(/\belement\s*(?:#|number|no\.?\s*)?(\d{1,3})\b/i);
 if(numberMatch){const n=Number(numberMatch[1]),name=ELEMENT_NAMES[n];return name?{number:n,name,symbol:ELEMENT_SYMBOLS[n]}:null}
 const words=(raw.toLowerCase().match(/[a-z]+/g)||[]);
 for(const word of words){if(ELEMENT_BY_NAME[word])return ELEMENT_BY_NAME[word]}
 const symbolMatch=raw.match(/(?:^|\s)([A-Z][a-z]?)(?:\s|$)/);
 if(symbolMatch&&ELEMENT_BY_SYMBOL[symbolMatch[1].toLowerCase()])return ELEMENT_BY_SYMBOL[symbolMatch[1].toLowerCase()];
 return null;
}
function elementConflict(text,eid){
 if(!eid)return false;
 const s=' '+String(text||'').toLowerCase().replace(/[^a-z0-9#]+/g,' ')+' ';
 for(const [n,name] of Object.entries(ELEMENT_NAMES)){
  if(Number(n)===eid.number)continue;
  const symbol=ELEMENT_SYMBOLS[n].toLowerCase();
  if(s.includes(' '+name+' ')||s.includes(' element '+n+' ')||s.includes(' atomic number '+n+' ')||s.includes(' element #'+n+' ')||s.includes(' '+symbol+' element '))return true;
 }
 return false;
}
function entityClause(query){const raw=normalizedEntity(query),words=raw.match(/[A-Za-z0-9][A-Za-z0-9'.-]*/g)||[];if(!words.length)return raw;const lower=words.map(w=>w.toLowerCase());const technical=/\b(schematic|circuit|diagram|radio|receiver|transmitter|am|fm|solid state|transistor|oscillator|amplifier|antenna|power supply|wiring)\b/i.test(raw);if(technical)return raw;const meaningful=words.filter(w=>!STOP.has(w.toLowerCase()));if(!meaningful.length)return raw;const looksName=meaningful.length<=4&&meaningful.slice(0,2).every(w=>/^[A-Z]/.test(w)||ENTITY_ALIASES[raw.toLowerCase()]);return looksName?'"'+meaningful.join(' ')+'"':raw}

 const p=classify(q);

}

 async function call(path,opt){const bridge=window.StarQuestCloudLedger;if(!bridge||!bridge.authenticatedFetch)throw new Error('Sign in to StarQuest to use the Quant wallet.');const r=await bridge.authenticatedFetch(API+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||'Quant wallet request failed');return j}
 async function recoverLegacyOnce(){try{if(sessionStorage.getItem('quantaPhiLegacyMigrationChecked')==='1')return;let raw='';try{raw=localStorage.getItem('quantaPhiTokens')||''}catch(_){}if(!raw){try{const m=document.cookie.match(/(?:^|; )quantaPhiTokens=([^;]*)/);raw=m?decodeURIComponent(m[1]):''}catch(_){}}const amount=Number(raw);if(!Number.isSafeInteger(amount)||amount<1){sessionStorage.setItem('quantaPhiLegacyMigrationChecked','1');return}const r=await call('/v1/quants/legacy-migrate',{method:'POST',body:{legacy_amount:amount}});if(r&&r.ok){sessionStorage.setItem('quantaPhiLegacyMigrationChecked','1');try{localStorage.removeItem('quantaPhiTokens')}catch(_){}try{document.cookie='quantaPhiTokens=; Max-Age=0; Path=/; SameSite=Lax'}catch(_){}}}catch(e){msg.textContent='Legacy Quant recovery pending: '+e.message}}
 async function load(){msg.textContent='';try{const r=await call('/v1/quants/receive');await recoverLegacyOnce();const s=await call('/v1/quants/state');document.getElementById('qwalletId').textContent=r.wallet_id;open.textContent='▦ Quants: '+s.balance}catch(e){document.getElementById('qwalletId').textContent='Sign in to load wallet';msg.textContent=e.message}}
 open?.addEventListener('click',()=>{panel.hidden=false;show('receive');load()});close?.addEventListener('click',()=>panel.hidden=true);
 document.getElementById('qwalletReceiveTab')?.addEventListener('click',()=>{show('receive');load()});document.getElementById('qwalletSendTab')?.addEventListener('click',()=>show('send'));
 document.getElementById('qwalletCopy')?.addEventListener('click',async()=>{const v=document.getElementById('qwalletId')?.textContent||'';if(v.startsWith('qw_')){await navigator.clipboard?.writeText(v);msg.textContent='Wallet ID copied.'}});
 review?.addEventListener('click',async()=>{const to=document.getElementById('qwalletRecipient').value.trim(),amount=Number(document.getElementById('qwalletAmount').value);if(!to.startsWith('qw_')||!Number.isSafeInteger(amount)||amount<1){msg.textContent='Enter a valid wallet ID and whole Quant amount.';return}if(review.dataset.confirm!=='1'){review.dataset.confirm='1';review.textContent='Confirm send';msg.textContent='Review: send '+amount+' Quant'+(amount===1?'':'s')+' to '+to+'. Tap Confirm send to finish.';return}review.disabled=true;try{const r=await call('/v1/quants/transfer',{method:'POST',body:{recipient_wallet_id:to,amount,idempotency_key:crypto.randomUUID()}});msg.textContent='Transfer complete: '+(r.transfer_id||r.transfer?.transfer_id||'recorded');review.dataset.confirm='';review.textContent='Review transfer';document.getElementById('qwalletAmount').value='';await load()}catch(e){msg.textContent=e.message}finally{review.disabled=false}});
})();</script></body></html>
