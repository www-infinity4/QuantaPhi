*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#f8f3ff,#fffcf3);color:#352541;font:15px/1.55 system-ui,-apple-system,Roboto,sans-serif}
a{color:#603083}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7339b9;outline-offset:2px}
header.pwp-header{max-width:1100px;margin:auto;padding:23px 15px 12px;display:flex;gap:15px;align-items:center;justify-content:space-between}

.pwp-layout{max-width:1120px;padding:0 12px;margin:auto}.pwp-panel{border:1px solid #d7c0e8;background:#ffffffd9;border-radius:22px;padding:clamp(16px,3vw,24px);margin:16px 0;box-shadow:0 8px 24px #39134e12}
.pwp-panel h2{color:#42215e;margin:3px 0 9px;font-size:23px}.pwp-panel h3{color:#543272;margin:15px 0 6px}.pwp-note{font-size:13px;color:#65536d}
.pwp-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:11px 0}.pwp-action{min-height:44px;padding:10px 14px;border-radius:999px;border:1px solid #a991bf;background:#f2e8fa;color:#4a2770;font:800 13px system-ui;cursor:pointer}
.pwp-action.is-active{background:#4b2772;color:white}
.pwp-input{min-height:44px;border:1px solid #af97bf;border-radius:12px;padding:10px 12px;color:#31203e;background:white;font:14px system-ui;min-width:140px;flex:1 1 180px;max-width:100%}
.pwp-assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}

.pwp-asset{display:flex;gap:12px;border:1px solid #e1d3e9;background:white;border-radius:14px;padding:12px;min-width:0;overflow-wrap:anywhere}
.pwp-asset img{width:90px;height:115px;object-fit:contain;background:#18121b;border-radius:8px;flex-shrink:0}
.pwp-upload{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:146px;height:146px;background:#fcf5ff;border:2px dashed #ab81cf;border-radius:19px;color:#4a2670;cursor:pointer;overflow:hidden;margin:12px 0}
.pwp-upload:focus-within{outline:3px solid #7339b9;outline-offset:3px}
.pwp-upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}
.pwp-upload-plus{font-weight:800;font-size:38px;line-height:1}
.pwp-upload-text{font-size:12px;font-weight:850}
.pwp-upload-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65;pointer-events:none}
.pwp-upload-thumb[hidden]{display:none!important}
.pwp-asset strong{color:#422060;font-size:14px}.pwp-asset a{font-size:12px;font-weight:850}
