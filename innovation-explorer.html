<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Innovation Explorer · Infinity Oracle Octaves</title><style>:root{font-family:system-ui,sans-serif;color:#2c2142;background:#faf8ff}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:24px 18px 72px}header{background:#fff;border-bottom:2px solid #e9ddff;padding:18px}header a{color:#56358c}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.12}p{line-height:1.6;font-size:1.08rem}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{border:1px solid #7858aa;border-radius:16px;padding:12px 18px;min-height:48px;font:inherit;background:#fff;color:#40216d;cursor:pointer}button[aria-pressed=true]{background:#503180;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:18px}article{background:white;border:1px solid #ded1f4;border-radius:20px;padding:24px;box-shadow:0 5px 18px #33205212}article h2{font-size:1.5rem}article a{display:inline-block;min-height:44px;padding:10px 0;color:#503180;font-weight:700}.stage{font-size:.9rem;color:#5b4b75;font-weight:700}small{font-size:.95rem;line-height:1.5;display:block}</style></head><body><header><a href="/">← QuantaPhi</a> · Infinity Oracle Octaves</header><main><h1>Innovation Explorer</h1><p>Solar paint, hydrogen, and unusual energy materials. Explore the science and distinguish prototypes from products. Research sources are not advertisements or proof of commercial readiness.</p><nav class="filters" aria-label="Innovation topics"><button data-topic="all" aria-pressed="true">All</button><button data-topic="solar" aria-pressed="false">Solar</button><button data-topic="hydrogen" aria-pressed="false">Hydrogen</button><button data-topic="materials" aria-pressed="false">Materials</button></nav><section class="cards" id="cards" aria-live="polite"></section></main><script type="module">import {filterInnovations} from './innovation-explorer-core.mjs';const cards=document.querySelector('#cards');function render(topic){cards.replaceChildren();for(const item of filterInnovations(topic)){const article=document.createElement('article');const stage=document.createElement('p');stage.className='stage';stage.textContent=item.stage;const h=document.createElement('h2');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.summary;const note=document.createElement('small');note.textContent=item.claims;const link=document.createElement('a');link.href=item.source;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Research source ↗';article.append(stage,h,p,note,link);cards.append(article);}if(!cards.children.length)cards.textContent='No matching research cards yet.';document.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.topic===topic)));}document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.topic)));render('all');</script></body></html>
