<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPT · Phi</title>
<meta name="description" content="GPT inside QuantaPhi.">
<style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color:#17131f;background:#f7f4fb}
*{box-sizing:border-box}body{margin:0}.wrap{width:min(780px,calc(100% - 24px));margin:auto;padding:18px 0 36px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:54px;height:54px;border-radius:18px;background:#111;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:950}.head h1{margin:0;font-size:26px}.head p{margin:3px 0 0;color:#6b6274}
.chat{background:#fff;border:1px solid #ded3e6;border-radius:22px;box-shadow:0 6px 24px #29163b12;overflow:hidden}
.messages{min-height:48vh;max-height:66vh;overflow:auto;padding:16px;display:grid;gap:12px}
.msg{max-width:90%;padding:12px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user{justify-self:end;background:#5f259f;color:#fff}.assistant{justify-self:start;background:#f0e4fa;color:#24182e}.status{color:#7b6f83;font-size:12px;padding:0 16px 8px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #e8e1ed;background:#fbf9fc}textarea{min-height:54px;max-height:160px;resize:vertical;flex:1;border:2px solid #5f259f;border-radius:14px;padding:12px;font:inherit}button{border:0;border-radius:14px;background:#5f259f;color:#fff;padding:0 18px;font-weight:900}.hint{margin-top:10px;color:#766c7d;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><div class="mark">GPT</div><div><h1>GPT inside Phi</h1><p>Ask here without leaving QuantaPhi.</p></div></div>
  <section class="chat" aria-label="Phi GPT">
    <div class="messages" id="messages"><div class="msg assistant">I’m connected through the Phi AI gateway. What do you want to work on?</div></div>
    <div class="status" id="status">Ready</div>
    <form id="form">
      <textarea id="input" placeholder="Ask GPT…" aria-label="Ask GPT"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  <p class="hint">This is the Phi-owned GPT surface. It uses the same QuantaPhi AI gateway and remains inside quantaphi.org.</p>
</main>
<script>
(function(){
 const form=document.getElementById('form'),input=document.getElementById('input'),messages=document.getElementById('messages'),status=document.getElementById('status');
 const userId=(()=>{const key='quantaPhi:gptUser:v1';try{let v=localStorage.getItem(key);if(v)return v;v='phi-'+crypto.randomUUID();localStorage.setItem(key,v);return v}catch{return 'phi-guest'}})();
 const add=(text,kind)=>{const d=document.createElement('div');d.className='msg '+kind;d.textContent=String(text||'');messages.appendChild(d);messages.scrollTop=messages.scrollHeight};
 form.addEventListener('submit',async event=>{
   event.preventDefault();const q=input.value.trim();if(!q)return;input.value='';add(q,'user');status.textContent='Thinking…';
   try{
     const r=await fetch('https://infinity-rogers.marvaseater.workers.dev/v1/chat',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({userId,input:q,context:{application:'QuantaPhi',surface:'Phi GPT button',requireCloudflare:true,task:'general-chat'}})});
     const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));
     add(data.output||data.output_text||data.answer||'No response returned.','assistant');
     status.textContent=data.model?'Ready · '+data.model:'Ready';
   }catch(error){add('Phi GPT is temporarily unavailable: '+String(error.message||error),'assistant');status.textContent='Unavailable'}
 });
})();
</script>
</body>
</html>
