<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/zeus-discovery-carousel.css"><script type="module" src="/zeus-discovery-carousel.mjs"></script>
<style>body{margin:0;padding:16px;background:#f7f9fa;font-family:system-ui}main{max-width:1040px;margin:0 auto;min-width:0}</style></head>
<body><main><section id="oracleCardDeck" aria-label="Original Quick Cards">Original carousel remains above Zeus.</section>
<section id="zeusDiscoveryCarousel" aria-labelledby="zeusDiscoveryHeading" aria-roledescription="carousel" class="zeus-discovery-carousel">
 <div class="zdc-head"><div><p class="zdc-eyebrow">INFINITY® · MODELS & CREATOR TOOLS</p>
 <h2 id="zeusDiscoveryHeading">Zeus · Watch and choose an AI experience</h2>
 <p>Scroll into a second independent carousel and choose an experience to open.</p></div></div>
 <div class="zdc-tabs" role="group" aria-label="Choose Zeus discovery collection">
  <button type="button" data-zeus-tab="all" aria-pressed="true">All</button>
  <button type="button" data-zeus-tab="infinity" aria-pressed="false">Infinity editions</button>
  <button type="button" data-zeus-tab="creator" aria-pressed="false">Creator GPTs &amp; plugins</button>
 </div>
 <div class="zdc-controls" role="group" aria-label="Zeus carousel controls">
  <button id="zeusDiscoverPrevious" type="button" aria-label="Previous Zeus discovery card">‹ Previous</button>
  <p id="zeusDiscoverStatus" role="status" aria-live="polite">Loading Zeus discovery…</p>
  <button id="zeusDiscoverNext" type="button" aria-label="Next Zeus discovery card">Next ›</button>
  <button id="zeusDiscoverPlay" type="button" aria-pressed="false">Watch</button>
  <button id="zeusDiscoverFullscreen" type="button">Fullscreen for screen cast</button>
 </div>
 <div id="zeusDiscoverStage" class="zdc-track" role="region" aria-label="Zeus and verified creator discovery slides" tabindex="0" aria-live="off"></div>
 <p class="zdc-cast-note">Use Android Screen Cast to mirror this section.</p>
 <span id="zeusDiscoverChoose" hidden></span>
</section></main></body></html>
